  <div class="frame">

    <h1>Tarkista saatavuus ennen käyttöönottoa</h1>
    <div class="diagram-container" tabindex="0" role="region" aria-label="Tarkista saatavuus ennen käyttöönottoa. Vieritä vaakasuunnassa tarkastellaksesi.">
      <svg viewBox="0 0 704 1100" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="model-feature-baseline-light-title model-feature-baseline-light-desc">

        <desc id="model-feature-baseline-light-desc">Kirjaa erilliset määrittämättömien GA-mallien ja -ominaisuuksien oletukset, tarkista mallin julkaisutila ja rajoitukset, tee nimenomainen päätös ja varmista kelpoisen käyttäjän kokemus.</desc>

        <rect x="0" y="0" width="704" height="1100" fill="#f3f5f7"/>

        <path d="M 352 316 L 400 316 A 8 8 0 0 1 408 324 L 408 444 A 8 8 0 0 0 416 452 L 560 452 A 8 8 0 0 1 568 460 L 568 492" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="416" y="392" width="85" height="12" rx="2" fill="#f3f5f7"/><text x="458.5" y="401" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="8" font-weight="400">ESIVERSIO/POIKKEUS</text>

        <text x="352.0" y="92.0" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Malli vai</text>

        <polygon points="224,244 352,316 224,388 96,316" fill="#eaf6ed" stroke="#1a7f37" stroke-width="1.5"/>
        <text x="224.0" y="312.0" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Mallin tila</text>
        <text x="224.0" y="328.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="400">+ poikkeukset?</text>
        <rect x="464" y="260" width="200" height="112" rx="6" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <text x="564.0" y="304.0" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Ominaisuuden oletus</text>
        <text x="564.0" y="320.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Kirjaa määrittämättömän</text>
        <text x="564.0" y="336.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">GA-ominaisuuden saatavuus</text>
        <rect x="40" y="492" width="192" height="112" rx="6" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <text x="136.0" y="536.0" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Tilaa ei varmistettu</text>

        <text x="136.0" y="568.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">oma dokumentaatio vahvistaa sen</text>
        <rect x="256" y="492" width="192" height="112" rx="6" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <text x="352.0" y="536.0" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">GA-mallin oletus</text>
        <text x="352.0" y="552.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Ei asetusta eikä poikkeusta</text>
        <text x="352.0" y="568.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Ei istunnon oletusmalli</text>
        <rect x="472" y="492" width="192" height="112" rx="6" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <text x="568.0" y="536.0" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Mallikohtainen tarkistus</text>
        <text x="568.0" y="552.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Esiversio tai lueteltu poikkeus:</text>
        <text x="568.0" y="568.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">tarkista tila ja rajoitukset</text>
        <rect x="192" y="728" width="320" height="80" rx="6" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <text x="352.0" y="756.0" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Nimenomainen saatavuuspäätös</text>
        <text x="352.0" y="772.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Ota käyttöön, poista tai delegoi</text>
        <text x="352.0" y="788.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Käytä soveltuvaa hallintatilaa</text>
        <rect x="192" y="864" width="320" height="64" rx="20" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <text x="352.0" y="892.0" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Varmista kelpoisella testikäyttäjällä</text>
        <text x="352.0" y="908.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Tarkista todelliset asetukset ja kokemus</text>
        <text x="40" y="976" text-anchor="start" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Yritystiimien pääsy on erillinen, valinnainen julkisen esiversion päätös.</text>
        <text x="40" y="992" text-anchor="start" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Se käyttää yksinomaista tiimipohjaista tilaa: käytä harkiten.</text>
        <line x1="40" y1="1040" x2="664" y2="1040" stroke="#d1d9e0"/>
        <text x="40" y="1064" text-anchor="start" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="9" font-weight="400">Soikio: alku/loppu; suorakulmio: toiminto; vinoneliö: päätös; nuoli: seuraava vaihe</text>
        <text x="40" y="1084" text-anchor="start" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="9" font-weight="400">Vihreä laatikko: oppiaihe, ei hyväksyntä tai turvallisuusarvio</text>
      </svg>
