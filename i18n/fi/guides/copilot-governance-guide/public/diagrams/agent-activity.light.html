<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Valitse näyttö huolellisesti</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif; background: #f3f5f7; color: #1f2328; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 704px; min-width: 0; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow { font-size: .66rem; color: #59636e; margin-bottom: .5rem; }
    h1 { font-size: 1.75rem; line-height: 1.15; margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 704px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Hallintaopas · Vuokaavio</p>
    <h1>Valitse näyttö huolellisesti</h1>
    <div class="diagram-container" tabindex="0" role="region" aria-label="Valitse näyttö huolellisesti. Vieritä vaakasuunnassa tarkastellaksesi.">
      <svg viewBox="0 0 704 824" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="agent-activity-light-title agent-activity-light-desc">
        <title id="agent-activity-light-title">Valitse näyttö huolellisesti</title>
        <desc id="agent-activity-light-desc">Käytä ensin riittävää olemassa olevaa istunto- tai auditointinäyttöä; arvioi muutoin valinnainen keruu ja esiversion kelpoisuus, minimoi keruu ja ehdota yksityisyyden suojakeinoja ennen muutoksia.</desc>
        <defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#59636e"/></marker></defs>
        <rect x="0" y="0" width="704" height="824" fill="#f3f5f7"/>
        <path d="M 352 112 L 464 112" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="395.75" y="92" width="24.5" height="12" rx="2" fill="#f3f5f7"/><text x="408" y="101" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="8" font-weight="400">KYLLÄ</text>
        <path d="M 224 184 L 224 252" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="232" y="210" width="19" height="12" rx="2" fill="#f3f5f7"/><text x="241.5" y="219" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="8" font-weight="400">EI</text>
        <path d="M 224 364 L 224 412" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#arrow)"/>
        <path d="M 224 508 L 224 556" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#arrow)"/>
        <polygon points="224,40 352,112 224,184 96,112" fill="#eaf6ed" stroke="#1a7f37" stroke-width="1.5"/>
        <text x="224.0" y="108.0" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Vastaako olemassa</text>
        <text x="224.0" y="124.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="400">oleva tieto?</text>
        <rect x="464" y="72" width="200" height="80" rx="20" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <text x="564.0" y="108.0" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Käytä sitä; kirjaa rajaus</text>
        <text x="564.0" y="124.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Istuntonäkymä tai auditointitieto</text>
        <rect x="64" y="252" width="320" height="112" rx="6" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <text x="224.0" y="280.0" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Arvioi valinnainen keruu</text>
        <text x="224.0" y="296.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Telemetria; istuntojen auditointisuoratoisto</text>
        <text x="224.0" y="312.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Suoratoisto: EMU tai GHE Cloud ja datan sijainti</text>
        <text x="224.0" y="328.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Julkinen esiversio: käytä harkiten</text>
        <text x="224.0" y="344.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Varmista käytettävä ympäristö ja kelpoisuus</text>
        <rect x="64" y="412" width="320" height="96" rx="6" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <text x="224.0" y="448.0" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Valitse vähimmäistiedot</text>
        <text x="224.0" y="464.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Oletus false; kehotteet ja työkalujen sisältö</text>
        <text x="224.0" y="480.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">ylittävät tämän kysymyksen tarpeen</text>
        <rect x="64" y="556" width="320" height="96" rx="20" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <text x="224.0" y="592.0" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Ehdota pääsyn ja säilytyksen hallintaa</text>
        <text x="224.0" y="608.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Keskustele tietosuojan kanssa ennen muutoksia</text>
        <text x="224.0" y="624.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Tämä on näyttösuunnitelma, ei määritys</text>
        <text x="40" y="700" text-anchor="start" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Identiteettikeruu tunnistaa yhä Copilot-tilin, käyttöjärjestelmän käyttäjän ja koneen.</text>
        <text x="40" y="716" text-anchor="start" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Pelkkä tieto ei osoita valtuutusta tai muutoksen tulosta.</text>
        <line x1="40" y1="764" x2="664" y2="764" stroke="#d1d9e0"/>
        <text x="40" y="788" text-anchor="start" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="9" font-weight="400">Soikio: alku/loppu; suorakulmio: toiminto; vinoneliö: päätös; nuoli: seuraava vaihe</text>
        <text x="40" y="808" text-anchor="start" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="9" font-weight="400">Vihreä laatikko: oppiaihe, ei hyväksyntä tai turvallisuusarvio</text>
      </svg>
    </div>
  </div>
</body>
</html>
