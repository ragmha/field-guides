        <path d="M 344 656 L 472 656" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#consumption-controls-light-arrow)"/><rect x="395.75" y="636" width="24.5" height="12" rx="2" fill="#f3f5f7"/><text x="408" y="645" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="8" font-weight="400">KYLLÄ</text>
        <path d="M 232 712 L 232 780" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#consumption-controls-light-arrow)"/><rect x="240" y="740" width="19" height="12" rx="2" fill="#f3f5f7"/><text x="249.5" y="749" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="8" font-weight="400">EI</text>
        <rect x="72" y="40" width="320" height="48" rx="20" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <text x="232.0" y="68.0" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Krediittejä kuluttava pyyntö</text>
        <rect x="72" y="128" width="320" height="96" rx="6" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <text x="232.0" y="164.0" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Selvitä soveltuva ULB</text>
        <text x="232.0" y="180.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Henkilökohtainen &gt; kustannuspaikka &gt; yleinen</text>
        <text x="232.0" y="196.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Ensimmäinen asetettu, ei pienin summa</text>
        <polygon points="232,264 344,320 232,376 120,320" fill="#eaf6ed" stroke="#1a7f37" stroke-width="1.5"/>
        <text x="232.0" y="316.0" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">ULB</text>
        <text x="232.0" y="332.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="400">käytetty loppuun?</text>
        <rect x="472" y="280" width="192" height="80" rx="20" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <text x="568.0" y="308.0" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Ehdoton pysäytys</text>
        <text x="568.0" y="324.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Varannon tai mittarin tila</text>
        <text x="568.0" y="340.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">ei ohita sitä</text>
        <polygon points="232,432 344,488 232,544 120,488" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <text x="232.0" y="484.0" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Sisältyvän käytön</text>
        <text x="232.0" y="500.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="400">vaihe?</text>
        <rect x="472" y="448" width="192" height="80" rx="20" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <text x="568.0" y="476.0" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Sisältyvän käytön hallinta</text>
        <text x="568.0" y="492.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Yhteinen varanto ja kustannuspaikan</text>
        <text x="568.0" y="508.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">sisältyvän käytön rajoitus</text>
        <polygon points="232,600 344,656 232,712 120,656" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <text x="232.0" y="652.0" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Mittariperusteinen</text>
        <text x="232.0" y="668.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="400">käyttö sallittu?</text>
        <rect x="472" y="616" width="192" height="80" rx="20" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <text x="568.0" y="644.0" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Mittariperusteinen käyttö</text>
        <text x="568.0" y="660.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Maksullisen käytön käytäntö sallii;</text>
        <text x="568.0" y="676.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">mikään pakotettu raja ei estä</text>
        <rect x="72" y="780" width="320" height="64" rx="20" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <text x="232.0" y="808.0" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Mittariperusteinen käyttö estetty</text>
        <text x="232.0" y="824.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Maksukäytäntö tai soveltuva pakotettu raja</text>
        <text x="40" y="892" text-anchor="start" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Mittariperusteiset menorajat pysäyttävät vain, kun ne on määritetty niin.</text>
        <text x="40" y="908" text-anchor="start" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Nämä erilliset rajoitukset pätevät, kun ULB sallii pyynnön.</text>
        <line x1="40" y1="956" x2="664" y2="956" stroke="#d1d9e0"/>
        <text x="40" y="980" text-anchor="start" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="9" font-weight="400">Soikio: alku/loppu; suorakulmio: toiminto; vinoneliö: päätös; nuoli: seuraava vaihe</text>
        <text x="40" y="1000" text-anchor="start" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="9" font-weight="400">Vihreä laatikko: oppiaihe, ei hyväksyntä tai turvallisuusarvio</text>
      </svg>
