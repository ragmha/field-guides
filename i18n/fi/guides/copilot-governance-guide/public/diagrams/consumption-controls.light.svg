        <path d="M 344 488 L 472 488" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#consumption-controls-light-arrow)"/><rect x="395.75" y="468" width="24.5" height="12" rx="2" fill="#f3f5f7"/><text x="408" y="477" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="8" font-weight="400">KYLLÄ</text>
