        <desc id="instructions-context-dark-desc">Valitse tuettu ohjeiden laajuus, kirjoita tehtävään sopiva ohjeistus ja toista tehtävä uudessa istunnossa. Tarkenna ohjeita, jos vastauksesta puuttuu vastaava suoritusnäyttö.</desc>

        <path d="M 40 596 L 32 596 A 8 8 0 0 1 24 588 L 24 200 A 8 8 0 0 1 32 192 L 192 192" fill="none" stroke="#9198a1" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow)"/><rect x="87.5" y="172" width="41" height="12" rx="2" fill="#07090d"/><text x="108" y="181" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="8" font-weight="400">TARKENNA</text>

        <text x="352.0" y="68.0" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Valitse yleisölle sopiva laajuus</text>
        <text x="352.0" y="84.0" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Henkilökohtainen, repository tai organisaatio</text>

        <text x="352.0" y="188.0" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Kirjoita tehtävään sopiva ohje</text>

        <text x="352.0" y="436.0" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Vastaako todellista</text>
        <text x="352.0" y="452.0" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="400">testitulosta?</text>
        <rect x="472" y="556" width="192" height="80" rx="20" fill="#0d1117" stroke="#9198a1" stroke-width="1.5"/>
        <text x="568.0" y="592.0" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Säilytä ihmisen tarkastuksella</text>

        <rect x="40" y="556" width="192" height="80" rx="6" fill="#0d1117" stroke="#9198a1" stroke-width="1.5"/>
        <text x="136.0" y="592.0" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Tarkenna ohjeita</text>
        <text x="136.0" y="608.0" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Pelkkä komento ei ole suoritus</text>
        <text x="40" y="684" text-anchor="start" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Ohjeet eivät ole deterministisiä: ne eivät ole käyttöoikeuksia tai tarkistusta.</text>
        <line x1="40" y1="732" x2="664" y2="732" stroke="#3d444d"/>
        <text x="40" y="756" text-anchor="start" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="9" font-weight="400">Suorakulmio: toiminto; vinoneliö: päätös; soikio: tulos; katkoviiva: tarkennus</text>
        <text x="40" y="776" text-anchor="start" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="9" font-weight="400">Vihreä laatikko: oppiaihe, ei hyväksyntä tai turvallisuusarvio</text>
