<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Käytä täydentäviä suojauksia</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif; background: #f3f5f7; color: #1f2328; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 704px; min-width: 0; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow { font-size: .66rem; color: #59636e; margin-bottom: .5rem; }
    h1 { font-size: 1.75rem; line-height: 1.15; margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 704px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Hallintaopas · Layer stack · Compensating security layers</p>
    <h1>Käytä täydentäviä suojauksia</h1>
    <div class="diagram-container" tabindex="0" role="region" aria-label="Käytä täydentäviä suojauksia. Vieritä vaakasuunnassa tarkastellaksesi.">
      <svg viewBox="0 0 704 812" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sensitive-content-light-title sensitive-content-light-desc">
        <title id="sensitive-content-light-title">Käytä täydentäviä suojauksia</title>
        <desc id="sensitive-content-light-desc">Tuetut sisällön poissulut jättävät pääsyaukkoja, joten rajoita erikseen repositorion ja tiedostojärjestelmän käyttöä ja tarkastele ulkoisia työkaluja sekä huomioi nimenomainen jäännösriski.</desc>
        <defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#59636e"/></marker></defs>
        <rect x="0" y="0" width="704" height="812" fill="#f3f5f7"/>
        <path d="M 40 100 L 40 572" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#arrow)"/>
        <path d="M 368 172 L 368 196" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#arrow)"/>
        <path d="M 368 252 L 368 300" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#arrow)"/>
        <path d="M 368 372 L 368 400" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#arrow)"/>
        <path d="M 368 444 L 368 500" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#arrow)"/>
        <path d="M 368 572 L 368 600" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#arrow)"/>
        <text x="40" y="52" text-anchor="start" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">RISKI: arkaluonteinen tiedosto päätyy Copilotille tai yhdistetylle työkalulle</text>
        <text x="92" y="216" text-anchor="start" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">AUKOT: tukematon asiakas/tila; epäsuora pääsy, kolmannen osapuolen MCP,</text>
        <text x="92" y="232" text-anchor="start" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">symboliset linkit ja etätiedostojärjestelmät. Rajoita pääsy erikseen.</text>
        <text x="92" y="424" text-anchor="start" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">JÄÄNNÖS: ulkoisella työkalulla voi olla omat käyttöoikeudet.</text>
        <text x="92" y="624" text-anchor="start" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">JÄÄNNÖS: tarkistus ja ehdotettu poissulku eivät osoita toimeenpanoa.</text>
        <rect x="72" y="100" width="592" height="72" rx="6" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <text x="368.0" y="132.0" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">L1 – Sisällön poissulku tuetuissa käyttökokemuksissa</text>
        <text x="368.0" y="148.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Hallintakeino: sulje polut pois; tarkista käytetyn asiakkaan ja tilan matriisi</text>
        <rect x="72" y="300" width="592" height="72" rx="6" fill="#eaf6ed" stroke="#1a7f37" stroke-width="1.5"/>
        <text x="368.0" y="332.0" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">L2 – Erilliset repositoryn ja käyttöjärjestelmän/tiedostojärjestelmän rajoitukset</text>
        <text x="368.0" y="348.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Hallintakeino: rajoita arkaluonteisen aineiston lukuoikeuksia</text>
        <rect x="72" y="500" width="592" height="72" rx="6" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <text x="368.0" y="532.0" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">L3 – Tarkista kolmannen osapuolen työkalujen pääsy erikseen</text>
        <text x="368.0" y="548.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Hallintakeino: tarkista ulkoisen työkalun omat käyttöoikeudet</text>
        <text x="40" y="688" text-anchor="start" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Jäännösriski: poissulku ei ole tiedostojärjestelmän tietoturvaraja.</text>
        <text x="40" y="704" text-anchor="start" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Merkintä on ehdotus, ei näyttö tallennuksesta tai toimeenpanosta; hanki valtuutettu näyttö.</text>
        <line x1="40" y1="752" x2="664" y2="752" stroke="#d1d9e0"/>
        <text x="40" y="776" text-anchor="start" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="9" font-weight="400">Palkit: täydentävät kerrokset; nuolet: jäännösaltistus, ei näyttö toimeenpanosta</text>
        <text x="40" y="796" text-anchor="start" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="9" font-weight="400">Vihreä laatikko: oppiaihe, ei hyväksyntä tai turvallisuusarvio</text>
      </svg>
    </div>
  </div>
</body>
</html>
