    <h1>Arvioi MCP-palvelimen merkintä</h1>

        <desc id="agent-tools-network-dark-desc">Tarkista hallitun sallittujen luettelon laajuus, sisäänrakennetut oletukset, eston etusija ja kaikki käyttöön otetut luettelot sekä tarkastele erikseen niiden ulkopuolisia profiileja ja tunnistetietoja.</desc>

        <rect x="464" y="56" width="200" height="112" rx="6" fill="#0d1117" stroke="#9198a1" stroke-width="1.5"/>
        <text x="564.0" y="100.0" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Tarkista erikseen</text>
        <text x="564.0" y="116.0" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Repositorion agenttiprofiili:</text>
        <text x="564.0" y="132.0" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">suoritus, verkko, tunnisteet</text>

        <text x="224.0" y="484.0" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Estosääntö</text>
        <text x="224.0" y="500.0" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="400">täsmää?</text>
        <rect x="464" y="448" width="200" height="80" rx="20" fill="#0d1117" stroke="#9198a1" stroke-width="1.5"/>
        <text x="564.0" y="476.0" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Estetty</text>
        <text x="564.0" y="492.0" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Esto voittaa; virheellinen luettelo tai</text>
        <text x="564.0" y="508.0" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">ratkaisematon muuttuja estää myös</text>

        <text x="224.0" y="852.0" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Sallittu näillä säännöillä</text>
        <text x="224.0" y="868.0" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Muut: kelvolliset luettelot, ratkaistut muuttujat</text>
        <text x="224.0" y="884.0" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Tunnisteet voivat yhä olla liian laajat</text>
        <text x="40" y="944" text-anchor="start" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Laajuus: käyttäjän/repositorion asetukset tuetuissa asiakasohjelmissa tai pilvihiekkalaatikoissa.</text>
        <text x="40" y="960" text-anchor="start" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Muut kuin sisäänrakennetut vaativat myös kelvolliset luettelot ja ratkaistut muuttujat.</text>
        <text x="40" y="1008" text-anchor="start" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Palomuuri: Bashin käynnistämät prosessit, ei MCP- tai määritysvaiheiden prosesseja.</text>
        <text x="40" y="1024" text-anchor="start" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Pilviagentilla ja koodin tarkistuksella on eri asetukset; ohitukset ovat mahdollisia.</text>
        <text x="40" y="1040" text-anchor="start" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Tämä ei ole kattava tietojen ulosviennin suojaus.</text>
        <line x1="40" y1="1088" x2="664" y2="1088" stroke="#3d444d"/>
        <text x="40" y="1112" text-anchor="start" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="9" font-weight="400">Soikio: alku/loppu; suorakulmio: toiminto; vinoneliö: päätös; nuoli: seuraava vaihe</text>
        <text x="40" y="1132" text-anchor="start" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="9" font-weight="400">Vihreä laatikko: oppiaihe, ei hyväksyntä tai turvallisuusarvio</text>
