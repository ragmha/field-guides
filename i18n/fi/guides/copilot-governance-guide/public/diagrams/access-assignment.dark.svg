<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 704 800" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="access-assignment-dark-title access-assignment-dark-desc" id="access-assignment-dark-root">
        <title id="access-assignment-dark-title">Kaksi tietä käyttöpaikkaan</title>
        <desc id="access-assignment-dark-desc">Tarkista edellytykset, valitse palvelupaketin tukema suora tai organisaation määritystapa ja tarkista repositorion käyttöoikeus erikseen.</desc>
        <defs>
      <style>#access-assignment-dark-root { font-family: -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif; color: #f0f6fc; }
      #access-assignment-dark-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#access-assignment-dark-root .diagram-container { overflow-x: visible; }
}</style><marker id="access-assignment-dark-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#9198a1"/></marker></defs>
        <rect x="0" y="0" width="704" height="800" fill="#07090d"/>
