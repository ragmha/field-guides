        <path d="M 240 288 L 192 288 A 8 8 0 0 0 184 296 L 184 412" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#access-assignment-dark-arrow)"/><rect x="192" y="346" width="41" height="12" rx="2" fill="#07090d"/><text x="212.5" y="355" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="8" font-weight="400">SUORA</text>
        <path d="M 464 288 L 512 288 A 8 8 0 0 1 520 296 L 520 412" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#access-assignment-dark-arrow)"/><rect x="528" y="346" width="74" height="12" rx="2" fill="#07090d"/><text x="565.0" y="355" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="8" font-weight="400">ORGANISAATIO</text>
        <path d="M 184 508 L 184 548" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#access-assignment-dark-arrow)"/>
        <rect x="192" y="40" width="320" height="48" rx="20" fill="#0d1117" stroke="#9198a1" stroke-width="1.5"/>
        <text x="352.0" y="68.0" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Copilot-käyttöpaikan tarve</text>
        <rect x="192" y="128" width="320" height="64" rx="6" fill="#0d1117" stroke="#9198a1" stroke-width="1.5"/>
        <text x="352.0" y="156.0" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Tarkista ennen määritystä</text>
        <text x="352.0" y="172.0" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Käytännöt, budjetit ja verkkovaatimukset</text>
        <polygon points="352,232 464,288 352,344 240,288" fill="#102219" stroke="#3fb950" stroke-width="1.5"/>
        <text x="352.0" y="284.0" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Määritys-</text>
        <text x="352.0" y="300.0" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="400">tapa?</text>
        <rect x="40" y="412" width="288" height="96" rx="6" fill="#0d1117" stroke="#9198a1" stroke-width="1.5"/>
        <text x="184.0" y="448.0" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Suora: yrityksen omistaja</text>
        <text x="184.0" y="464.0" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Määritä henkilöille tai yritystiimeille</text>
        <text x="184.0" y="480.0" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Copilot access tai Copilot Business</text>
        <rect x="376" y="412" width="288" height="96" rx="6" fill="#0d1117" stroke="#9198a1" stroke-width="1.5"/>
        <text x="520.0" y="448.0" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Organisaation määritys</text>
        <text x="520.0" y="464.0" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Business tai Enterprise: yritys sallii organisaatiot</text>
        <text x="520.0" y="480.0" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Organisaation omistaja valitsee ja ylläpitää paikat</text>
        <rect x="40" y="548" width="288" height="80" rx="6" fill="#0d1117" stroke="#9198a1" stroke-width="1.5"/>
        <text x="184.0" y="584.0" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Tarkista delegoidun käytännön oletus</text>
        <text x="184.0" y="600.0" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Policies for enterprise-assigned users</text>
        <text x="40" y="676" text-anchor="start" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Repositorion käyttöoikeus on erillinen: repositorion omistaja päättää.</text>
        <text x="40" y="692" text-anchor="start" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Pelkkä ehdotus ei määritä käyttöpaikkaa tai tosiasiallista käyttöoikeutta.</text>
        <line x1="40" y1="740" x2="664" y2="740" stroke="#3d444d"/>
        <text x="40" y="764" text-anchor="start" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="9" font-weight="400">Soikio: alku/loppu; suorakulmio: toiminto; vinoneliö: päätös; nuoli: seuraava vaihe</text>
        <text x="40" y="784" text-anchor="start" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="9" font-weight="400">Vihreä laatikko: oppitunnin painotus, ei hyväksyntä tai turvallisuusluokitus</text>
      </svg>
