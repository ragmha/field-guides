<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="regulation-comparison-title regulation-comparison-desc">
<title id="regulation-comparison-title">Sääntelyn painopisteet</title><desc id="regulation-comparison-desc">Lait käsittelevät eri riskejä ja niitä sovelletaan vain, kun niiden soveltamisalan ja soveltuvien kansallisten sääntöjen ehdot täyttyvät. Opas ei ole oikeudellista neuvontaa.</desc>
