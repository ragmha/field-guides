  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" fill="#1f2328" font-size="11" font-weight="600" class="ink">
    <text x="148" y="36" text-anchor="middle">Tietosuoja</text>
    <text x="268" y="276" text-anchor="middle">Lain ulottuvuus</text>
    <text x="388" y="36" text-anchor="middle">Häiriönsieto</text>
    <text x="552" y="147" text-anchor="middle">Alustasi</text><text x="552" y="164" text-anchor="middle">hallinta</text>
