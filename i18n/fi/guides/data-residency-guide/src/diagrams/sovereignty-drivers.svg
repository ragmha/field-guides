<svg viewBox="0 0 640 316" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sovereignty-drivers-title sovereignty-drivers-desc">
  <title id="sovereignty-drivers-title">Miksi suvereniteetti vaatii päätöksen</title>
  <desc id="sovereignty-drivers-desc">Tietosuoja, ulkomaisen lain ulottuvuus ja operatiivinen häiriönsietokyky motivoivat organisaatiota arvioimaan koodialustan hallintaa; mikään niistä ei ratkea pelkällä tallennuspaikalla.</desc>
  <defs><marker id="sovereignty-drivers-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#59636e" class="muted"/></marker></defs>
  <rect width="640" height="316" fill="#fff" class="paper"/>
  <line x1="40" y1="152" x2="496" y2="152" stroke="#59636e" class="arrow" marker-end="url(#sovereignty-drivers-arrow)"/>
  <line x1="148" y1="48" x2="208" y2="152" stroke="#59636e" class="line"/>
  <line x1="268" y1="256" x2="328" y2="152" stroke="#59636e" class="line"/>
  <line x1="388" y1="48" x2="448" y2="152" stroke="#59636e" class="line"/>
  <line x1="172" y1="88" x2="140" y2="88" stroke="#59636e" class="line"/>
  <line x1="292" y1="216" x2="260" y2="216" stroke="#59636e" class="line"/>
  <line x1="412" y1="88" x2="380" y2="88" stroke="#59636e" class="line"/>
  <rect x="76" y="16" width="144" height="32" rx="4" fill="#fff" stroke="#59636e" class="node"/>
  <rect x="196" y="256" width="144" height="32" rx="4" fill="#fff" stroke="#59636e" class="node"/>
  <rect x="316" y="16" width="144" height="32" rx="4" fill="#fff" stroke="#59636e" class="node"/>
