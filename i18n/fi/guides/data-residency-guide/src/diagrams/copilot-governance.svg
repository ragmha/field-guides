<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="copilot-governance-title copilot-governance-desc">
<title id="copilot-governance-title">Copilotin hallinta</title><desc id="copilot-governance-desc">Asiakkaan on päätettävä käytännöistä, mallien käytöstä, tietojen käsittelystä ja valvonnasta; saatavuus ja sopimusehdot on tarkistettava.</desc>
<defs><marker id="copilot-governance-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#59636e" class="muted"/></marker></defs>
<rect width="640" height="300" fill="#fff" class="paper"/>
<g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
<rect x="40" y="28" width="560" height="48" rx="6" class="node" fill="#fff" stroke="#1f2328"/>
<text x="64" y="57" text-anchor="start" font-size="12" class="ink" font-weight="600">01   Yritys · käytäntö</text>
<rect x="40" y="84" width="560" height="48" rx="6" class="focal" fill="#eaf6ed" stroke="#1a7f37"/>
<text x="64" y="113" text-anchor="start" font-size="12" class="ink" font-weight="600">02   Mallit · alueen luettelo</text>
<rect x="40" y="140" width="560" height="48" rx="6" class="node" fill="#fff" stroke="#1f2328"/>
<text x="64" y="169" text-anchor="start" font-size="12" class="ink" font-weight="600">03   Kehittäjä · tietojen käsittely</text>
<rect x="40" y="196" width="560" height="48" rx="6" class="node" fill="#fff" stroke="#1f2328"/>
<text x="64" y="225" text-anchor="start" font-size="12" class="ink" font-weight="600">04   Tietoturva · auditointi ja arviointi</text>
</g></svg>
