  <text x="504" y="317" fill="#59636e" font-size="8.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" class="muted">72 h:ssa jos mahdollista</text>
