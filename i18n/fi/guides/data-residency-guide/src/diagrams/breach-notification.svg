  <text x="376" y="60" fill="#1f2328" font-size="12" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" text-anchor="middle" class="ink">Tutkii</text>
  <text x="376" y="78" fill="#59636e" font-size="9" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" text-anchor="middle" class="muted">lieventää · §6</text>

  <rect x="152" y="120" width="128" height="48" rx="6" fill="#ffffff" stroke="#1f2328" stroke-width="1" class="node"/>
  <text x="216" y="140" fill="#1f2328" font-size="12" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" text-anchor="middle" class="ink">Arvioi loukkaus</text>
  <text x="216" y="158" fill="#59636e" font-size="9" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" text-anchor="middle" class="muted">riski henkilöille</text>

  <rect x="312" y="120" width="128" height="48" rx="6" fill="#eaf6ed" stroke="#1a7f37" stroke-width="1" class="focal"/>
  <text x="376" y="140" fill="#1f2328" font-size="12" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" text-anchor="middle" class="ink">Ilmoita viranomaiselle</text>
  <text x="376" y="158" fill="#59636e" font-size="9" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" text-anchor="middle" class="muted">jos riski · 33 art.</text>

  <rect x="472" y="120" width="128" height="48" rx="6" fill="#1f2328" fill-opacity="0.02" stroke="#59636e" stroke-width="1" stroke-dasharray="4,3" class="optional"/>
  <text x="536" y="140" fill="#1f2328" font-size="12" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" text-anchor="middle" class="ink">Ilmoita henkilöille</text>
  <text x="536" y="158" fill="#59636e" font-size="9" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" text-anchor="middle" class="muted">suuri riski · 34 art.</text>

  <rect x="312" y="200" width="128" height="48" rx="6" fill="#1f2328" fill-opacity="0.03" stroke="#59636e" stroke-width="1" class="external"/>
  <text x="376" y="220" fill="#1f2328" font-size="12" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" text-anchor="middle" class="ink">Viranomainen</text>
  <text x="376" y="238" fill="#59636e" font-size="9" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" text-anchor="middle" class="muted">valvova</text>

  <rect x="472" y="200" width="128" height="48" rx="6" fill="#1f2328" fill-opacity="0.03" stroke="#59636e" stroke-width="1" class="external"/>
  <text x="536" y="220" fill="#1f2328" font-size="12" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" text-anchor="middle" class="ink">Henkilöt</text>
  <text x="536" y="238" fill="#59636e" font-size="9" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" text-anchor="middle" class="muted">rekisteröidyt</text>

  <line x1="40" y1="280" x2="600" y2="280" stroke="#d1d9e0" stroke-width="0.8" class="rule"/>
  <text x="40" y="296" fill="#59636e" font-size="8" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" letter-spacing="0.14em" class="muted">SELITTEET</text>
  <rect x="40" y="308" width="14" height="10" rx="2" fill="#ffffff" stroke="#1f2328" stroke-width="1" class="node"/>
  <text x="60" y="317" fill="#59636e" font-size="8.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" class="muted">Toimi</text>
  <rect x="120" y="308" width="14" height="10" rx="2" fill="#eaf6ed" stroke="#1a7f37" stroke-width="1" class="focal"/>
  <text x="140" y="317" fill="#59636e" font-size="8.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" class="muted">Velvollisuutesi</text>
  <rect x="222" y="308" width="14" height="10" rx="2" fill="#1f2328" fill-opacity="0.03" stroke="#59636e" stroke-width="1" class="external"/>
  <text x="242" y="317" fill="#59636e" font-size="8.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" class="muted">Vastaanottaja</text>
  <line x1="320" y1="313" x2="340" y2="313" stroke="#59636e" stroke-width="1.2" stroke-dasharray="4,3" class="arrow" marker-end="url(#breach-notification-arrow)"/>
  <text x="348" y="317" fill="#59636e" font-size="8.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" class="muted">Avustus / ehdollinen</text>
