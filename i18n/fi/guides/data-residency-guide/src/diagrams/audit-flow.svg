<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="audit-flow-title audit-flow-desc">
<title id="audit-flow-title">Auditoinnin todistusaineiston polku</title><desc id="audit-flow-desc">Testaa, että yrityksen auditointitapahtuma saavuttaa asiakkaan valitseman kohteen ja että nimetty omistaja voi tutkia sitä.</desc>
<defs><marker id="audit-flow-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#59636e" class="muted"/></marker></defs>
<rect width="640" height="300" fill="#fff" class="paper"/>
<g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
<line x1="148" y1="132" x2="176" y2="132" class="arrow" stroke="#59636e" marker-end="url(#audit-flow-arrow)"/>
<line x1="304" y1="132" x2="332" y2="132" class="arrow" stroke="#59636e" marker-end="url(#audit-flow-arrow)"/>
<line x1="460" y1="132" x2="488" y2="132" class="arrow" stroke="#59636e" marker-end="url(#audit-flow-arrow)"/>
<rect x="20" y="104" width="128" height="56" rx="6" class="node" fill="#fff" stroke="#1f2328"/>
<text x="84" y="137" text-anchor="middle" font-size="11" class="ink" font-weight="600">Käytäntömuutos</text>
<rect x="176" y="104" width="128" height="56" rx="6" class="focal" fill="#eaf6ed" stroke="#1a7f37"/>
<text x="240" y="137" text-anchor="middle" font-size="11" class="ink" font-weight="600">Auditointitapahtuma</text>
<rect x="332" y="104" width="128" height="56" rx="6" class="node" fill="#fff" stroke="#1f2328"/>
<text x="396" y="137" text-anchor="middle" font-size="11" class="ink" font-weight="600">Oma kohteesi</text>
<rect x="488" y="104" width="128" height="56" rx="6" class="node" fill="#fff" stroke="#1f2328"/>
<text x="552" y="137" text-anchor="middle" font-size="11" class="ink" font-weight="600">Tietoturva-arvio</text>
</g></svg>
