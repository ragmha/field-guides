<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" role="img" aria-labelledby="adoption-path-title adoption-path-desc">
  <title id="adoption-path-title">Viisi askelta käyttöönottoon</title>
  <desc id="adoption-path-desc">Päätä vaatimukset, sovi sopimuksesta, tee kokeilu, siirrä aalloissa ja operoi auditoinnin ja irtautumisen todistusaineiston kanssa; jokaisella vaiheella on omistaja ja tuotos.</desc>
  <g font-size="13" font-weight="600" letter-spacing=".6" class="muted">
    <text x="24" y="30">VAIHE</text>
    <text x="24" y="262">OMISTAJA</text>
    <text x="24" y="318">VAIHEEN TUOTOS</text>
  </g>

  <path class="line" d="M190 120 H206 M372 120 H388 M554 120 H570 M736 120 H752"/>
  <path class="line" d="M200 114 L206 120 L200 126 M382 114 L388 120 L382 126 M564 114 L570 120 L564 126 M746 114 L752 120 L746 126"/>

  <rect class="box" x="24" y="46" width="166" height="148" rx="8"/>
  <text class="accent" x="40" y="78" font-size="14" font-weight="700">1</text>
  <text class="ink" x="40" y="104" font-size="18" font-weight="700">Päätä</text>
  <text class="muted" x="40" y="132" font-size="14">Vaatimus,</text>
  <text class="muted" x="40" y="152" font-size="14">sidosryhmät,</text>
  <text class="muted" x="40" y="172" font-size="14">datakartta</text>

  <rect class="box" x="206" y="46" width="166" height="148" rx="8"/>
  <text class="accent" x="222" y="78" font-size="14" font-weight="700">2</text>
  <text class="ink" x="222" y="104" font-size="18" font-weight="700">Sopimus</text>
  <text class="muted" x="222" y="132" font-size="14">Ostoreitti,</text>
  <text class="muted" x="222" y="152" font-size="14">DPA:n versio,</text>
  <text class="muted" x="222" y="172" font-size="14">toimialan puutteet</text>

  <rect class="focus" x="388" y="46" width="166" height="148" rx="8"/>
  <text class="accent" x="404" y="78" font-size="14" font-weight="700">3</text>
  <text class="ink" x="404" y="104" font-size="18" font-weight="700">Kokeilu</text>
  <text class="ink" x="404" y="132" font-size="14">Identiteetti, verkko,</text>
  <text class="ink" x="404" y="152" font-size="14">Copilot-käytäntö,</text>
  <text class="ink" x="404" y="172" font-size="14">irtautumistesti</text>

  <rect class="box" x="570" y="46" width="166" height="148" rx="8"/>
  <text class="accent" x="586" y="78" font-size="14" font-weight="700">4</text>
  <text class="ink" x="586" y="104" font-size="18" font-weight="700">Siirrä</text>
  <text class="muted" x="586" y="132" font-size="14">Pilottirepot,</text>
  <text class="muted" x="586" y="152" font-size="14">sitten aallot</text>

  <rect class="box" x="752" y="46" width="184" height="148" rx="8"/>
  <text class="accent" x="768" y="78" font-size="14" font-weight="700">5</text>
  <text class="ink" x="768" y="104" font-size="18" font-weight="700">Operoi</text>
  <text class="muted" x="768" y="132" font-size="14">Auditointivirta,</text>
  <text class="muted" x="768" y="152" font-size="14">neljännesvuosiarvio,</text>
  <text class="muted" x="768" y="172" font-size="14">vuotuinen irtautumistesti</text>

  <path class="line" d="M24 228 H936" stroke-dasharray="3 5"/>

  <g font-size="14" class="ink">
    <text x="24" y="284">DPO, lakiasiat</text>
    <text x="206" y="284">Lakiasiat, hankinta</text>
    <text x="388" y="284">Alustatiimi</text>
    <text x="570" y="284">Alustatiimi</text>
    <text x="752" y="284">CISO, alustatiimi</text>
    <text x="24" y="340">Tiedonsiirron arviointi</text>
    <text x="206" y="340">Allekirjoitetut ehdot</text>
    <text x="388" y="340">Päätöksen tarkistuslista</text>
    <text x="570" y="340">Migraatioloki</text>
    <text x="752" y="340">Todistusaineisto</text>
  </g>
</svg>
