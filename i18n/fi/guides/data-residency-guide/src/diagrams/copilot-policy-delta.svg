<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" role="img" aria-labelledby="copilot-policy-delta-title copilot-policy-delta-desc" data-diagram="architecture-delta">
  <title id="copilot-policy-delta-title">Copilot-käytäntö: ennen ja jälkeen</title>
  <desc id="copilot-policy-delta-desc">Kun alueellisen sijainnin käytäntö on pois käytöstä, aluerajoituksia ei valvota. Kun se on käytössä, yhteensopivat asiakasohjelmat ohjataan alueen vaatimukset täyttäviin malleihin. Kuvattu suodatin on käsitteellinen hallintakeino, ei väite GitHubin sisäisestä topologiasta.</desc>
  <defs><marker id="copilot-policy-delta-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" class="muted" fill="#59636e"/></marker></defs>
  <rect width="1000" height="340" class="paper" fill="#fff"/>
  <text x="24" y="34" class="ink" font-size="16" font-weight="700">ENNEN · käytäntö pois</text>
  <text x="348" y="34" class="ink" font-size="16" font-weight="700">MITÄ MUUTTUU</text>
  <text x="676" y="34" class="ink" font-size="16" font-weight="700">JÄLKEEN · käytäntö käytössä</text>
  <g data-snapshot="before" data-grid="300 240 4" transform="translate(24 60)">
    <path data-kind="relationship" data-object-id="request" data-status="rewired" data-signature="client-request" data-from="client" data-to="selector" d="M136 72 H164" class="arrow" stroke="#59636e" stroke-dasharray="4,3" marker-end="url(#copilot-policy-delta-arrow)"/>
    <g data-kind="component" data-object-id="client" data-status="unchanged" data-signature="compatible-client">
      <rect data-role="bounds" x="16" y="48" width="120" height="48" rx="6" class="node" fill="#fff" stroke="#1f2328"/>
      <text x="76" y="68" text-anchor="middle" class="ink" font-size="12">Asiakasohjelma</text>
      <text x="76" y="84" text-anchor="middle" class="muted" font-size="10">yhteensopiva</text>
    </g>
    <g data-kind="component" data-object-id="selector" data-status="changed moved" data-signature="model-choice-unrestricted">
      <rect data-role="bounds" x="164" y="48" width="120" height="48" rx="6" class="node" fill="#fff" stroke="#1f2328"/>
      <text x="224" y="68" text-anchor="middle" class="ink" font-size="12">Mallivalinta Δ</text>
      <text x="224" y="84" text-anchor="middle" class="muted" font-size="10">ei aluesuodatinta</text>
    </g>
  </g>
  <g data-snapshot="after" data-grid="300 240 4" transform="translate(676 60)">
    <path data-kind="relationship" data-object-id="request" data-status="rewired" data-signature="client-request" data-from="client" data-to="filter" d="M136 72 H164" class="arrow" stroke="#59636e" stroke-dasharray="4,3" marker-end="url(#copilot-policy-delta-arrow)"/>
    <path data-kind="relationship" data-object-id="eligibility" data-status="added" data-signature="regional-eligibility" data-from="filter" data-to="selector" d="M224 96 V144" class="arrow" stroke="#59636e" marker-end="url(#copilot-policy-delta-arrow)"/>
    <g data-kind="component" data-object-id="client" data-status="unchanged" data-signature="compatible-client">
      <rect data-role="bounds" x="16" y="48" width="120" height="48" rx="6" class="node" fill="#fff" stroke="#1f2328"/>
      <text x="76" y="68" text-anchor="middle" class="ink" font-size="12">Asiakasohjelma</text>
      <text x="76" y="84" text-anchor="middle" class="muted" font-size="10">yhteensopiva</text>
    </g>
    <g data-kind="component" data-object-id="filter" data-status="added" data-signature="regional-policy-enabled">
      <rect data-role="bounds" x="164" y="48" width="120" height="48" rx="6" class="focal" fill="#eaf6ed" stroke="#1a7f37"/>
      <text x="224" y="68" text-anchor="middle" class="ink" font-size="12">+ Aluekäytäntö</text>
      <text x="224" y="84" text-anchor="middle" class="muted" font-size="10">käytössä</text>
    </g>
    <g data-kind="component" data-object-id="selector" data-status="changed moved" data-signature="model-choice-regional">
      <rect data-role="bounds" x="164" y="144" width="120" height="48" rx="6" class="node" fill="#fff" stroke="#1f2328"/>
      <text x="224" y="164" text-anchor="middle" class="ink" font-size="12">Mallivalinta Δ ↓</text>
      <text x="224" y="180" text-anchor="middle" class="muted" font-size="10">vain alueen mallit</text>
    </g>
  </g>
  <text x="348" y="100" class="ink" font-size="12" data-change="ADDED" data-target="filter">LISÄTTY aluekäytännön hallinta</text>
  <text x="348" y="132" class="ink" font-size="12" data-change="REWIRED" data-target="request">OHJATTU pyyntö käytännön läpi</text>
  <text x="348" y="164" class="ink" font-size="12" data-change="ADDED" data-target="eligibility">LISÄTTY aluekelpoisuuden tarkistus</text>
  <text x="348" y="196" class="ink" font-size="12" data-change="CHANGED" data-target="selector">MUUTETTU mallivalikoimaa</text>
  <text x="348" y="228" class="ink" font-size="12" data-change="MOVED" data-target="selector">SIIRRETTY valinta käytännön alle</text>
  <text x="24" y="320" class="muted" font-size="12">Käsitteellinen käytäntönäkymä; todellista sisäistä topologiaa ei väitetä kuvatuksi.</text>
</svg>
