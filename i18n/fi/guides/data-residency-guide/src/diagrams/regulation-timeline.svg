<svg viewBox="0 0 640 256" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="regulation-timeline-title regulation-timeline-desc">
  <title id="regulation-timeline-title">Valittuja EU-sääntelyn päivämääriä</title>
  <desc id="regulation-timeline-desc">Tekoälyasetuksen tekoälylukutaitoa koskevia säännöksiä sovellettiin 2. helmikuuta 2025 alkaen. Useimpia datasäädöksen säännöksiä sovellettiin 12. syyskuuta 2025 alkaen. Useimpia tekoälyasetuksen säännöksiä sovellettiin 2. elokuuta 2026 alkaen, ja datasäädöksen kielto periä palveluntarjoajan vaihtamisesta maksuja on voimassa 12. tammikuuta 2027 alkaen. Tarkista myöhemmät muutokset.</desc>
  <rect width="640" height="256" fill="#fff" class="paper"/>
  <line x1="64" y1="128" x2="576" y2="128" stroke="#59636e" stroke-width="1" class="line"/>
  <line x1="64" y1="128" x2="64" y2="80" stroke="#59636e" class="line"/>
  <line x1="224" y1="128" x2="224" y2="176" stroke="#59636e" class="line"/>
  <line x1="456" y1="128" x2="456" y2="80" stroke="#59636e" class="line"/>
  <line x1="576" y1="128" x2="576" y2="176" stroke="#59636e" class="line"/>
  <circle cx="64" cy="128" r="4" fill="#59636e" class="muted"/>
  <circle cx="224" cy="128" r="4" fill="#59636e" class="muted"/>
  <circle cx="456" cy="128" r="5" fill="#1a7f37" class="accent"/>
  <circle cx="576" cy="128" r="4" fill="#59636e" class="muted"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="64" y="52" font-size="12" font-weight="600" fill="#1f2328" class="ink">Tekoälylukutaito</text>
    <text x="64" y="68" font-size="10" fill="#59636e" class="muted">2.2.2025</text>
    <text x="224" y="198" font-size="12" font-weight="600" text-anchor="middle" fill="#1f2328" class="ink">Datasäädös</text>
    <text x="224" y="214" font-size="10" text-anchor="middle" fill="#59636e" class="muted">12.9.2025 · useimmat säännökset</text>
    <text x="456" y="52" font-size="12" font-weight="600" text-anchor="middle" fill="#1f2328" class="ink">Tekoälyasetus · useimmat säännökset</text>
    <text x="456" y="68" font-size="10" text-anchor="middle" fill="#59636e" class="muted">2.8.2026</text>
    <text x="576" y="198" font-size="12" font-weight="600" text-anchor="end" fill="#1f2328" class="ink">Vaihtomaksut kielletään</text>
    <text x="576" y="214" font-size="10" text-anchor="end" fill="#59636e" class="muted">12.1.2027 · datasäädös</text>
  </g>
</svg>
