<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="An independent, searchable map of GitHub and Azure AI products, services, agentic tools, and learning resources." />
    <title>GitHub and Azure AI landscape</title>
    <script>
      try {
        const saved = localStorage.getItem("theme")
        const host = document.documentElement.dataset.colorMode
        const dark = saved === "dark" || (saved !== "light" && (host === "dark" || (host !== "light" && matchMedia("(prefers-color-scheme: dark)").matches)))
        document.documentElement.classList.add(dark ? "dark" : "light")
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!--catalog-->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
