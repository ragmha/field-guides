<?xml version="1.0" encoding="UTF-8"?>
<svg id="cli-tool-rules-dark-root" viewBox="0 0 704 736" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cli-tool-rules-dark-title cli-tool-rules-dark-desc">
        <title id="cli-tool-rules-dark-title">Resolve a CLI tool request</title>
        <desc id="cli-tool-rules-dark-desc">Deny rules win first, then allow rules or allow-all flags, otherwise Copilot CLI prompts; paths and URLs are checked separately.</desc>
        <defs><marker id="cli-tool-rules-dark-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#9198a1"/></marker></defs>
        <rect x="0" y="0" width="704" height="736" fill="#07090d"/>
        <path d="M 184 96 L 184 136" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#cli-tool-rules-dark-arrow)"/>
        <path d="M 304 192 L 376 192" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#cli-tool-rules-dark-arrow)"/><rect x="316" y="176" width="24.5" height="12" rx="2" fill="#07090d"/><text x="328.25" y="185" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="8" font-weight="400">YES</text>
        <path d="M 184 248 L 184 320" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#cli-tool-rules-dark-arrow)"/><rect x="192" y="278" width="19" height="12" rx="2" fill="#07090d"/><text x="201.5" y="287" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="8" font-weight="400">NO</text>
        <path d="M 304 376 L 376 376" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#cli-tool-rules-dark-arrow)"/><rect x="316" y="360" width="24.5" height="12" rx="2" fill="#07090d"/><text x="328.25" y="369" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="8" font-weight="400">YES</text>
        <path d="M 184 432 L 184 504" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#cli-tool-rules-dark-arrow)"/><rect x="192" y="462" width="19" height="12" rx="2" fill="#07090d"/><text x="201.5" y="471" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="8" font-weight="400">NO</text>
        <rect x="40" y="40" width="288" height="56" rx="20" fill="#0d1117" stroke="#9198a1" stroke-width="1.5"/>
        <text x="184.0" y="72.0" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Tool request</text>
        <polygon points="184,136 304,192 184,248 64,192" fill="#0d1117" stroke="#9198a1" stroke-width="1.5"/>
        <text x="184" y="196" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Deny rule matches?</text>
        <rect x="376" y="152" width="288" height="80" rx="6" fill="#0d1117" stroke="#9198a1" stroke-width="1.5"/>
        <text x="520.0" y="188.0" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Request blocked</text>
        <text x="520.0" y="204.0" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Even with --allow-all-tools</text>
        <polygon points="184,320 304,376 184,432 64,376" fill="#0d1117" stroke="#9198a1" stroke-width="1.5"/>
        <text x="184" y="380" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Allow rule or flag?</text>
        <rect x="376" y="336" width="288" height="80" rx="6" fill="#0d1117" stroke="#9198a1" stroke-width="1.5"/>
        <text x="520.0" y="372.0" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Runs without a tool prompt</text>
        <text x="520.0" y="388.0" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Path and URL checks still apply</text>
        <rect x="40" y="504" width="288" height="80" rx="20" fill="#102219" stroke="#3fb950" stroke-width="1.5"/>
        <text x="184.0" y="540.0" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Copilot CLI asks you</text>
        <text x="184.0" y="556.0" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Yes, yes for the session, or no</text>
        <text x="40" y="624" text-anchor="start" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Default paths: the working directory, its subdirectories and the system temp directory.</text>
        <text x="40" y="640" text-anchor="start" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Every URL needs approval by default, including curl and wget; detection is heuristic.</text>
        <line x1="40" y1="676" x2="664" y2="676" stroke="#3d444d"/>
        <text x="40" y="700" text-anchor="start" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="9" font-weight="400">Oval: start/end; rectangle: action; diamond: decision; arrow: next step</text>
        <text x="40" y="720" text-anchor="start" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="9" font-weight="400">Green box: lesson focus, not approval or a safety rating</text>
      </svg>
