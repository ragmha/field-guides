<?xml version="1.0" encoding="UTF-8"?>
<svg id="credential-masking-dark-root" viewBox="0 0 704 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="credential-masking-dark-title credential-masking-dark-desc">
        <title id="credential-masking-dark-title">How credential masking works</title>
        <desc id="credential-masking-dark-desc">A sandboxed command sees a placeholder, the local proxy swaps in the real credential only for HTTPS to approved hosts, and an approved bypass skips both.</desc>
        <defs><marker id="credential-masking-dark-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#9198a1"/></marker></defs>
        <rect x="0" y="0" width="704" height="520" fill="#07090d"/>
        <rect x="40" y="40" width="624" height="112" rx="6" fill="#07090d" stroke="#3d444d" stroke-width="1"/>
        <rect x="40" y="152" width="624" height="112" rx="6" fill="#07090d" stroke="#3d444d" stroke-width="1"/>
        <rect x="40" y="264" width="624" height="112" rx="6" fill="#07090d" stroke="#3d444d" stroke-width="1"/>
        <path d="M 384 96 L 432 96" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#credential-masking-dark-arrow)"/><rect x="387" y="80" width="41" height="12" rx="2" fill="#07090d"/><text x="407.5" y="89" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="8" font-weight="400">BYPASS</text>
        <path d="M 284 128 L 284 176" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#credential-masking-dark-arrow)"/><rect x="292" y="156" width="35.5" height="12" rx="2" fill="#07090d"/><text x="309.75" y="165" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="8" font-weight="400">HTTPS</text>
        <path d="M 384 208 L 532 208 A 8 8 0 0 1 540 216 L 540 288" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#credential-masking-dark-arrow)"/>
        <text x="56" y="100" text-anchor="start" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Command</text>
        <text x="56" y="212" text-anchor="start" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Local proxy</text>
        <text x="56" y="324" text-anchor="start" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Destination</text>
        <rect x="184" y="64" width="200" height="64" rx="6" fill="#0d1117" stroke="#9198a1" stroke-width="1.5"/>
        <text x="284.0" y="92.0" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Sees a placeholder</text>
        <text x="284.0" y="108.0" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">GH_TOKEN is never the real value</text>
        <rect x="432" y="64" width="216" height="64" rx="6" fill="#0d1117" stroke="#9198a1" stroke-width="1.5"/>
        <text x="540.0" y="92.0" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Approved bypass</text>
        <text x="540.0" y="108.0" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Real secrets, no proxy or masking</text>
        <rect x="184" y="176" width="200" height="64" rx="6" fill="#102219" stroke="#3fb950" stroke-width="1.5"/>
        <text x="284.0" y="204.0" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Swaps in real token</text>
        <text x="284.0" y="220.0" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">HTTPS to approved hosts only</text>
        <rect x="432" y="288" width="216" height="64" rx="6" fill="#0d1117" stroke="#9198a1" stroke-width="1.5"/>
        <text x="540.0" y="316.0" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">github.com and API hosts</text>
        <text x="540.0" y="332.0" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Or injectHosts you configure</text>
        <text x="40" y="408" text-anchor="start" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Masking works only while the sandbox is on; on Windows it needs local network access.</text>
        <text x="40" y="424" text-anchor="start" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Do not also list a masked variable in --secret-env-vars; that removes the variable.</text>
        <line x1="40" y1="460" x2="664" y2="460" stroke="#3d444d"/>
        <text x="40" y="484" text-anchor="start" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="9" font-weight="400">Band: where the step happens; rectangle: action; arrow: next step</text>
        <text x="40" y="504" text-anchor="start" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="9" font-weight="400">Green box: lesson focus, not approval or a safety rating</text>
      </svg>
