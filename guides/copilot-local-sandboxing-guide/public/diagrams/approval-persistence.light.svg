<?xml version="1.0" encoding="UTF-8"?>
<svg id="approval-persistence-light-root" viewBox="0 0 704 528" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="approval-persistence-light-title approval-persistence-light-desc">
        <title id="approval-persistence-light-title">How long an approval lasts</title>
        <desc id="approval-persistence-light-desc">One-time approvals end with the action, session approvals last until the session ends and return on resume, and saved choices and rules persist until removed.</desc>
        <defs><marker id="approval-persistence-light-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#59636e"/></marker></defs>
        <rect x="0" y="0" width="704" height="528" fill="#f3f5f7"/>
        <path d="M 172 64 L 204 64" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#approval-persistence-light-arrow)"/>
        <path d="M 336 64 L 368 64" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#approval-persistence-light-arrow)"/>
        <path d="M 500 64 L 532 64" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#approval-persistence-light-arrow)"/>
        <rect x="40" y="40" width="132" height="48" rx="6" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <text x="106.0" y="68.0" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">This action</text>
        <rect x="204" y="40" width="132" height="48" rx="6" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <text x="270.0" y="68.0" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">This session</text>
        <rect x="368" y="40" width="132" height="48" rx="6" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <text x="434.0" y="68.0" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Resumed session</text>
        <rect x="532" y="40" width="132" height="48" rx="6" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <text x="598.0" y="68.0" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Future sessions</text>
        <rect x="40" y="120" width="132" height="48" rx="6" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <text x="106.0" y="148.0" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Yes / Allow Once</text>
        <rect x="40" y="192" width="460" height="48" rx="6" fill="#eaf6ed" stroke="#1a7f37" stroke-width="1.5"/>
        <text x="270.0" y="212.0" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">CLI session approval</text>
        <text x="270.0" y="228.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Restored on resume; covers every argument</text>
        <rect x="40" y="264" width="624" height="48" rx="6" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <text x="352.0" y="284.0" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Don&#x27;t ask again / Always Allow</text>
        <text x="352.0" y="300.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Persists for the directory or future sessions</text>
        <rect x="40" y="336" width="624" height="48" rx="6" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <text x="352.0" y="356.0" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">User settings auto-approve rule</text>
        <text x="352.0" y="372.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Survives Reset Tool Confirmations</text>
        <text x="40" y="416" text-anchor="start" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Reset Tool Confirmations clears approvals; it does not delete User settings rules.</text>
        <text x="40" y="432" text-anchor="start" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">No reset revokes credentials that an approved command already used.</text>
        <line x1="40" y1="468" x2="664" y2="468" stroke="#d1d9e0"/>
        <text x="40" y="492" text-anchor="start" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="9" font-weight="400">Top row: time from left to right; bar length: how long each approval stays in effect</text>
        <text x="40" y="512" text-anchor="start" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="9" font-weight="400">Green box: lesson focus, not approval or a safety rating</text>
      </svg>
