<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Routing change timeline</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif; background: #07090d; color: #f0f6fc; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 704px; min-width: 0; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow { font-size: .66rem; color: #9198a1; margin-bottom: .5rem; }
    h1 { font-size: 1.75rem; line-height: 1.15; margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 704px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Copilot Network Controls · Timeline</p>
    <h1>Routing change timeline</h1>
    <div class="diagram-container" tabindex="0" role="region" aria-label="Routing change timeline. Scroll horizontally to explore.">
      <svg viewBox="0 0 704 472" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="routing-change-plan-dark-title routing-change-plan-dark-desc">
        <title id="routing-change-plan-dark-title">Routing change timeline</title>
        <desc id="routing-change-plan-dark-desc">Five steps from inventory to ongoing review, with the enterprise pattern allowed before any billing change and a piloted block.</desc>
        <defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#9198a1"/></marker></defs>
        <rect x="0" y="0" width="704" height="472" fill="#07090d"/>
        <path d="M 56 184 L 656 184" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#arrow)"/>
        <circle cx="120" cy="184" r="6" fill="#0d1117" stroke="#9198a1" stroke-width="1.5"/>
        <line x1="120" y1="136" x2="120" y2="178" stroke="#9198a1" stroke-width="1.5"/>
        <rect x="44" y="64" width="152" height="72" rx="6" fill="#0d1117" stroke="#9198a1" stroke-width="1.5"/>
        <text x="120.0" y="96.0" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Week 1: Inventory</text>
        <text x="120.0" y="112.0" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Plans and versions</text>
        <circle cx="236" cy="184" r="6" fill="#0d1117" stroke="#9198a1" stroke-width="1.5"/>
        <line x1="236" y1="190" x2="236" y2="232" stroke="#9198a1" stroke-width="1.5"/>
        <rect x="160" y="232" width="152" height="72" rx="6" fill="#102219" stroke="#3fb950" stroke-width="1.5"/>
        <text x="236.0" y="264.0" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Week 2: Allow plans</text>
        <text x="236.0" y="280.0" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Add enterprise too</text>
        <circle cx="352" cy="184" r="6" fill="#0d1117" stroke="#9198a1" stroke-width="1.5"/>
        <line x1="352" y1="136" x2="352" y2="178" stroke="#9198a1" stroke-width="1.5"/>
        <rect x="276" y="64" width="152" height="72" rx="6" fill="#0d1117" stroke="#9198a1" stroke-width="1.5"/>
        <text x="352.0" y="96.0" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Week 3: Pilot block</text>
        <text x="352.0" y="112.0" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Small segment, rollback</text>
        <circle cx="468" cy="184" r="6" fill="#0d1117" stroke="#9198a1" stroke-width="1.5"/>
        <line x1="468" y1="190" x2="468" y2="232" stroke="#9198a1" stroke-width="1.5"/>
        <rect x="392" y="232" width="152" height="72" rx="6" fill="#0d1117" stroke="#9198a1" stroke-width="1.5"/>
        <text x="468.0" y="264.0" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Week 4: Widen block</text>
        <text x="468.0" y="280.0" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Remove broad entry</text>
        <circle cx="584" cy="184" r="6" fill="#0d1117" stroke="#9198a1" stroke-width="1.5"/>
        <line x1="584" y1="136" x2="584" y2="178" stroke="#9198a1" stroke-width="1.5"/>
        <rect x="508" y="64" width="152" height="72" rx="6" fill="#0d1117" stroke="#9198a1" stroke-width="1.5"/>
        <text x="584.0" y="96.0" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Ongoing: Review</text>
        <text x="584.0" y="112.0" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">After any change</text>
        <text x="40" y="344" text-anchor="start" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Move to the Copilot access billing model only after week 2.</text>
        <text x="40" y="360" text-anchor="start" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Dates are hypothetical; the order is guide advice.</text>
        <line x1="40" y1="412" x2="664" y2="412" stroke="#3d444d"/>
        <text x="40" y="436" text-anchor="start" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="9" font-weight="400">Dot: milestone on the axis; rectangle: step; line: connects step to its date</text>
        <text x="40" y="456" text-anchor="start" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="9" font-weight="400">Green box: lesson focus, not approval or a safety rating</text>
      </svg>
    </div>
  </div>
</body>
</html>
