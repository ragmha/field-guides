<?xml version="1.0" encoding="UTF-8"?>
<svg id="build-client-allowlist-dark-root" viewBox="0 0 704 816" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="build-client-allowlist-dark-title build-client-allowlist-dark-desc">
        <title id="build-client-allowlist-dark-title">Build a client allowlist</title>
        <desc id="build-client-allowlist-dark-desc">Query the meta API, add the apex host, Copilot reference hosts and editor hosts, then test a real client before approving.</desc>
        <defs><marker id="build-client-allowlist-dark-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#9198a1"/></marker></defs>
        <rect x="0" y="0" width="704" height="816" fill="#07090d"/>
        <rect x="40" y="40" width="288" height="64" rx="20" fill="#0d1117" stroke="#9198a1" stroke-width="1.5"/>
        <text x="184.0" y="68.0" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Query the meta API</text>
        <text x="184.0" y="84.0" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Website and Copilot domains</text>
        <path d="M 184 104 L 184 136" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#build-client-allowlist-dark-arrow)"/>
        <rect x="40" y="136" width="288" height="64" rx="6" fill="#0d1117" stroke="#9198a1" stroke-width="1.5"/>
        <text x="184.0" y="164.0" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Add apex github.com</text>
        <text x="184.0" y="180.0" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Not matched by *.github.com</text>
        <path d="M 184 200 L 184 232" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#build-client-allowlist-dark-arrow)"/>
        <rect x="40" y="232" width="288" height="64" rx="6" fill="#102219" stroke="#3fb950" stroke-width="1.5"/>
        <text x="184.0" y="260.0" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Add Copilot reference hosts</text>
        <text x="184.0" y="276.0" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Plan hosts are not in the meta API</text>
        <path d="M 184 296 L 184 328" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#build-client-allowlist-dark-arrow)"/>
        <rect x="40" y="328" width="288" height="64" rx="6" fill="#0d1117" stroke="#9198a1" stroke-width="1.5"/>
        <text x="184.0" y="356.0" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Add editor hosts</text>
        <text x="184.0" y="372.0" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Marketplace, updates, sign-in</text>
        <path d="M 184 392 L 184 424" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#build-client-allowlist-dark-arrow)"/>
        <polygon points="184,424 312,480 184,536 56,480" fill="#0d1117" stroke="#9198a1" stroke-width="1.5"/>
        <text x="184.0" y="484.0" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Real client works?</text>
        <path d="M 184 536 L 184 584" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#build-client-allowlist-dark-arrow)"/>
        <rect x="192" y="554" width="24.5" height="12" rx="2" fill="#07090d"/><text x="204.2" y="563" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="8" font-weight="400">YES</text>
        <rect x="40" y="584" width="288" height="64" rx="20" fill="#0d1117" stroke="#9198a1" stroke-width="1.5"/>
        <text x="184.0" y="612.0" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Approve tagged baseline</text>
        <text x="184.0" y="628.0" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Record each entry source</text>
        <path d="M 312 480 L 376 480" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#build-client-allowlist-dark-arrow)"/>
        <rect x="334.5" y="474" width="19.0" height="12" rx="2" fill="#07090d"/><text x="344.0" y="483" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="8" font-weight="400">NO</text>
        <rect x="376" y="448" width="288" height="64" rx="6" fill="#0d1117" stroke="#9198a1" stroke-width="1.5"/>
        <text x="520.0" y="476.0" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Find the missing host</text>
        <text x="520.0" y="492.0" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Use logs and diagnostics</text>
        <path d="M 520 448 L 520 368 A 8 8 0 0 0 512 360 L 328 360" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#build-client-allowlist-dark-arrow)"/>
        <text x="40" y="688" text-anchor="start" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Plan-specific hosts and routing rules are covered in Part 4.</text>
        <text x="40" y="704" text-anchor="start" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Test sign-in, suggestions and Chat from a managed device.</text>
        <line x1="40" y1="756" x2="664" y2="756" stroke="#3d444d"/>
        <text x="40" y="780" text-anchor="start" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="9" font-weight="400">Oval: start/end; rectangle: action; diamond: decision; arrow: next step</text>
        <text x="40" y="800" text-anchor="start" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="9" font-weight="400">Green box: lesson focus, not approval or a safety rating</text>
      </svg>
