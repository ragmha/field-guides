<?xml version="1.0" encoding="UTF-8"?>
<svg id="firewall-settings-hierarchy-light-root" viewBox="0 0 704 632" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="firewall-settings-hierarchy-light-title firewall-settings-hierarchy-light-desc">
        <title id="firewall-settings-hierarchy-light-title">Firewall settings from organization to session</title>
        <desc id="firewall-settings-hierarchy-light-desc">Organization firewall settings are inherited or locked, repository rules combine with organization entries, and new sessions use the result.</desc>
        <defs><marker id="firewall-settings-hierarchy-light-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#59636e"/></marker></defs>
        <rect x="0" y="0" width="704" height="632" fill="#f3f5f7"/>
        <rect x="40" y="40" width="624" height="132" rx="8" fill="#eaf6ed" stroke="#1a7f37" stroke-width="1.5"/>
        <text x="56" y="60" text-anchor="start" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">ORGANIZATION: SETTINGS &gt; COPILOT &gt; INTERNET ACCESS</text>
        <rect x="48" y="76" width="143" height="80" rx="6" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <text x="119.5" y="112.0" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Enable firewall</text>
        <text x="119.5" y="128.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Default: repos decide</text>
        <rect x="203" y="76" width="143" height="80" rx="6" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <text x="274.5" y="112.0" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Recommended list</text>
        <text x="274.5" y="128.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Default: repos decide</text>
        <rect x="358" y="76" width="143" height="80" rx="6" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <text x="429.5" y="112.0" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Repo custom rules</text>
        <text x="429.5" y="128.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Default: enabled</text>
        <rect x="513" y="76" width="143" height="80" rx="6" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <text x="584.5" y="112.0" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Org allowlist</text>
        <text x="584.5" y="128.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Cannot be deleted</text>
        <path d="M 352 172 L 352 212" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#firewall-settings-hierarchy-light-arrow)"/>
        <rect x="360" y="186" width="112.5" height="12" rx="2" fill="#f3f5f7"/><text x="416.2" y="195" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="8" font-weight="400">LOCKED OR DELEGATED</text>
        <rect x="40" y="212" width="624" height="132" rx="8" fill="#f3f5f7" stroke="#d1d9e0" stroke-width="1.5"/>
        <text x="56" y="232" text-anchor="start" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">REPOSITORY: SAME TAB, LOCKED ITEMS READ-ONLY</text>
        <rect x="48" y="248" width="296" height="80" rx="6" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <text x="196.0" y="284.0" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Unlocked settings</text>
        <text x="196.0" y="300.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Set only where allowed</text>
        <rect x="360" y="248" width="296" height="80" rx="6" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <text x="508.0" y="284.0" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Repository allowlist</text>
        <text x="508.0" y="300.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Combines with org entries</text>
        <path d="M 352 344 L 352 384" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#firewall-settings-hierarchy-light-arrow)"/>
        <rect x="40" y="384" width="624" height="80" rx="6" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <text x="352.0" y="420.0" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Effective allowlist in a new session</text>
        <text x="352.0" y="436.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">GitHub hosts + recommended + organization + repository rules</text>
        <text x="40" y="504" text-anchor="start" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Domain rules include subdomains; URL rules include descendant paths only.</text>
        <text x="40" y="520" text-anchor="start" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Copilot in the cloud and Copilot code review have separate sections.</text>
        <line x1="40" y1="572" x2="664" y2="572" stroke="#d1d9e0"/>
        <text x="40" y="596" text-anchor="start" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="9" font-weight="400">Band: layer; rectangle: component; arrow: direction of traffic or inheritance</text>
        <text x="40" y="616" text-anchor="start" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="9" font-weight="400">Green box: lesson focus, not approval or a safety rating</text>
      </svg>
