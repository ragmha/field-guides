        <rect x="172" y="106" width="46.5" height="12" rx="2" fill="#f3f5f7"/><text x="195.2" y="115" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="8" font-weight="400">NOT SET</text>

        <path d="M 288 156 L 376 156" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#arrow)"/>

        <rect x="40" y="304" width="248" height="56" rx="6" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>

        <path d="M 288 332 L 376 332" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#arrow)"/>

        <rect x="376" y="40" width="288" height="320" rx="6" fill="#eaf6ed" stroke="#1a7f37" stroke-width="1.5"/>

        <path d="M 164 360 L 164 400" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#arrow)"/>
        <rect x="172" y="374" width="46.5" height="12" rx="2" fill="#f3f5f7"/><text x="195.2" y="383" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="8" font-weight="400">NOT SET</text>

        <path d="M 520 360 L 520 400" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#arrow)"/>
        <rect x="376" y="400" width="288" height="64" rx="6" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <text x="520.0" y="428.0" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Proxy URL uses the http scheme</text>
        <text x="520.0" y="444.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">The https scheme is unsupported</text>

        <text x="40" y="692" text-anchor="start" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="9" font-weight="400">Oval: start/end; rectangle: action; diamond: decision; arrow: next step</text>
        <text x="40" y="712" text-anchor="start" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="9" font-weight="400">Green box: lesson focus, not approval or a safety rating</text>
