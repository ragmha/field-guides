<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="feature-availability-title feature-availability-desc">
<title id="feature-availability-title">GHE.com feature availability</title><desc id="feature-availability-desc">At the source review date, Codespaces is available on GHE.com while public repositories and GitHub Marketplace are unavailable. Check the current feature overview before deciding.</desc>
<defs><marker id="feature-availability-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#59636e" class="muted"/></marker></defs>
<rect width="640" height="300" fill="#fff" class="paper"/>
<g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
<text x="280" y="55" text-anchor="middle" font-size="10" class="muted">Available</text>
<text x="400" y="55" text-anchor="middle" font-size="10" class="muted">Unavailable</text>
<text x="520" y="55" text-anchor="middle" font-size="10" class="muted">Check</text>
<text x="200" y="97" text-anchor="end" font-size="11" class="ink" font-weight="600">Codespaces</text>
<rect x="224" y="68" width="112" height="48" rx="6" class="focal" fill="#eaf6ed" stroke="#1a7f37"/>
<text x="280" y="97" text-anchor="middle" font-size="11" class="ink">YES</text>
<rect x="344" y="68" width="112" height="48" rx="6" class="node" fill="#fff" stroke="#1f2328"/>
<text x="400" y="97" text-anchor="middle" font-size="11" class="muted">—</text>
<rect x="464" y="68" width="112" height="48" rx="6" class="node" fill="#fff" stroke="#1f2328"/>
<text x="520" y="97" text-anchor="middle" font-size="11" class="muted">—</text>
<text x="200" y="153" text-anchor="end" font-size="11" class="ink" font-weight="600">Public repos</text>
<rect x="224" y="124" width="112" height="48" rx="6" class="node" fill="#fff" stroke="#1f2328"/>
<text x="280" y="153" text-anchor="middle" font-size="11" class="muted">—</text>
<rect x="344" y="124" width="112" height="48" rx="6" class="node" fill="#fff" stroke="#1f2328"/>
<text x="400" y="153" text-anchor="middle" font-size="11" class="ink">YES</text>
<rect x="464" y="124" width="112" height="48" rx="6" class="node" fill="#fff" stroke="#1f2328"/>
<text x="520" y="153" text-anchor="middle" font-size="11" class="muted">—</text>
<text x="200" y="209" text-anchor="end" font-size="11" class="ink" font-weight="600">Marketplace</text>
<rect x="224" y="180" width="112" height="48" rx="6" class="node" fill="#fff" stroke="#1f2328"/>
<text x="280" y="209" text-anchor="middle" font-size="11" class="muted">—</text>
<rect x="344" y="180" width="112" height="48" rx="6" class="node" fill="#fff" stroke="#1f2328"/>
<text x="400" y="209" text-anchor="middle" font-size="11" class="ink">YES</text>
<rect x="464" y="180" width="112" height="48" rx="6" class="node" fill="#fff" stroke="#1f2328"/>
<text x="520" y="209" text-anchor="middle" font-size="11" class="muted">—</text>
</g></svg>
