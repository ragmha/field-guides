<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="copilot-flow-title copilot-flow-desc">
  <title id="copilot-flow-title">Copilot residency policy and inference</title>
  <desc id="copilot-flow-desc">A compatible client sends a prompt under an enabled enterprise residency policy to a region-compliant model endpoint; prompts, code and responses remain in the selected region during inference.</desc>
  <defs><marker id="copilot-flow-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#59636e" class="muted"/></marker></defs>
  <rect width="640" height="260" fill="#fff" class="paper"/>
  <rect x="216" y="36" width="388" height="152" rx="8" fill="#f6f8fa" stroke="#d1d9e0" stroke-dasharray="4,4" class="box"/>
  <text x="236" y="58" font-family="ui-monospace, monospace" font-size="9" fill="#59636e" class="muted">POLICY ENABLED · INFERENCE IN REGION</text>
  <line x1="188" y1="116" x2="240" y2="116" stroke="#59636e" class="arrow" marker-end="url(#copilot-flow-arrow)"/>
  <line x1="388" y1="116" x2="440" y2="116" stroke="#59636e" class="arrow" marker-end="url(#copilot-flow-arrow)"/>
  <rect x="40" y="88" width="148" height="56" rx="6" fill="#fff" stroke="#1f2328" class="node"/>
  <rect x="240" y="88" width="148" height="56" rx="6" fill="#eaf6ed" stroke="#1a7f37" class="focal"/>
  <rect x="440" y="88" width="140" height="56" rx="6" fill="#fff" stroke="#1f2328" class="node"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" text-anchor="middle">
    <text x="114" y="110" fill="#1f2328" font-size="12" font-weight="600" class="ink">Compatible client</text>
    <text x="114" y="129" fill="#59636e" font-size="10" class="muted">code · prompt</text>
    <text x="314" y="110" fill="#1f2328" font-size="12" font-weight="600" class="ink">Residency policy</text>
    <text x="314" y="129" fill="#59636e" font-size="10" class="muted">enabled by owner</text>
    <text x="510" y="110" fill="#1f2328" font-size="12" font-weight="600" class="ink">Compliant model</text>
    <text x="510" y="129" fill="#59636e" font-size="10" class="muted">regional endpoint</text>
  </g>
  <text x="40" y="220" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#59636e" class="muted">Off by default · 10% AI credit uplift · GA features</text>
</svg>
