<line x1="304" y1="132" x2="332" y2="132" class="arrow" stroke="#59636e" marker-end="url(#data-lifecycle-arrow)"/>
<text x="318" y="121" text-anchor="middle" font-size="8" class="muted">REQUEST</text>
<line x1="460" y1="132" x2="488" y2="132" class="arrow" stroke="#59636e" marker-end="url(#data-lifecycle-arrow)"/>
