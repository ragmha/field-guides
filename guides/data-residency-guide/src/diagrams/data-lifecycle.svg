<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="data-lifecycle-title data-lifecycle-desc">
<title id="data-lifecycle-title">Plan data return or deletion</title><desc id="data-lifecycle-desc">Under the applicable DPA, assess the request for return or deletion and any applicable exceptions; verify the result and retain your evidence.</desc>
