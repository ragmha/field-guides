<svg viewBox="0 0 640 280" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="platform-architecture-title platform-architecture-desc">
  <title id="platform-architecture-title">Enterprise cloud with data residency</title>
  <desc id="platform-architecture-desc">Managed users authenticate through an identity provider and access a dedicated GHE.com enterprise whose applicable customer data is stored in the selected region. Documented exceptions and integrations need separate assessment.</desc>
  <defs><marker id="platform-architecture-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#59636e" class="muted"/></marker></defs>
  <rect width="640" height="280" fill="#fff" class="paper"/>
  <rect x="248" y="36" width="352" height="164" rx="8" fill="#f6f8fa" stroke="#d1d9e0" stroke-dasharray="4,4" class="box"/>
  <text x="268" y="58" fill="#59636e" font-size="9" font-family="ui-monospace, monospace" class="muted">GITHUB CLOUD · SELECTED REGION</text>
  <line x1="188" y1="116" x2="272" y2="116" stroke="#59636e" class="arrow" marker-end="url(#platform-architecture-arrow)"/>
  <line x1="416" y1="116" x2="456" y2="116" stroke="#59636e" class="arrow" marker-end="url(#platform-architecture-arrow)"/>
  <rect x="40" y="88" width="148" height="56" rx="6" fill="#fff" stroke="#1f2328" class="node"/>
  <rect x="272" y="88" width="144" height="56" rx="6" fill="#eaf6ed" stroke="#1a7f37" class="focal"/>
  <rect x="456" y="88" width="120" height="56" rx="6" fill="#fff" stroke="#1f2328" class="node"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" text-anchor="middle">
    <text x="114" y="110" fill="#1f2328" font-size="12" font-weight="600" class="ink">Your identity</text>
    <text x="114" y="129" fill="#59636e" font-size="10" class="muted">IdP · managed users</text>
    <text x="344" y="110" fill="#1f2328" font-size="12" font-weight="600" class="ink">GHE.com</text>
    <text x="344" y="129" fill="#59636e" font-size="10" class="muted">dedicated subdomain</text>
    <text x="516" y="110" fill="#1f2328" font-size="12" font-weight="600" class="ink">Customer data</text>
    <text x="516" y="129" fill="#59636e" font-size="10" class="muted">applicable content</text>
  </g>
  <text x="40" y="234" fill="#59636e" font-size="11" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" class="muted">Assess documented exceptions and your integrations separately.</text>
</svg>
