<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="migration-window-title migration-window-desc">
  <title id="migration-window-title">Illustrative migration and exit window</title>
  <desc id="migration-window-desc">An illustrative plan shows a 30-day trial before cutover, overlapping licences during migration, and up to 90 days for repository migration after a hypothetical later termination. Production use is not allowed during that window under the cited terms. The example dates are planning assumptions.</desc>
  <rect width="640" height="300" fill="#fff" class="paper"/>
  <g stroke="#d1d9e0" stroke-width="1" class="rule">
    <line x1="140" y1="48" x2="600" y2="48"/>
    <line x1="140" y1="48" x2="140" y2="232"/>
    <line x1="232" y1="48" x2="232" y2="232"/>
    <line x1="324" y1="48" x2="324" y2="232"/>
    <line x1="600" y1="48" x2="600" y2="232"/>
  </g>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" fill="#59636e" font-size="9" class="muted">
    <text x="140" y="38" text-anchor="middle">DAY −30</text><text x="232" y="38" text-anchor="middle">CUTOVER · 0</text>
    <text x="324" y="38" text-anchor="middle">TERMINATE · 30</text><text x="600" y="38" text-anchor="end">DAY 120</text>
  </g>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#1f2328" class="ink">
    <text x="20" y="84">Trial</text><text x="20" y="124">Licence overlap</text><text x="20" y="164">Migration</text><text x="20" y="204">Exit window</text>
  </g>
  <rect x="140" y="68" width="92" height="24" rx="4" fill="#f6f8fa" stroke="#59636e" class="box"/>
  <rect x="200" y="108" width="124" height="24" rx="4" fill="#f6f8fa" stroke="#59636e" class="box"/>
  <rect x="216" y="148" width="16" height="24" rx="4" fill="#f6f8fa" stroke="#59636e" class="box"/>
  <rect x="324" y="188" width="276" height="24" rx="4" fill="#eaf6ed" stroke="#1a7f37" class="focal"/>
  <text x="462" y="204" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" fill="#1f2328" class="ink">Up to 90 days · §9.5</text>
  <text x="20" y="264" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" fill="#59636e" class="muted">Hypothetical timing. No production use during the §9.5 window.</text>
</svg>
