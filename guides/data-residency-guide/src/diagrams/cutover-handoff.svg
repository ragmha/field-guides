<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cutover-handoff-title cutover-handoff-desc">
<title id="cutover-handoff-title">Cutover handoffs</title><desc id="cutover-handoff-desc">The platform team prepares and migrates; repository owners verify their workloads; the business owner approves the cutover. This is guide advice.</desc>
<defs><marker id="cutover-handoff-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#59636e" class="muted"/></marker></defs>
<rect width="640" height="300" fill="#fff" class="paper"/>
<g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
<text x="100" y="66" text-anchor="end" font-size="9" class="muted">PLATFORM</text>
<line x1="120" y1="96" x2="608" y2="96" class="rule" stroke="#d1d9e0"/>
<text x="100" y="138" text-anchor="end" font-size="9" class="muted">REPO OWNER</text>
<line x1="120" y1="168" x2="608" y2="168" class="rule" stroke="#d1d9e0"/>
<text x="100" y="210" text-anchor="end" font-size="9" class="muted">BUSINESS</text>
<line x1="120" y1="240" x2="608" y2="240" class="rule" stroke="#d1d9e0"/>
<path d="M288 64 H356 Q364 64 364 72 V112" class="arrow" fill="none" stroke="#59636e" marker-end="url(#cutover-handoff-arrow)"/>
<path d="M428 136 H496 Q504 136 504 144 V184" class="arrow" fill="none" stroke="#59636e" marker-end="url(#cutover-handoff-arrow)"/>
<rect x="160" y="40" width="128" height="48" rx="6" class="node" fill="#fff" stroke="#1f2328"/>
<text x="224" y="69" text-anchor="middle" font-size="11" class="ink" font-weight="600">Migrate</text>
<rect x="300" y="112" width="128" height="48" rx="6" class="focal" fill="#eaf6ed" stroke="#1a7f37"/>
<text x="364" y="141" text-anchor="middle" font-size="11" class="ink" font-weight="600">Verify</text>
<rect x="440" y="184" width="128" height="48" rx="6" class="node" fill="#fff" stroke="#1f2328"/>
<text x="504" y="213" text-anchor="middle" font-size="11" class="ink" font-weight="600">Approve</text>
</g></svg>
