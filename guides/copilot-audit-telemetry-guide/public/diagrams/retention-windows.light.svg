<?xml version="1.0" encoding="UTF-8"?>
<svg id="retention-windows-light-root" viewBox="0 0 704 408" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="retention-windows-light-title retention-windows-light-desc">
        <title id="retention-windows-light-title">How long each record lasts</title>
        <desc id="retention-windows-light-desc">Compare retention: the agent sessions list covers 24 hours, Git events 7 days, the audit log 180 days, and a stream keeps whatever your destination keeps from the day you enable it.</desc>
        <defs><marker id="retention-windows-light-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#59636e"/></marker></defs>
        <rect x="0" y="0" width="704" height="408" fill="#f3f5f7"/>
        <rect x="40" y="40" width="624" height="228" rx="6" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <text x="346" y="63" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Window</text>
        <text x="558" y="63" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">What to do</text>
        <line x1="40" y1="76" x2="664" y2="76" stroke="#d1d9e0"/>
        <text x="56" y="104" text-anchor="start" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Agent sessions list</text>
        <text x="346" y="104" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="11" font-weight="600">24 hours</text>
        <text x="558" y="104" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="11" font-weight="600">Use for live oversight only</text>
        <line x1="40" y1="124" x2="664" y2="124" stroke="#d1d9e0"/>
        <text x="56" y="152" text-anchor="start" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Git events</text>
        <text x="346" y="152" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="11" font-weight="600">7 days</text>
        <text x="558" y="152" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="11" font-weight="600">Export or stream quickly</text>
        <line x1="40" y1="172" x2="664" y2="172" stroke="#d1d9e0"/>
        <text x="56" y="200" text-anchor="start" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Audit log</text>
        <text x="346" y="200" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="11" font-weight="600">180 days</text>
        <text x="558" y="200" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="11" font-weight="600">Search, export, API</text>
        <line x1="40" y1="220" x2="664" y2="220" stroke="#d1d9e0"/>
        <rect x="44" y="224" width="616" height="40" rx="4" fill="#eaf6ed" stroke="#1a7f37" stroke-width="1.5"/>
        <text x="56" y="248" text-anchor="start" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Audit log stream</text>
        <text x="346" y="248" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="11" font-weight="600">From enable date</text>
        <text x="558" y="248" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="11" font-weight="600">Destination sets retention</text>
        <line x1="240" y1="40" x2="240" y2="268" stroke="#d1d9e0"/>
        <text x="40" y="308" text-anchor="start" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Nothing reaches back before a stream was enabled. Missing history is a gap to state, not a finding.</text>
        <line x1="40" y1="348" x2="664" y2="348" stroke="#d1d9e0"/>
        <text x="40" y="372" text-anchor="start" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="9" font-weight="400">Row: record type; column: window and response</text>
        <text x="40" y="392" text-anchor="start" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="9" font-weight="400">Green row: lesson focus, not approval or a safety rating</text>
      </svg>
