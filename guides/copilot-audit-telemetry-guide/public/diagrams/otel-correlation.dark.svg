<?xml version="1.0" encoding="UTF-8"?>
<svg id="otel-correlation-dark-root" viewBox="0 0 704 540" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="otel-correlation-dark-title otel-correlation-dark-desc">
        <title id="otel-correlation-dark-title">Join telemetry to the audit log</title>
        <desc id="otel-correlation-dark-desc">Client OpenTelemetry nests chat and tool spans under an invoke_agent root; join them to audit records on identity and time, since matching conversation and session IDs is not documented.</desc>
        <defs><marker id="otel-correlation-dark-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#9198a1"/></marker></defs>
        <rect x="0" y="0" width="704" height="540" fill="#07090d"/>
        <text x="40" y="44" text-anchor="start" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="9" font-weight="400">CLIENT TELEMETRY</text>
        <text x="40" y="316" text-anchor="start" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="9" font-weight="400">AUDIT LOG</text>
        <path d="M 352 136 L 352 176" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#otel-correlation-dark-arrow)"/>
        <path d="M 352 256 L 352 312" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#otel-correlation-dark-arrow)"/>
        <rect x="360" y="275" width="134.5" height="12" rx="2" fill="#07090d"/><text x="427.25" y="284" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="8" font-weight="400">JOIN ON IDENTITY + TIME</text>
        <rect x="40" y="56" width="624" height="80" rx="6" fill="#102219" stroke="#3fb950" stroke-width="1.5"/>
        <text x="352" y="92" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">invoke_agent (root span)</text>
        <text x="352" y="108" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">gen_ai.conversation.id, nano_aiu</text>
        <rect x="40" y="176" width="304" height="80" rx="6" fill="#0d1117" stroke="#9198a1" stroke-width="1.5"/>
        <text x="192" y="212" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">chat</text>
        <text x="192" y="228" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Model call spans</text>
        <rect x="360" y="176" width="304" height="80" rx="6" fill="#0d1117" stroke="#9198a1" stroke-width="1.5"/>
        <text x="512" y="212" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">execute_tool</text>
        <text x="512" y="228" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Tool call spans</text>
        <rect x="40" y="328" width="624" height="80" rx="6" fill="#0d1117" stroke="#9198a1" stroke-width="1.5"/>
        <text x="352" y="364" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Agent audit record</text>
        <text x="352" y="380" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">user, agent_session_id, timestamp</text>
        <text x="40" y="440" text-anchor="start" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Do not assume gen_ai.conversation.id equals agent_session_id. Treat any match as unverified.</text>
        <line x1="40" y1="480" x2="664" y2="480" stroke="#3d444d"/>
        <text x="40" y="504" text-anchor="start" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="9" font-weight="400">Rectangle: span or record; arrow: parent to child or join</text>
        <text x="40" y="524" text-anchor="start" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="9" font-weight="400">Green box: lesson focus, not approval or a safety rating</text>
      </svg>
