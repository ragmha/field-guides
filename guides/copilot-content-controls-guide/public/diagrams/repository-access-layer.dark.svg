<?xml version="1.0" encoding="UTF-8"?>
<svg id="repository-access-layer-dark-root" viewBox="0 0 704 528" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="repository-access-layer-dark-title repository-access-layer-dark-desc">
        <title id="repository-access-layer-dark-title">Access sits beneath exclusion</title>
        <desc id="repository-access-layer-dark-desc">Base permissions, repository roles and deploy key reviews limit who can reach content before content exclusion limits what Copilot uses.</desc>
        <defs><marker id="repository-access-layer-dark-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#9198a1"/></marker></defs>
        <rect x="0" y="0" width="704" height="528" fill="#07090d"/>
        <path d="M 352 104 L 352 128" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#repository-access-layer-dark-arrow)"/>
        <path d="M 352 192 L 352 216" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#repository-access-layer-dark-arrow)"/>
        <path d="M 352 280 L 352 304" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#repository-access-layer-dark-arrow)"/>
        <rect x="40" y="40" width="624" height="64" rx="6" fill="#0d1117" stroke="#9198a1" stroke-width="1.5"/>
        <text x="352.0" y="68.0" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Base permissions</text>
        <text x="352.0" y="84.0" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Set by organization owners for all members</text>
        <rect x="72" y="128" width="560" height="64" rx="6" fill="#0d1117" stroke="#9198a1" stroke-width="1.5"/>
        <text x="352.0" y="156.0" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Repository roles</text>
        <text x="352.0" y="172.0" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Read, Triage, Moderate, Write, Maintain, Admin</text>
        <rect x="104" y="216" width="496" height="64" rx="6" fill="#0d1117" stroke="#9198a1" stroke-width="1.5"/>
        <text x="352.0" y="244.0" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Deploy keys</text>
        <text x="352.0" y="260.0" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Key holders keep access after leaving; review them</text>
        <rect x="136" y="304" width="432" height="64" rx="6" fill="#102219" stroke="#3fb950" stroke-width="1.5"/>
        <text x="352.0" y="332.0" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Content exclusion</text>
        <text x="352.0" y="348.0" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Limits what Copilot uses for people with access</text>
        <text x="40" y="408" text-anchor="start" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Decide who can reach content first; exclusion then limits what Copilot uses.</text>
        <text x="40" y="424" text-anchor="start" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Organization owners have admin access to every repository in the organization.</text>
        <line x1="40" y1="468" x2="664" y2="468" stroke="#3d444d"/>
        <text x="40" y="492" text-anchor="start" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="9" font-weight="400">Band: control layer, narrowing from broad access to Copilot use; arrow: next layer</text>
        <text x="40" y="512" text-anchor="start" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="9" font-weight="400">Green box: lesson focus, not approval or a safety rating</text>
      </svg>
