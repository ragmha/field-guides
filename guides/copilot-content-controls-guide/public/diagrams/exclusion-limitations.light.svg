<?xml version="1.0" encoding="UTF-8"?>
<svg id="exclusion-limitations-light-root" viewBox="0 0 704 648" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="exclusion-limitations-light-title exclusion-limitations-light-desc">
        <title id="exclusion-limitations-light-title">Layers around exclusion</title>
        <desc id="exclusion-limitations-light-desc">Repository access, operating-system permissions and content exclusion stack together, with documented exclusion gaps noted beside each layer.</desc>
        <defs><marker id="exclusion-limitations-light-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#59636e"/></marker></defs>
        <rect x="0" y="0" width="704" height="648" fill="#f3f5f7"/>
        <rect x="40" y="40" width="624" height="64" rx="6" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <text x="352.0" y="68.0" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Repository access</text>
        <text x="352.0" y="84.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Roles, base permissions and deploy keys decide who can read</text>
        <rect x="40" y="128" width="624" height="64" rx="6" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <text x="352.0" y="156.0" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Operating-system permissions</text>
        <text x="352.0" y="172.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Protect files on developer machines from any process</text>
        <rect x="40" y="216" width="624" height="64" rx="6" fill="#eaf6ed" stroke="#1a7f37" stroke-width="1.5"/>
        <text x="352.0" y="244.0" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Content exclusion</text>
        <text x="352.0" y="260.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Guardrail for GitHub-controlled Copilot tools</text>
        <text x="40" y="320" text-anchor="start" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Documented exclusion gaps</text>
        <rect x="40" y="336" width="300" height="64" rx="6" fill="#f3f5f7" stroke="#d1d9e0" stroke-width="1.5"/>
        <text x="190.0" y="364.0" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Third-party MCP servers and clients</text>
        <text x="190.0" y="380.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Not guaranteed to respect exclusion</text>
        <rect x="364" y="336" width="300" height="64" rx="6" fill="#f3f5f7" stroke="#d1d9e0" stroke-width="1.5"/>
        <text x="514.0" y="364.0" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Indirect IDE information</text>
        <text x="514.0" y="380.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Types, hover definitions, build config</text>
        <rect x="40" y="424" width="300" height="64" rx="6" fill="#f3f5f7" stroke="#d1d9e0" stroke-width="1.5"/>
        <text x="190.0" y="452.0" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Agent indirect access</text>
        <text x="190.0" y="468.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Scripts may reach files in ways not caught</text>
        <rect x="364" y="424" width="300" height="64" rx="6" fill="#f3f5f7" stroke="#d1d9e0" stroke-width="1.5"/>
        <text x="514.0" y="452.0" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Symlinks and remote filesystems</text>
        <text x="514.0" y="468.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Exclusions do not apply</text>
        <text x="40" y="528" text-anchor="start" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Read the layers top to bottom: decide who can reach content before limiting what Copilot uses.</text>
        <text x="40" y="544" text-anchor="start" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">The gaps describe exclusion only; they are not a ranking of risk.</text>
        <line x1="40" y1="588" x2="664" y2="588" stroke="#d1d9e0"/>
        <text x="40" y="612" text-anchor="start" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="9" font-weight="400">Band: control layer; gray box: documented exclusion gap</text>
        <text x="40" y="632" text-anchor="start" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="9" font-weight="400">Green box: lesson focus, not approval or a safety rating</text>
      </svg>
