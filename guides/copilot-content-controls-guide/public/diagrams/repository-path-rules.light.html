<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Choosing a path pattern</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif; background: #f3f5f7; color: #1f2328; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 704px; min-width: 0; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow { font-size: .66rem; color: #59636e; margin-bottom: .5rem; }
    h1 { font-size: 1.75rem; line-height: 1.15; margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 704px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Copilot Content Controls · Decision flowchart</p>
    <h1>Choosing a path pattern</h1>
    <div class="diagram-container" tabindex="0" role="region" aria-label="Choosing a path pattern. Scroll horizontally to explore.">
      <svg viewBox="0 0 704 776" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="repository-path-rules-light-title repository-path-rules-light-desc">
        <title id="repository-path-rules-light-title">Choosing a path pattern</title>
        <desc id="repository-path-rules-light-desc">Decide between an anchored path, a file name anywhere, a name wildcard or a directory tree when writing a repository exclusion.</desc>
        <defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#59636e"/></marker></defs>
        <rect x="0" y="0" width="704" height="776" fill="#f3f5f7"/>
        <path d="M 232 96 L 232 120" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#arrow)"/>
        <path d="M 344 176 L 456 176" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="388.5" y="170" width="23" height="12" rx="2" fill="#f3f5f7"/><text x="400" y="179" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="8" font-weight="400">YES</text>
        <path d="M 232 232 L 232 264" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="243.5" y="242.0" width="17" height="12" rx="2" fill="#f3f5f7"/><text x="252" y="251.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="8" font-weight="400">NO</text>
        <path d="M 344 320 L 456 320" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="388.5" y="314" width="23" height="12" rx="2" fill="#f3f5f7"/><text x="400" y="323" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="8" font-weight="400">YES</text>
        <path d="M 232 376 L 232 408" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="243.5" y="386.0" width="17" height="12" rx="2" fill="#f3f5f7"/><text x="252" y="395.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="8" font-weight="400">NO</text>
        <path d="M 344 464 L 456 464" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="388.5" y="458" width="23" height="12" rx="2" fill="#f3f5f7"/><text x="400" y="467" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="8" font-weight="400">YES</text>
        <path d="M 232 520 L 232 560" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="243.5" y="534.0" width="17" height="12" rx="2" fill="#f3f5f7"/><text x="252" y="543.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="8" font-weight="400">NO</text>
        <rect x="120" y="40" width="224" height="56" rx="20" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <text x="232.0" y="64.0" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Content to exclude</text>
        <text x="232.0" y="80.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">One rule per line in repository settings</text>
        <polygon points="232,120 344,176 232,232 120,176" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <text x="232" y="180" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">One exact file?</text>
        <rect x="456" y="148" width="208" height="56" rx="6" fill="#eaf6ed" stroke="#1a7f37" stroke-width="1.5"/>
        <text x="560.0" y="172.0" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Anchored path</text>
        <text x="560.0" y="188.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">- &quot;/src/some-dir/kernel.rs&quot;</text>
        <polygon points="232,264 344,320 232,376 120,320" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <text x="232" y="316" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Same name</text>
        <text x="232" y="332" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="400">anywhere?</text>
        <rect x="456" y="292" width="208" height="56" rx="6" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <text x="560.0" y="316.0" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">File name pattern</text>
        <text x="560.0" y="332.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">- &quot;secrets.json&quot; or &quot;secret*&quot;</text>
        <polygon points="232,408 344,464 232,520 120,464" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <text x="232" y="460" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Whole directory</text>
        <text x="232" y="476" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="400">tree?</text>
        <rect x="456" y="436" width="208" height="56" rx="6" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <text x="560.0" y="460.0" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Anchored tree</text>
        <text x="560.0" y="476.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">- &quot;/scripts/**&quot;</text>
        <rect x="120" y="560" width="224" height="56" rx="20" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <text x="232.0" y="584.0" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Extension wildcard</text>
        <text x="232.0" y="600.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">- &quot;*.cfg&quot;</text>
        <text x="40" y="656" text-anchor="start" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Patterns use fnmatch rules and are case insensitive. A leading slash anchors to the repository root.</text>
        <text x="40" y="672" text-anchor="start" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Lines starting with # are comments.</text>
        <line x1="40" y1="716" x2="664" y2="716" stroke="#d1d9e0"/>
        <text x="40" y="740" text-anchor="start" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="9" font-weight="400">Oval: start/end; rectangle: action; diamond: decision; arrow: next step</text>
        <text x="40" y="760" text-anchor="start" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="9" font-weight="400">Green box: lesson focus, not approval or a safety rating</text>
      </svg>
    </div>
  </div>
</body>
</html>
