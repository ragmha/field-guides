<?xml version="1.0" encoding="UTF-8"?>
<svg id="code-referencing-review-light-root" viewBox="0 0 704 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="code-referencing-review-light-title code-referencing-review-light-desc">
        <title id="code-referencing-review-light-title">Acting on a code reference</title>
        <desc id="code-referencing-review-light-desc">An accepted, unchanged suggestion that matches public code produces a log entry that a developer reviews to use, attribute or remove the code.</desc>
        <defs><marker id="code-referencing-review-light-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#59636e"/></marker></defs>
        <rect x="0" y="0" width="704" height="640" fill="#f3f5f7"/>
        <path d="M 208 96 L 248 96" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#code-referencing-review-light-arrow)"/>
        <path d="M 456 96 L 496 96" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#code-referencing-review-light-arrow)"/><rect x="467.5" y="90" width="17" height="12" rx="2" fill="#f3f5f7"/><text x="476" y="99" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="8" font-weight="400">NO</text>
        <path d="M 352 152 L 352 192" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#code-referencing-review-light-arrow)"/><rect x="360.5" y="166" width="23" height="12" rx="2" fill="#f3f5f7"/><text x="372" y="175" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="8" font-weight="400">YES</text>
        <path d="M 352 264 L 352 304" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#code-referencing-review-light-arrow)"/>
        <path d="M 300 360 L 300 384 A 8 8 0 0 1 292 392 L 144 392 A 8 8 0 0 0 136 400 L 136 424" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#code-referencing-review-light-arrow)"/>
        <path d="M 352 360 L 352 424" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#code-referencing-review-light-arrow)"/>
        <path d="M 404 360 L 404 384 A 8 8 0 0 0 412 392 L 560 392 A 8 8 0 0 1 568 400 L 568 424" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#code-referencing-review-light-arrow)"/>
        <rect x="40" y="68" width="168" height="56" rx="20" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <text x="124.0" y="92.0" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Suggestion matches</text>
        <text x="124.0" y="108.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Policy set to Allow</text>
        <polygon points="352,40 456,96 352,152 248,96" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <text x="352" y="92" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Accepted</text>
        <text x="352" y="108" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="400">unchanged?</text>
        <rect x="496" y="68" width="168" height="56" rx="20" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <text x="580.0" y="92.0" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Not logged</text>
        <text x="580.0" y="108.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">No code reference</text>
        <rect x="232" y="192" width="240" height="72" rx="6" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <text x="352.0" y="216.0" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Code reference logged</text>
        <text x="352.0" y="232.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">File URL, license, code extract</text>
        <text x="352.0" y="248.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Editor log or chat notice</text>
        <rect x="232" y="304" width="240" height="56" rx="6" fill="#eaf6ed" stroke="#1a7f37" stroke-width="1.5"/>
        <text x="352.0" y="328.0" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Developer reviews match</text>
        <text x="352.0" y="344.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Against team policy</text>
        <rect x="40" y="424" width="192" height="56" rx="20" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <text x="136.0" y="448.0" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Use</text>
        <text x="136.0" y="464.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Policy allows as is</text>
        <rect x="256" y="424" width="192" height="56" rx="20" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <text x="352.0" y="448.0" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Attribute</text>
        <text x="352.0" y="464.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Per open source policy</text>
        <rect x="472" y="424" width="192" height="56" rx="20" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <text x="568.0" y="448.0" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Remove</text>
        <text x="568.0" y="464.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Rewrite the code</text>
        <text x="40" y="520" text-anchor="start" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">The index excludes private repositories and code outside GitHub and may be out of date.</text>
        <text x="40" y="536" text-anchor="start" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Matches occur in less than 1% of inline suggestions, so an empty log is a normal result.</text>
        <line x1="40" y1="580" x2="664" y2="580" stroke="#d1d9e0"/>
        <text x="40" y="604" text-anchor="start" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="9" font-weight="400">Oval: start/end; rectangle: action; diamond: decision; arrow: next step</text>
        <text x="40" y="624" text-anchor="start" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="9" font-weight="400">Green box: lesson focus, not approval or a safety rating</text>
      </svg>
