<?xml version="1.0" encoding="UTF-8"?>
<svg id="secret-push-protection-light-root" viewBox="0 0 704 568" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="secret-push-protection-light-title secret-push-protection-light-desc">
        <title id="secret-push-protection-light-title">A blocked push and its bypass</title>
        <desc id="secret-push-protection-light-desc">A developer push containing a secret is blocked, then either fixed or bypassed with a reason that creates an alert and an audit log entry.</desc>
        <defs><marker id="secret-push-protection-light-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#59636e"/></marker></defs>
        <rect x="0" y="0" width="704" height="568" fill="#f3f5f7"/>
        <rect x="40" y="40" width="624" height="112" rx="6" fill="#ffffff" stroke="#d1d9e0" stroke-width="1"/>
        <rect x="40" y="168" width="624" height="112" rx="6" fill="#ffffff" stroke="#d1d9e0" stroke-width="1"/>
        <rect x="40" y="296" width="624" height="112" rx="6" fill="#ffffff" stroke="#d1d9e0" stroke-width="1"/>
        <path d="M 224 124 L 224 196" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#secret-push-protection-light-arrow)"/>
        <path d="M 296 212 L 388 212 A 8 8 0 0 0 396 204 L 396 124" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#secret-push-protection-light-arrow)"/><rect x="334.5" y="206" width="23" height="12" rx="2" fill="#f3f5f7"/><text x="346" y="215" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="8" font-weight="400">FIX</text>
        <path d="M 296 236 L 552 236 A 8 8 0 0 0 560 228 L 560 124" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#secret-push-protection-light-arrow)"/><rect x="479.5" y="230" width="41" height="12" rx="2" fill="#f3f5f7"/><text x="500" y="239" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="8" font-weight="400">BYPASS</text>
        <path d="M 620 124 L 620 316" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#secret-push-protection-light-arrow)"/>
        <path d="M 496 352 L 456 352" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#secret-push-protection-light-arrow)"/>
        <text x="52" y="100" text-anchor="start" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Developer</text>
        <text x="52" y="228" text-anchor="start" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">GitHub</text>
        <text x="52" y="356" text-anchor="start" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Security team</text>
        <rect x="152" y="68" width="144" height="56" rx="6" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <text x="224.0" y="92.0" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Push with secret</text>
        <text x="224.0" y="108.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Command line or UI</text>
        <rect x="320" y="68" width="152" height="56" rx="20" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <text x="396.0" y="92.0" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Remove secret</text>
        <text x="396.0" y="108.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Then push again</text>
        <rect x="496" y="68" width="152" height="56" rx="6" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <text x="572.0" y="92.0" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Bypass with reason</text>
        <text x="572.0" y="108.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Write access by default</text>
        <rect x="152" y="196" width="144" height="56" rx="6" fill="#eaf6ed" stroke="#1a7f37" stroke-width="1.5"/>
        <text x="224.0" y="220.0" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Push blocked</text>
        <text x="224.0" y="236.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Secret detected</text>
        <rect x="496" y="316" width="152" height="72" rx="6" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <text x="572.0" y="340.0" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Alert and audit log</text>
        <text x="572.0" y="356.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Closed: tests, false</text>
        <text x="572.0" y="372.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">positive. Open: fix later</text>
        <rect x="296" y="324" width="160" height="56" rx="20" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <text x="376.0" y="348.0" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Review and rotate</text>
        <text x="376.0" y="364.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">If the secret is real</text>
        <text x="40" y="448" text-anchor="start" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">User push protection: on by default, public repositories only, no alerts.</text>
        <text x="40" y="464" text-anchor="start" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Repository push protection needs GitHub Secret Protection. Code review secret detection is in public preview.</text>
        <line x1="40" y1="508" x2="664" y2="508" stroke="#d1d9e0"/>
        <text x="40" y="532" text-anchor="start" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="9" font-weight="400">Lane: actor; rectangle: action; oval: end state; arrow: next step</text>
        <text x="40" y="552" text-anchor="start" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="9" font-weight="400">Green box: lesson focus, not approval or a safety rating</text>
      </svg>
