<?xml version="1.0" encoding="UTF-8"?>
<svg id="organization-repository-references-light-root" viewBox="0 0 704 792" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="organization-repository-references-light-title organization-repository-references-light-desc">
        <title id="organization-repository-references-light-title">How an organization rule matches</title>
        <desc id="organization-repository-references-light-desc">An organization rule applies to seat holders, matches a repository reference or the star key, then matches a path on a supported surface.</desc>
        <defs><marker id="organization-repository-references-light-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#59636e"/></marker></defs>
        <rect x="0" y="0" width="704" height="792" fill="#f3f5f7"/>
        <path d="M 232 96 L 232 120" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#organization-repository-references-light-arrow)"/>
        <path d="M 344 176 L 456 176" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#organization-repository-references-light-arrow)"/><rect x="391.5" y="170" width="17" height="12" rx="2" fill="#f3f5f7"/><text x="400" y="179" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="8" font-weight="400">NO</text>
        <path d="M 232 232 L 232 264" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#organization-repository-references-light-arrow)"/><rect x="242.5" y="242.0" width="23" height="12" rx="2" fill="#f3f5f7"/><text x="254" y="251.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="8" font-weight="400">YES</text>
        <path d="M 344 320 L 456 320" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#organization-repository-references-light-arrow)"/><rect x="391.5" y="314" width="17" height="12" rx="2" fill="#f3f5f7"/><text x="400" y="323" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="8" font-weight="400">NO</text>
        <path d="M 232 376 L 232 408" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#organization-repository-references-light-arrow)"/><rect x="242.5" y="386.0" width="23" height="12" rx="2" fill="#f3f5f7"/><text x="254" y="395.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="8" font-weight="400">YES</text>
        <path d="M 344 464 L 456 464" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#organization-repository-references-light-arrow)"/><rect x="391.5" y="458" width="17" height="12" rx="2" fill="#f3f5f7"/><text x="400" y="467" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="8" font-weight="400">NO</text>
        <path d="M 232 520 L 232 560" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#organization-repository-references-light-arrow)"/><rect x="242.5" y="534.0" width="23" height="12" rx="2" fill="#f3f5f7"/><text x="254" y="543.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="8" font-weight="400">YES</text>
        <rect x="120" y="40" width="224" height="56" rx="20" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <text x="232.0" y="64.0" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">File opened by a user</text>
        <text x="232.0" y="80.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">In Git or outside Git control</text>
        <polygon points="232,120 344,176 232,232 120,176" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <text x="232" y="172" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Seat from</text>
        <text x="232" y="188" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="400">this org?</text>
        <rect x="456" y="148" width="208" height="56" rx="20" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <text x="560.0" y="172.0" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Org rule skipped</text>
        <text x="560.0" y="188.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Other levels may still apply</text>
        <polygon points="232,264 344,320 232,376 120,320" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <text x="232" y="316" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Repo reference</text>
        <text x="232" y="332" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="400">or &quot;*&quot; matches?</text>
        <rect x="456" y="292" width="208" height="56" rx="20" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <text x="560.0" y="316.0" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Entry does not apply</text>
        <text x="560.0" y="332.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Check other entries</text>
        <polygon points="232,408 344,464 232,520 120,464" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <text x="232" y="460" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Path pattern</text>
        <text x="232" y="476" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="400">matches?</text>
        <rect x="456" y="436" width="208" height="56" rx="20" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <text x="560.0" y="460.0" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">File not excluded</text>
        <text x="560.0" y="476.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">By this entry</text>
        <rect x="104" y="560" width="256" height="72" rx="20" fill="#eaf6ed" stroke="#1a7f37" stroke-width="1.5"/>
        <text x="232.0" y="592.0" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Excluded for this user</text>
        <text x="232.0" y="608.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">On supported surfaces only</text>
        <text x="40" y="672" text-anchor="start" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">References: repository name, HTTPS, git, SSH or wildcard. Protocol, user@ and port are ignored.</text>
        <text x="40" y="688" text-anchor="start" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Enterprise rules use the same syntax and apply to every Copilot user in the enterprise.</text>
        <line x1="40" y1="732" x2="664" y2="732" stroke="#d1d9e0"/>
        <text x="40" y="756" text-anchor="start" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="9" font-weight="400">Oval: start/end; rectangle: action; diamond: decision; arrow: next step</text>
        <text x="40" y="776" text-anchor="start" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="9" font-weight="400">Green box: lesson focus, not approval or a safety rating</text>
      </svg>
