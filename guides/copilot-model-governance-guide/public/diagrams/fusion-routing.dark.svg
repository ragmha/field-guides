<?xml version="1.0" encoding="UTF-8"?>
<svg id="fusion-routing-dark-root" viewBox="0 0 704 728" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fusion-routing-dark-title fusion-routing-dark-desc">
        <title id="fusion-routing-dark-title">Fusion execution patterns</title>
        <desc id="fusion-routing-dark-desc">Fusion routes a prompt through a Single, Cascade or Critique pattern and returns one response, billed per model used.</desc>
        <defs><marker id="fusion-routing-dark-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#9198a1"/></marker></defs>
        <rect x="0" y="0" width="704" height="728" fill="#07090d"/>
        <rect x="40" y="40" width="624" height="56" rx="20" fill="#0d1117" stroke="#9198a1" stroke-width="1.5"/>
        <text x="352.0" y="64.0" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Prompt arrives</text>
        <text x="352.0" y="80.0" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Fusion chooses models, a pattern and an effort level</text>
        <path d="M 136 96 L 136 136" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#fusion-routing-dark-arrow)"/>
        <path d="M 352 96 L 352 136" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#fusion-routing-dark-arrow)"/>
        <path d="M 568 96 L 568 136" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#fusion-routing-dark-arrow)"/>
        <rect x="40" y="136" width="192" height="56" rx="6" fill="#0d1117" stroke="#9198a1" stroke-width="1.5"/>
        <text x="136.0" y="160.0" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Single</text>
        <text x="136.0" y="176.0" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">One model</text>
        <rect x="256" y="136" width="192" height="56" rx="6" fill="#102219" stroke="#3fb950" stroke-width="1.5"/>
        <text x="352.0" y="160.0" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Cascade</text>
        <text x="352.0" y="176.0" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Draft, judge, escalate</text>
        <rect x="472" y="136" width="192" height="56" rx="6" fill="#0d1117" stroke="#9198a1" stroke-width="1.5"/>
        <text x="568.0" y="160.0" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Critique</text>
        <text x="568.0" y="176.0" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Draft, critique, revise</text>
        <path d="M 136 192 L 136 224" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#fusion-routing-dark-arrow)"/>
        <rect x="40" y="224" width="192" height="56" rx="6" fill="#0d1117" stroke="#9198a1" stroke-width="1.5"/>
        <text x="136.0" y="248.0" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Model completes task</text>
        <text x="136.0" y="264.0" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">No judge or critique</text>
        <path d="M 136 280 L 136 496" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#fusion-routing-dark-arrow)"/>
        <path d="M 352 192 L 352 224" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#fusion-routing-dark-arrow)"/>
        <rect x="256" y="224" width="192" height="56" rx="6" fill="#0d1117" stroke="#9198a1" stroke-width="1.5"/>
        <text x="352.0" y="248.0" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Efficient model drafts</text>
        <text x="352.0" y="264.0" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Lower-cost first attempt</text>
        <path d="M 352 280 L 352 312" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#fusion-routing-dark-arrow)"/>
        <rect x="256" y="312" width="192" height="56" rx="6" fill="#0d1117" stroke="#9198a1" stroke-width="1.5"/>
        <text x="352.0" y="336.0" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Judge reviews draft</text>
        <text x="352.0" y="352.0" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Accept or escalate</text>
        <path d="M 352 368 L 352 400" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#fusion-routing-dark-arrow)"/>
        <rect x="256" y="400" width="192" height="56" rx="6" fill="#0d1117" stroke="#9198a1" stroke-width="1.5"/>
        <text x="352.0" y="424.0" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Stronger model</text>
        <text x="352.0" y="440.0" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Only if escalated</text>
        <path d="M 352 456 L 352 496" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#fusion-routing-dark-arrow)"/>
        <path d="M 568 192 L 568 224" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#fusion-routing-dark-arrow)"/>
        <rect x="472" y="224" width="192" height="56" rx="6" fill="#0d1117" stroke="#9198a1" stroke-width="1.5"/>
        <text x="568.0" y="248.0" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">One model drafts</text>
        <text x="568.0" y="264.0" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">First attempt</text>
        <path d="M 568 280 L 568 312" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#fusion-routing-dark-arrow)"/>
        <rect x="472" y="312" width="192" height="56" rx="6" fill="#0d1117" stroke="#9198a1" stroke-width="1.5"/>
        <text x="568.0" y="336.0" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Models critique</text>
        <text x="568.0" y="352.0" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Several, in parallel</text>
        <path d="M 568 368 L 568 400" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#fusion-routing-dark-arrow)"/>
        <rect x="472" y="400" width="192" height="56" rx="6" fill="#0d1117" stroke="#9198a1" stroke-width="1.5"/>
        <text x="568.0" y="424.0" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">First model revises</text>
        <text x="568.0" y="440.0" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Uses the critiques</text>
        <path d="M 568 456 L 568 496" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#fusion-routing-dark-arrow)"/>
        <rect x="40" y="496" width="624" height="56" rx="20" fill="#0d1117" stroke="#9198a1" stroke-width="1.5"/>
        <text x="352.0" y="520.0" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">One response returned</text>
        <text x="352.0" y="536.0" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Billed per model used; no separate Fusion charge</text>
        <text x="40" y="592" text-anchor="start" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Effort levels include Standard, High and Max; higher effort can call more models and use more credits.</text>
        <text x="40" y="608" text-anchor="start" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Disabling required models, such as frontier models, can make Fusion Max unavailable.</text>
        <text x="40" y="624" text-anchor="start" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Draft file edits are not undone automatically if Fusion discards the draft.</text>
        <line x1="40" y1="656" x2="664" y2="656" stroke="#3d444d"/>
        <text x="40" y="680" text-anchor="start" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="9" font-weight="400">Oval: start/end; rectangle: pattern or step; arrow: next step</text>
        <text x="40" y="700" text-anchor="start" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="9" font-weight="400">Green box: lesson focus, not approval or a safety rating</text>
      </svg>
