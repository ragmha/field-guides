<?xml version="1.0" encoding="UTF-8"?>
<svg id="ownership-and-continuity-light-root" viewBox="0 0 704 436" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ownership-and-continuity-light-title ownership-and-continuity-light-desc">
        <title id="ownership-and-continuity-light-title">Ownership lifecycle for an automation</title>
        <desc id="ownership-and-continuity-light-desc">Create, run and discover an automation, then review its owner, recreate a personal routine as shared and retire the old one.</desc>
        <defs><marker id="ownership-and-continuity-light-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#59636e"/></marker></defs>
        <rect x="0" y="0" width="704" height="436" fill="#f3f5f7"/>
        <path d="M 216 108 L 264 108" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#ownership-and-continuity-light-arrow)"/>
        <path d="M 440 108 L 488 108" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#ownership-and-continuity-light-arrow)"/>
        <path d="M 576 144 L 576 200" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#ownership-and-continuity-light-arrow)"/>
        <path d="M 488 236 L 440 236" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#ownership-and-continuity-light-arrow)"/>
        <path d="M 264 236 L 216 236" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#ownership-and-continuity-light-arrow)"/>
        <rect x="40" y="72" width="176" height="72" rx="6" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <text x="128.0" y="104.0" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Create</text>
        <text x="128.0" y="120.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Type fixed at creation</text>
        <rect x="264" y="72" width="176" height="72" rx="6" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <text x="352.0" y="104.0" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Run</text>
        <text x="352.0" y="120.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Runs visible to readers</text>
        <rect x="488" y="72" width="176" height="72" rx="6" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <text x="576.0" y="104.0" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Discover</text>
        <text x="576.0" y="120.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">All sessions on Agents tab</text>
        <rect x="488" y="200" width="176" height="72" rx="6" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <text x="576.0" y="232.0" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Review owner</text>
        <text x="576.0" y="248.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Creator role changing</text>
        <rect x="264" y="200" width="176" height="72" rx="6" fill="#eaf6ed" stroke="#1a7f37" stroke-width="1.5"/>
        <text x="352.0" y="232.0" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Recreate as shared</text>
        <text x="352.0" y="248.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Repository owns routine</text>
        <rect x="40" y="200" width="176" height="72" rx="6" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <text x="128.0" y="232.0" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Retire the old one</text>
        <text x="128.0" y="248.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Disable or delete it</text>
        <text x="40" y="312" text-anchor="start" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">What happens to a personal automation when its creator loses access is not documented.</text>
        <text x="40" y="328" text-anchor="start" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">The order of steps is guide advice, not a GitHub procedure.</text>
        <line x1="40" y1="376" x2="664" y2="376" stroke="#d1d9e0"/>
        <text x="40" y="400" text-anchor="start" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="9" font-weight="400">Boxes: lifecycle stages; arrows: order of stages</text>
        <text x="40" y="420" text-anchor="start" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="9" font-weight="400">Green box: lesson focus, not approval or a safety rating</text>
      </svg>
