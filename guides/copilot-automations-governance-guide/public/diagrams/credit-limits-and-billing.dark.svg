<?xml version="1.0" encoding="UTF-8"?>
<svg id="credit-limits-and-billing-dark-root" viewBox="0 0 704 444" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="credit-limits-and-billing-dark-title credit-limits-and-billing-dark-desc">
        <title id="credit-limits-and-billing-dark-title">How credit limits play out over one day</title>
        <desc id="credit-limits-and-billing-dark-desc">In a hypothetical hourly automation, per-run limits cap each run, the run that crosses the daily limit can finish, and later runs are blocked until the daily reset.</desc>
        <defs><marker id="credit-limits-and-billing-dark-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#9198a1"/></marker></defs>
        <rect x="0" y="0" width="704" height="444" fill="#07090d"/>
        <line x1="92" y1="136" x2="92" y2="168" stroke="#9198a1" stroke-width="1.5"/>
        <line x1="220" y1="136" x2="220" y2="168" stroke="#9198a1" stroke-width="1.5"/>
        <line x1="348" y1="136" x2="348" y2="168" stroke="#9198a1" stroke-width="1.5"/>
        <line x1="476" y1="136" x2="476" y2="168" stroke="#9198a1" stroke-width="1.5"/>
        <line x1="604" y1="136" x2="604" y2="168" stroke="#9198a1" stroke-width="1.5"/>
        <path d="M 40 176 L 664 176" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#credit-limits-and-billing-dark-arrow)"/>
        <rect x="40" y="72" width="104" height="64" rx="6" fill="#0d1117" stroke="#9198a1" stroke-width="1.5"/>
        <text x="92.0" y="100.0" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">00:00 UTC</text>
        <text x="92.0" y="116.0" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Limit resets</text>
        <rect x="168" y="72" width="104" height="64" rx="6" fill="#0d1117" stroke="#9198a1" stroke-width="1.5"/>
        <text x="220.0" y="100.0" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Earlier runs</text>
        <text x="220.0" y="116.0" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">200 cap each</text>
        <rect x="296" y="72" width="104" height="64" rx="6" fill="#102219" stroke="#3fb950" stroke-width="1.5"/>
        <text x="348.0" y="100.0" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Crossing run</text>
        <text x="348.0" y="116.0" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Can finish</text>
        <rect x="424" y="72" width="104" height="64" rx="6" fill="#0d1117" stroke="#9198a1" stroke-width="1.5"/>
        <text x="476.0" y="100.0" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Later runs</text>
        <text x="476.0" y="116.0" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Wait for reset</text>
        <rect x="552" y="72" width="104" height="64" rx="6" fill="#0d1117" stroke="#9198a1" stroke-width="1.5"/>
        <text x="604.0" y="100.0" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Next 00:00 UTC</text>
        <text x="604.0" y="116.0" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Limit resets</text>
        <circle cx="92" cy="176" r="4" fill="#9198a1"/>
        <circle cx="220" cy="176" r="4" fill="#9198a1"/>
        <circle cx="348" cy="176" r="4" fill="#9198a1"/>
        <circle cx="476" cy="176" r="4" fill="#9198a1"/>
        <circle cx="604" cy="176" r="4" fill="#9198a1"/>
        <rect x="40" y="216" width="300" height="64" rx="6" fill="#0d1117" stroke="#9198a1" stroke-width="1.5"/>
        <text x="190.0" y="244.0" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">AI credits</text>
        <text x="190.0" y="260.0" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Creator or repository owner, by type</text>
        <rect x="364" y="216" width="300" height="64" rx="6" fill="#0d1117" stroke="#9198a1" stroke-width="1.5"/>
        <text x="514.0" y="244.0" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Actions minutes</text>
        <text x="514.0" y="260.0" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Billed to the repository owner</text>
        <text x="40" y="320" text-anchor="start" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Hypothetical hourly automation: 200-credit per-run limit and 2,000-credit daily limit.</text>
        <text x="40" y="336" text-anchor="start" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Per-run limits stop a run; periodic limits only block new runs. The per-run minimum is 30.</text>
        <line x1="40" y1="384" x2="664" y2="384" stroke="#3d444d"/>
        <text x="40" y="408" text-anchor="start" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="9" font-weight="400">Boxes above the line: points in one day; boxes below: the two meters</text>
        <text x="40" y="428" text-anchor="start" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="9" font-weight="400">Green box: lesson focus, not approval or a safety rating</text>
      </svg>
