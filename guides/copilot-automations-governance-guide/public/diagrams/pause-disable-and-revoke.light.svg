<?xml version="1.0" encoding="UTF-8"?>
<svg id="pause-disable-and-revoke-light-root" viewBox="0 0 704 748" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="pause-disable-and-revoke-light-title pause-disable-and-revoke-light-desc">
        <title id="pause-disable-and-revoke-light-title">Pick the switch that matches the scope</title>
        <desc id="pause-disable-and-revoke-light-desc">Stop one session, disable one automation, turn off automations for an organization, or use the enterprise policy. Then verify and revoke script tokens.</desc>
        <defs><marker id="pause-disable-and-revoke-light-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#59636e"/></marker></defs>
        <rect x="0" y="0" width="704" height="748" fill="#f3f5f7"/>
        <path d="M 232 88 L 232 120" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#pause-disable-and-revoke-light-arrow)"/>
        <path d="M 344 168 L 400 168" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#pause-disable-and-revoke-light-arrow)"/><rect x="358" y="150" width="24.5" height="12" rx="2" fill="#f3f5f7"/><text x="370.25" y="159" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="8" font-weight="400">YES</text>
        <path d="M 232 216 L 232 248" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#pause-disable-and-revoke-light-arrow)"/><rect x="240" y="222" width="19.0" height="12" rx="2" fill="#f3f5f7"/><text x="249.5" y="231" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="8" font-weight="400">NO</text>
        <path d="M 344 296 L 400 296" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#pause-disable-and-revoke-light-arrow)"/><rect x="358" y="278" width="24.5" height="12" rx="2" fill="#f3f5f7"/><text x="370.25" y="287" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="8" font-weight="400">YES</text>
        <path d="M 232 344 L 232 376" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#pause-disable-and-revoke-light-arrow)"/><rect x="240" y="350" width="19.0" height="12" rx="2" fill="#f3f5f7"/><text x="249.5" y="359" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="8" font-weight="400">NO</text>
        <path d="M 344 424 L 400 424" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#pause-disable-and-revoke-light-arrow)"/><rect x="358" y="406" width="24.5" height="12" rx="2" fill="#f3f5f7"/><text x="370.25" y="415" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="8" font-weight="400">YES</text>
        <path d="M 232 472 L 232 504" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#pause-disable-and-revoke-light-arrow)"/><rect x="240" y="478" width="19.0" height="12" rx="2" fill="#f3f5f7"/><text x="249.5" y="487" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="8" font-weight="400">NO</text>
        <rect x="120" y="40" width="224" height="48" rx="24" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <text x="232.0" y="68.0" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Unwanted runs</text>
        <polygon points="232,120 344,168 232,216 120,168" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <text x="232" y="172.0" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">One run?</text>
        <rect x="400" y="136" width="264" height="64" rx="6" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <text x="532.0" y="164.0" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Stop session</text>
        <text x="532.0" y="180.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Pushed commits are kept</text>
        <polygon points="232,248 344,296 232,344 120,296" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <text x="232" y="300.0" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">One automation?</text>
        <rect x="400" y="264" width="264" height="64" rx="6" fill="#eaf6ed" stroke="#1a7f37" stroke-width="1.5"/>
        <text x="532.0" y="292.0" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Disable the automation</text>
        <text x="532.0" y="308.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">UI or enabled set to false</text>
        <polygon points="232,376 344,424 232,472 120,424" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <text x="232" y="428.0" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">One organization?</text>
        <rect x="400" y="392" width="264" height="64" rx="6" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <text x="532.0" y="420.0" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Turn off Allow automations</text>
        <text x="532.0" y="436.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Or limit repository access</text>
        <rect x="120" y="504" width="224" height="64" rx="6" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <text x="232.0" y="532.0" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Enterprise cloud policy</text>
        <text x="232.0" y="548.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Organizations cannot override</text>
        <text x="40" y="624" text-anchor="start" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">The effect of a policy change on runs in progress is not documented.</text>
        <text x="40" y="640" text-anchor="start" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Guide advice: stop sessions explicitly, verify the list, and revoke script tokens.</text>
        <line x1="40" y1="688" x2="664" y2="688" stroke="#d1d9e0"/>
        <text x="40" y="712" text-anchor="start" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="9" font-weight="400">Oval: start; rectangle: action; diamond: decision; arrow: next step</text>
        <text x="40" y="732" text-anchor="start" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="9" font-weight="400">Green box: lesson focus, not approval or a safety rating</text>
      </svg>
