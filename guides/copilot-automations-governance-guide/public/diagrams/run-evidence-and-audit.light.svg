<?xml version="1.0" encoding="UTF-8"?>
<svg id="run-evidence-and-audit-light-root" viewBox="0 0 704 436" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="run-evidence-and-audit-light-title run-evidence-and-audit-light-desc">
        <title id="run-evidence-and-audit-light-title">Trace one automation run</title>
        <desc id="run-evidence-and-audit-light-desc">Follow a commit to its session log and automation page, match audit log events and task records, and join them into one evidence trace.</desc>
        <defs><marker id="run-evidence-and-audit-light-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#59636e"/></marker></defs>
        <rect x="0" y="0" width="704" height="436" fill="#f3f5f7"/>
        <path d="M 216 108 L 264 108" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#run-evidence-and-audit-light-arrow)"/>
        <path d="M 440 108 L 488 108" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#run-evidence-and-audit-light-arrow)"/>
        <path d="M 576 144 L 576 200" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#run-evidence-and-audit-light-arrow)"/>
        <path d="M 488 236 L 440 236" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#run-evidence-and-audit-light-arrow)"/>
        <path d="M 264 236 L 216 236" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#run-evidence-and-audit-light-arrow)"/>
        <rect x="40" y="72" width="176" height="72" rx="6" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <text x="128.0" y="104.0" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Commit</text>
        <text x="128.0" y="120.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Copilot author, verified</text>
        <rect x="264" y="72" width="176" height="72" rx="6" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <text x="352.0" y="104.0" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Session log</text>
        <text x="352.0" y="120.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Visible with read access</text>
        <rect x="488" y="72" width="176" height="72" rx="6" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <text x="576.0" y="104.0" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Automation page</text>
        <text x="576.0" y="120.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Sessions and credits</text>
        <rect x="488" y="200" width="176" height="72" rx="6" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <text x="576.0" y="232.0" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Audit log</text>
        <text x="576.0" y="248.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">agent_session_id joins</text>
        <rect x="264" y="200" width="176" height="72" rx="6" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <text x="352.0" y="232.0" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Agent tasks API</text>
        <text x="352.0" y="248.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">State, creator and time</text>
        <rect x="40" y="200" width="176" height="72" rx="6" fill="#eaf6ed" stroke="#1a7f37" stroke-width="1.5"/>
        <text x="128.0" y="232.0" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Evidence trace</text>
        <text x="128.0" y="248.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">One record per run</text>
        <text x="40" y="312" text-anchor="start" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Agent sessions view shows 24 hours; the audit log filter actor:Copilot covers 180 days.</text>
        <text x="40" y="328" text-anchor="start" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Audit events for automation edits are not documented; use revision history.</text>
        <line x1="40" y1="376" x2="664" y2="376" stroke="#d1d9e0"/>
        <text x="40" y="400" text-anchor="start" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="9" font-weight="400">Boxes: evidence sources; arrows: order of the trace</text>
        <text x="40" y="420" text-anchor="start" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="9" font-weight="400">Green box: lesson focus, not approval or a safety rating</text>
      </svg>
