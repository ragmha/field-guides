<?xml version="1.0" encoding="UTF-8"?>
<svg id="review-and-workflow-gates-light-root" viewBox="0 0 704 556" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="review-and-workflow-gates-light-title review-and-workflow-gates-light-desc">
        <title id="review-and-workflow-gates-light-title">Review gates on an automation pull request</title>
        <desc id="review-and-workflow-gates-light-desc">Copilot pushes to one branch and opens a draft pull request. A writer approves workflow runs, people review, and branch rules require the approvals before merge.</desc>
        <defs><marker id="review-and-workflow-gates-light-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#59636e"/></marker></defs>
        <rect x="0" y="0" width="704" height="556" fill="#f3f5f7"/>
        <rect x="40" y="72" width="624" height="96" rx="6" fill="none" stroke="#d1d9e0" stroke-width="1"/>
        <text x="56" y="124.0" text-anchor="start" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Copilot</text>
        <rect x="40" y="184" width="624" height="96" rx="6" fill="none" stroke="#d1d9e0" stroke-width="1"/>
        <text x="56" y="236.0" text-anchor="start" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Rules</text>
        <rect x="40" y="296" width="624" height="96" rx="6" fill="none" stroke="#d1d9e0" stroke-width="1"/>
        <text x="56" y="348.0" text-anchor="start" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">People</text>
        <path d="M 288 120 L 320 120" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#review-and-workflow-gates-light-arrow)"/>
        <path d="M 396 152 L 396 312" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#review-and-workflow-gates-light-arrow)"/>
        <path d="M 472 344 L 504 344" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#review-and-workflow-gates-light-arrow)"/>
        <path d="M 580 312 L 580 264" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#review-and-workflow-gates-light-arrow)"/>
        <rect x="136" y="88" width="152" height="64" rx="6" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <text x="212.0" y="116.0" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Push to one branch</text>
        <text x="212.0" y="132.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">copilot or PR branch</text>
        <rect x="320" y="88" width="152" height="64" rx="6" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <text x="396.0" y="116.0" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Open draft PR</text>
        <text x="396.0" y="132.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Validation tools run</text>
        <rect x="320" y="312" width="152" height="64" rx="6" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <text x="396.0" y="340.0" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Approve workflows</text>
        <text x="396.0" y="356.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Writer approves CI runs</text>
        <rect x="504" y="312" width="152" height="64" rx="6" fill="#eaf6ed" stroke="#1a7f37" stroke-width="1.5"/>
        <text x="580.0" y="340.0" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Review and approve</text>
        <text x="580.0" y="356.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Requester cannot approve</text>
        <rect x="504" y="200" width="152" height="64" rx="6" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <text x="580.0" y="228.0" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Merge gate</text>
        <text x="580.0" y="244.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Required count plus one</text>
        <text x="40" y="432" text-anchor="start" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">The extra approval for unattributed Copilot PRs is public preview and needs a nonzero count.</text>
        <text x="40" y="448" text-anchor="start" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Admins can disable workflow approval and validation tools; keep both on.</text>
        <line x1="40" y1="496" x2="664" y2="496" stroke="#d1d9e0"/>
        <text x="40" y="520" text-anchor="start" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="9" font-weight="400">Lanes: who acts; arrows: order of steps on one automation pull request</text>
        <text x="40" y="540" text-anchor="start" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="9" font-weight="400">Green box: lesson focus, not approval or a safety rating</text>
      </svg>
