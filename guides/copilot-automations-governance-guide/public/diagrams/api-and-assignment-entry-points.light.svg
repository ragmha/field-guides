        <title id="api-and-assignment-entry-points-light-title">Programmatic routes into agent work</title>
        <desc id="api-and-assignment-entry-points-light-desc">Four routes start unattended agent work. Each carries its own credential, acting identity and payer, so inventory all three per route.</desc>
