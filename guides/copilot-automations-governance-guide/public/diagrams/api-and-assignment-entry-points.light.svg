        <path d="M 272 328 L 272 376" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#api-and-assignment-entry-points-light-arrow)"/>
        <path d="M 592 328 L 592 376" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#api-and-assignment-entry-points-light-arrow)"/>
