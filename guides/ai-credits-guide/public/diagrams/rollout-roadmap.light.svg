<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="rollout-roadmap-light-title rollout-roadmap-light-desc">
  <title id="rollout-roadmap-light-title">Build the operating model before automation</title>
  <desc id="rollout-roadmap-light-desc">Start with ownership, enterprise controls and attribution. Adopt cost-center and per-user rules with guidance and responders. Advance through monthly review and automation of a proven process.</desc>
  <defs><marker id="rollout-roadmap-light-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M 0 0 L 8 3 L 0 6 Z" fill="#59636e"/></marker></defs>
  <style>
    svg { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #1f2328; }
    .paper { fill: #f3f5f7; }
    .node, .step-card { fill: #ffffff; stroke: #d1d9e0; stroke-width: 1.5; }
    .node.focus, .step-card.focus { fill: #eaf6ed; stroke: #1a7f37; stroke-width: 2; }
    .decision { fill: #ffffff; stroke: #1f2328; stroke-width: 1.5; }
    .hub { fill: #eaf6ed; stroke: #1a7f37; stroke-width: 1.5; }
    .step-number { fill: #f3f5f7; stroke: #d1d9e0; stroke-width: 1.5; }
    .step-number.focus { fill: #1a7f37; stroke: #1a7f37; }
    .eyebrow, .detail, .note { fill: #59636e; }
    .node-name, .number { fill: #1f2328; }
    .arrow { fill: none; stroke: #59636e; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#rollout-roadmap-light-arrow); }
    .spoke { fill: none; stroke: #59636e; stroke-width: 1; stroke-dasharray: 4 3; }
    .eyebrow { font-size: 8px; font-weight: 600; letter-spacing: .12em; }
    .node-name { font-size: 12px; font-weight: 600; }
    .detail { font-size: 9px; }
    .arrow-label { fill: #59636e; font-size: 8px; font-weight: 600; letter-spacing: .06em; }
    .label-mask { fill: #f3f5f7; }
    .number { font-size: 9px; font-weight: 600; }
    .note { font-size: 10px; }
  </style>
  <rect x="0" y="0" width="640" height="400" class="paper"/>
  <g><rect x="40" y="112" width="176" height="208" rx="6" class="step-card"/><circle cx="128" cy="146" r="18" class="step-number"/><text x="128" y="149" text-anchor="middle" class="number"><tspan>01</tspan></text><text x="128" y="186" text-anchor="middle" class="node-name"><tspan>Foundation</tspan></text><text x="128" y="214" text-anchor="middle" class="detail"><tspan>Name an owner</tspan><tspan x="128" dy="15">Set enterprise controls</tspan><tspan x="128" dy="15">Establish attribution</tspan></text></g><g><rect x="232" y="112" width="176" height="208" rx="6" class="step-card focus"/><circle cx="320" cy="146" r="18" class="step-number focus"/><text x="320" y="149" text-anchor="middle" class="number"><tspan>02</tspan></text><text x="320" y="186" text-anchor="middle" class="node-name"><tspan>Adoption</tspan></text><text x="320" y="214" text-anchor="middle" class="detail"><tspan>Add cost-center and</tspan><tspan x="320" dy="15">per-user rules</tspan><tspan x="320" dy="15">Guide users; name</tspan><tspan x="320" dy="15">response owners</tspan></text></g><g><rect x="424" y="112" width="176" height="208" rx="6" class="step-card"/><circle cx="512" cy="146" r="18" class="step-number"/><text x="512" y="149" text-anchor="middle" class="number"><tspan>03</tspan></text><text x="512" y="186" text-anchor="middle" class="node-name"><tspan>Improve</tspan></text><text x="512" y="214" text-anchor="middle" class="detail"><tspan>Review monthly</tspan><tspan x="512" dy="15">Automate only after</tspan><tspan x="512" dy="15">the process is proven</tspan></text></g>
</svg>
