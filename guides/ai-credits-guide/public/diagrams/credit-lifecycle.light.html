<!doctype html>
<html lang="en" data-theme="light">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Follow the credits, not the seats</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 24px; background: #f3f5f7; color: #1f2328; font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { max-width: 704px; margin: 0 auto; }
    .eyebrow { color: #59636e; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; }
    h1 { margin: 8px 0 20px; font-size: 24px; line-height: 1.2; }
    .diagram-container { overflow-x: auto; border: 1px solid #d1d9e0; border-radius: 6px; background: #f3f5f7; }
    .diagram-container:focus-visible { outline: 2px solid #1a7f37; outline-offset: 3px; }
    svg { display: block; width: 100%; min-width: 640px; height: auto; }
    figcaption { margin-top: 12px; color: #59636e; font-size: 12px; }
    nav { display: flex; gap: 16px; margin-top: 12px; }
    a { color: #0550ae; text-underline-offset: 3px; }
    @media print { body { padding: 0; } .diagram-container { overflow: visible; } svg { min-width: 0; } nav { display: none; } }

</head>
<body>
  <main>

    <h1>Follow the credits, not the seats</h1>

    .node, .step-card { fill: #ffffff; stroke: #d1d9e0; stroke-width: 1.5; }
    .node.focus, .step-card.focus { fill: #eaf6ed; stroke: #1a7f37; stroke-width: 2; }
    .decision { fill: #ffffff; stroke: #1f2328; stroke-width: 1.5; }
    .hub { fill: #eaf6ed; stroke: #1a7f37; stroke-width: 1.5; }
    .step-number { fill: #f3f5f7; stroke: #d1d9e0; stroke-width: 1.5; }
    .step-number.focus { fill: #1a7f37; stroke: #1a7f37; }
    .eyebrow, .detail, .note { fill: #59636e; }
    .node-name, .number { fill: #1f2328; }
    .arrow { fill: none; stroke: #59636e; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#credit-lifecycle-light-arrow); }
    .spoke { fill: none; stroke: #59636e; stroke-width: 1; stroke-dasharray: 4 3; }
    .eyebrow { font-size: 8px; font-weight: 600; letter-spacing: .12em; }
    .node-name { font-size: 12px; font-weight: 600; }
    .detail { font-size: 9px; }
    .arrow-label { fill: #59636e; font-size: 8px; font-weight: 600; letter-spacing: .06em; }
    .label-mask { fill: #f3f5f7; }
    .number { font-size: 9px; font-weight: 600; }
    .note { font-size: 10px; }

t x="154" y="362" text-anchor="middle" class="node-name"><tspan>Shared pool</tspan></text><text x="154" y="378" text-anchor="middle" class="detail"><tspan>Credits are pooled,</tspan><tspan x="154" dy="12">not user wallets</tspan></text></g><g><polygon points="481,300 576,352 481,404 386,352" class="decision"/><text x="481" y="345" text-anchor="middle" class="node-name"><tspan>Paid-use policy and</tspan><tspan x="481" dy="14">enforced budgets allow?</tspan></text></g><g><rect x="36" y="472" width="236" height="64" rx="6" class="node"/><text x="154" y="490" text-anchor="middle" class="eyebrow"><tspan>CONTINUE</tspan></text><text x="154" y="514" text-anchor="middle" class="node-name"><tspan>Credit use continues</tspan></text><text x="154" y="530" text-anchor="middle" class="detail"><tspan>Within included funding</tspan></text></g><g><rect x="304" y="472" width="160" height="64" rx="6" class="node"/><text x="384" y="490" text-anchor="middle" class="eyebrow"><tspan>YES</tspan></text><text x="384" y="514" text-anchor="middle" class="node-name"><tspan>Metered use</tspan></text><text x="384" y="530" text-anchor="middle" class="detail"><tspan>Paid usage allowed</tspan></text></g><g><rect x="492" y="472" width="124" height="64" rx="6" class="node"/><text x="554" y="490" text-anchor="middle" class="eyebrow"><tspan>NO</tspan></text><text x="554" y="514" text-anchor="middle" class="node-name"><tspan>Blocked</tspan></text><text x="554" y="530" text-anchor="middle" class="detail"><tspan>Policy denies spend</tspan></text></g>

      <figcaption>Business and Enterprise licenses fund a shared included pool. After it is exhausted, paid usage needs policy permission and available enforced headroom. Copilot access has no included pool.</figcaption>
