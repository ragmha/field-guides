<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 640 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="attribution-pipeline-dark-title attribution-pipeline-dark-desc">
  <title id="attribution-pipeline-dark-title">From usage to an accountable cost owner</title>
  <desc id="attribution-pipeline-dark-desc">Map the source usage report to owners, keep unmapped records visible and reconcile totals and periods. Start with showback; chargeback requires finance agreement.</desc>
  <defs><marker id="attribution-pipeline-dark-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M 0 0 L 8 3 L 0 6 Z" fill="#9198a1"/></marker></defs>
  <style>
    svg { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #f0f6fc; }
    .paper { fill: #07090d; }
    .node, .step-card { fill: #0d1117; stroke: #3d444d; stroke-width: 1.5; }
    .node.focus, .step-card.focus { fill: #0f2d19; stroke: #3fb950; stroke-width: 2; }
    .decision { fill: #0d1117; stroke: #f0f6fc; stroke-width: 1.5; }
    .hub { fill: #0f2d19; stroke: #3fb950; stroke-width: 1.5; }
    .step-number { fill: #07090d; stroke: #3d444d; stroke-width: 1.5; }
    .step-number.focus { fill: #3fb950; stroke: #3fb950; }
    .eyebrow, .detail, .note { fill: #9198a1; }
    .node-name, .number { fill: #f0f6fc; }
    .arrow { fill: none; stroke: #9198a1; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#attribution-pipeline-dark-arrow); }
    .spoke { fill: none; stroke: #9198a1; stroke-width: 1; stroke-dasharray: 4 3; }
    .eyebrow { font-size: 8px; font-weight: 600; letter-spacing: .12em; }
    .node-name { font-size: 12px; font-weight: 600; }
    .detail { font-size: 9px; }
    .arrow-label { fill: #9198a1; font-size: 8px; font-weight: 600; letter-spacing: .06em; }
    .label-mask { fill: #07090d; }
    .number { font-size: 9px; font-weight: 600; }
    .note { font-size: 10px; }
  </style>
  <rect x="0" y="0" width="640" height="440" class="paper"/>
  <g><rect x="24" y="112" width="112" height="216" rx="6" class="step-card"/><circle cx="80" cy="146" r="18" class="step-number"/><text x="80" y="149" text-anchor="middle" class="number"><tspan>01</tspan></text><text x="80" y="186" text-anchor="middle" class="node-name"><tspan>Export</tspan></text><text x="80" y="214" text-anchor="middle" class="detail"><tspan>AI usage</tspan><tspan x="80" dy="15">report</tspan></text></g><g><rect x="148" y="112" width="112" height="216" rx="6" class="step-card"/><circle cx="204" cy="146" r="18" class="step-number"/><text x="204" y="149" text-anchor="middle" class="number"><tspan>02</tspan></text><text x="204" y="186" text-anchor="middle" class="node-name"><tspan>Map</tspan></text><text x="204" y="214" text-anchor="middle" class="detail"><tspan>User → cost</tspan><tspan x="204" dy="15">owner</tspan><tspan x="204" dy="15">Keep UNMAPPED</tspan></text></g><g><rect x="272" y="112" width="112" height="216" rx="6" class="step-card focus"/><circle cx="328" cy="146" r="18" class="step-number focus"/><text x="328" y="149" text-anchor="middle" class="number"><tspan>03</tspan></text><text x="328" y="186" text-anchor="middle" class="node-name"><tspan>Reconcile</tspan></text><text x="328" y="214" text-anchor="middle" class="detail"><tspan>Align totals</tspan><tspan x="328" dy="15">and period</tspan></text></g><g><rect x="396" y="112" width="112" height="216" rx="6" class="step-card"/><circle cx="452" cy="146" r="18" class="step-number"/><text x="452" y="149" text-anchor="middle" class="number"><tspan>04</tspan></text><text x="452" y="186" text-anchor="middle" class="node-name"><tspan>Showback</tspan></text><text x="452" y="214" text-anchor="middle" class="detail"><tspan>Make usage</tspan><tspan x="452" dy="15">visible</tspan></text></g><g><rect x="520" y="112" width="96" height="216" rx="6" class="step-card"/><circle cx="568" cy="146" r="18" class="step-number"/><text x="568" y="149" text-anchor="middle" class="number"><tspan>05</tspan></text><text x="568" y="186" text-anchor="middle" class="node-name"><tspan>Chargeback</tspan></text><text x="568" y="214" text-anchor="middle" class="detail"><tspan>Only with</tspan><tspan x="568" dy="15">finance</tspan><tspan x="568" dy="15">agreement</tspan></text></g>
</svg>
