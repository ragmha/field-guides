<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 640 540" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cap-or-continuity-dark-title cap-or-continuity-dark-desc">
  <title id="cap-or-continuity-dark-title">Same threshold, different operational outcome</title>
  <desc id="cap-or-continuity-dark-desc">A metered hard stop blocks credit-consuming work at its limit. An alert-only threshold keeps work and charges running while an owner responds. ULBs remain hard stops in either design.</desc>
  <defs><marker id="cap-or-continuity-dark-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M 0 0 L 8 3 L 0 6 Z" fill="#9198a1"/></marker></defs>
  <style>
    svg { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #f0f6fc; }
    .paper { fill: #07090d; }
    .node, .step-card { fill: #0d1117; stroke: #3d444d; stroke-width: 1.5; }
    .node.focus, .step-card.focus { fill: #0f2d19; stroke: #3fb950; stroke-width: 2; }
    .decision { fill: #0d1117; stroke: #f0f6fc; stroke-width: 1.5; }
    .hub { fill: #0f2d19; stroke: #3fb950; stroke-width: 1.5; }
    .step-number { fill: #07090d; stroke: #3d444d; stroke-width: 1.5; }
    .step-number.focus { fill: #3fb950; stroke: #3fb950; }
    .eyebrow, .detail, .note { fill: #9198a1; }
    .node-name, .number { fill: #f0f6fc; }
    .arrow { fill: none; stroke: #9198a1; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#cap-or-continuity-dark-arrow); }
    .spoke { fill: none; stroke: #9198a1; stroke-width: 1; stroke-dasharray: 4 3; }
    .eyebrow { font-size: 8px; font-weight: 600; letter-spacing: .12em; }
    .node-name { font-size: 12px; font-weight: 600; }
    .detail { font-size: 9px; }
    .arrow-label { fill: #9198a1; font-size: 8px; font-weight: 600; letter-spacing: .06em; }
    .label-mask { fill: #07090d; }
    .number { font-size: 9px; font-weight: 600; }
    .note { font-size: 10px; }
  </style>
  <rect x="0" y="0" width="640" height="540" class="paper"/>
  <path d="M 240 112 L 240 140 Q 240 148 232 148 L 168 148 Q 160 148 160 156 L 160 184" class="arrow" marker-end="url(#cap-or-continuity-dark-arrow)"/><path d="M 400 112 L 400 140 Q 400 148 408 148 L 472 148 Q 480 148 480 156 L 480 184" class="arrow" marker-end="url(#cap-or-continuity-dark-arrow)"/><path d="M 160 256 L 160 328" class="arrow" marker-end="url(#cap-or-continuity-dark-arrow)"/><path d="M 480 256 L 480 328" class="arrow" marker-end="url(#cap-or-continuity-dark-arrow)"/><g><rect x="180" y="40" width="280" height="72" rx="6" class="node"/><text x="320" y="58" text-anchor="middle" class="eyebrow"><tspan>THRESHOLD</tspan></text><text x="320" y="82" text-anchor="middle" class="node-name"><tspan>Same metered limit</tspan></text><text x="320" y="98" text-anchor="middle" class="detail"><tspan>Reached in either configuration</tspan></text></g><g><rect x="40" y="184" width="240" height="72" rx="6" class="node focus"/><text x="160" y="202" text-anchor="middle" class="eyebrow"><tspan>CONFIGURATION A</tspan></text><text x="160" y="226" text-anchor="middle" class="node-name"><tspan>Hard stop ON</tspan></text><text x="160" y="242" text-anchor="middle" class="detail"><tspan>Metered limit enforced</tspan></text></g><g><rect x="360" y="184" width="240" height="72" rx="6" class="node"/><text x="480" y="202" text-anchor="middle" class="eyebrow"><tspan>CONFIGURATION B</tspan></text><text x="480" y="226" text-anchor="middle" class="node-name"><tspan>Hard stop OFF</tspan></text><text x="480" y="242" text-anchor="middle" class="detail"><tspan>Alert-only threshold</tspan></text></g><g><rect x="40" y="328" width="240" height="88" rx="6" class="node"/><text x="160" y="346" text-anchor="middle" class="eyebrow"><tspan>OUTCOME</tspan></text><text x="160" y="370" text-anchor="middle" class="node-name"><tspan>Work is blocked</tspan></text><text x="160" y="386" text-anchor="middle" class="detail"><tspan>Credit-consuming activity</tspan><tspan x="160" dy="12">stops at the limit</tspan></text></g><g><rect x="360" y="328" width="240" height="88" rx="6" class="node"/><text x="480" y="346" text-anchor="middle" class="eyebrow"><tspan>OUTCOME</tspan></text><text x="480" y="370" text-anchor="middle" class="node-name"><tspan>Owner chooses response</tspan></text><text x="480" y="386" text-anchor="middle" class="detail"><tspan>Charges continue while</tspan><tspan x="480" dy="12">the owner investigates</tspan></text></g><g><rect x="72" y="464" width="496" height="52" rx="6" class="node"/><text x="320" y="482" text-anchor="middle" class="eyebrow"><tspan>ALWAYS</tspan></text><text x="320" y="506" text-anchor="middle" class="node-name"><tspan>ULB remains a hard stop in both</tspan></text><text x="320" y="522" text-anchor="middle" class="detail"><tspan>Forecast ≠ cap ≠ purchase approval</tspan></text></g>
</svg>
