<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 640 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="agent-meters-light-title agent-meters-light-desc">
  <title id="agent-meters-light-title">One agent workload, two meters</title>
  <desc id="agent-meters-light-desc">Copilot code review consumes model/token AI credits and Actions runner minutes separately. Plan and monitor both; an AI-credit budget does not cap Actions spending.</desc>
  <defs><marker id="agent-meters-light-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M 0 0 L 8 3 L 0 6 Z" fill="#59636e"/></marker></defs>
  <style>
    svg { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #1f2328; }
    .paper { fill: #f3f5f7; }
    .node, .step-card { fill: #ffffff; stroke: #d1d9e0; stroke-width: 1.5; }
    .node.focus, .step-card.focus { fill: #eaf6ed; stroke: #1a7f37; stroke-width: 2; }
    .decision { fill: #ffffff; stroke: #1f2328; stroke-width: 1.5; }
    .hub { fill: #eaf6ed; stroke: #1a7f37; stroke-width: 1.5; }
    .step-number { fill: #f3f5f7; stroke: #d1d9e0; stroke-width: 1.5; }
    .step-number.focus { fill: #1a7f37; stroke: #1a7f37; }
    .eyebrow, .detail, .note { fill: #59636e; }
    .node-name, .number { fill: #1f2328; }
    .arrow { fill: none; stroke: #59636e; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#agent-meters-light-arrow); }
    .spoke { fill: none; stroke: #59636e; stroke-width: 1; stroke-dasharray: 4 3; }
    .eyebrow { font-size: 8px; font-weight: 600; letter-spacing: .12em; }
    .node-name { font-size: 12px; font-weight: 600; }
    .detail { font-size: 9px; }
    .arrow-label { fill: #59636e; font-size: 8px; font-weight: 600; letter-spacing: .06em; }
    .label-mask { fill: #f3f5f7; }
    .number { font-size: 9px; font-weight: 600; }
    .note { font-size: 10px; }
  </style>
  <rect x="0" y="0" width="640" height="520" class="paper"/>
  <path d="M 240 112 L 240 152 Q 240 160 232 160 L 168 160 Q 160 160 160 168 L 160 216" class="arrow" marker-end="url(#agent-meters-light-arrow)"/><path d="M 400 112 L 400 152 Q 400 160 408 160 L 472 160 Q 480 160 480 168 L 480 216" class="arrow" marker-end="url(#agent-meters-light-arrow)"/><path d="M 160 312 L 160 336 Q 160 344 168 344 L 252 344 Q 260 344 260 352 L 260 392" class="arrow" marker-end="url(#agent-meters-light-arrow)"/><path d="M 480 312 L 480 352 Q 480 360 472 360 L 388 360 Q 380 360 380 368 L 380 392" class="arrow" marker-end="url(#agent-meters-light-arrow)"/><g><rect x="200" y="40" width="240" height="72" rx="6" class="node"/><text x="320" y="58" text-anchor="middle" class="eyebrow"><tspan>WORKLOAD</tspan></text><text x="320" y="82" text-anchor="middle" class="node-name"><tspan>Copilot code review</tspan></text><text x="320" y="98" text-anchor="middle" class="detail"><tspan>One agent workload</tspan></text></g><g><rect x="40" y="216" width="240" height="96" rx="6" class="node focus"/><text x="160" y="234" text-anchor="middle" class="eyebrow"><tspan>METER 1</tspan></text><text x="160" y="258" text-anchor="middle" class="node-name"><tspan>AI credits</tspan></text><text x="160" y="274" text-anchor="middle" class="detail"><tspan>Model + token usage</tspan></text></g><g><rect x="360" y="216" width="240" height="96" rx="6" class="node"/><text x="480" y="234" text-anchor="middle" class="eyebrow"><tspan>METER 2</tspan></text><text x="480" y="258" text-anchor="middle" class="node-name"><tspan>Actions</tspan></text><text x="480" y="274" text-anchor="middle" class="detail"><tspan>Runner minutes</tspan></text></g><g><rect x="184" y="392" width="272" height="72" rx="6" class="node"/><text x="320" y="410" text-anchor="middle" class="eyebrow"><tspan>FINANCE VIEW</tspan></text><text x="320" y="434" text-anchor="middle" class="node-name"><tspan>Include both meters</tspan></text><text x="320" y="450" text-anchor="middle" class="detail"><tspan>Different usage and spend</tspan></text></g>
</svg>
