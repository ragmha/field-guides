<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 640 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="credit-lifecycle-dark-title credit-lifecycle-dark-desc">
  <title id="credit-lifecycle-dark-title">Follow the credits, not the seats</title>
  <desc id="credit-lifecycle-dark-desc">Business and Enterprise licenses fund a shared included pool. After it is exhausted, paid usage needs policy permission and available enforced headroom. Copilot access has no included pool.</desc>
  <defs><marker id="credit-lifecycle-dark-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M 0 0 L 8 3 L 0 6 Z" fill="#9198a1"/></marker></defs>
  <style>
    svg { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #f0f6fc; }
    .paper { fill: #07090d; }
    .node, .step-card { fill: #0d1117; stroke: #3d444d; stroke-width: 1.5; }
    .node.focus, .step-card.focus { fill: #0f2d19; stroke: #3fb950; stroke-width: 2; }
    .decision { fill: #0d1117; stroke: #f0f6fc; stroke-width: 1.5; }
    .hub { fill: #0f2d19; stroke: #3fb950; stroke-width: 1.5; }
    .step-number { fill: #07090d; stroke: #3d444d; stroke-width: 1.5; }
    .step-number.focus { fill: #3fb950; stroke: #3fb950; }
    .eyebrow, .detail, .note { fill: #9198a1; }
    .node-name, .number { fill: #f0f6fc; }
    .arrow { fill: none; stroke: #9198a1; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#credit-lifecycle-dark-arrow); }
    .spoke { fill: none; stroke: #9198a1; stroke-width: 1; stroke-dasharray: 4 3; }
    .eyebrow { font-size: 8px; font-weight: 600; letter-spacing: .12em; }
    .node-name { font-size: 12px; font-weight: 600; }
    .detail { font-size: 9px; }
    .arrow-label { fill: #9198a1; font-size: 8px; font-weight: 600; letter-spacing: .06em; }
    .label-mask { fill: #07090d; }
    .number { font-size: 9px; font-weight: 600; }
    .note { font-size: 10px; }
  </style>
  <rect x="0" y="0" width="640" height="560" class="paper"/>
  <path d="M 320 100 L 320 144" class="arrow" marker-end="url(#credit-lifecycle-dark-arrow)"/><path d="M 216 196 L 164 196 Q 156 196 156 204 L 156 320" class="arrow" marker-end="url(#credit-lifecycle-dark-arrow)"/><rect x="161" y="237" width="30" height="16" rx="2" class="label-mask"/><text x="176" y="248" text-anchor="middle" class="arrow-label">YES</text><path d="M 424 196 L 473 196 Q 481 196 481 204 L 481 300" class="arrow" marker-end="url(#credit-lifecycle-dark-arrow)"/><rect x="439" y="237" width="24" height="16" rx="2" class="label-mask"/><text x="451" y="248" text-anchor="middle" class="arrow-label">NO</text><path d="M 154 408 L 154 472" class="arrow" marker-end="url(#credit-lifecycle-dark-arrow)"/><path d="M 386 352 L 360 352 Q 352 352 352 360 L 352 472" class="arrow" marker-end="url(#credit-lifecycle-dark-arrow)"/><rect x="337" y="410" width="30" height="16" rx="2" class="label-mask"/><text x="352" y="421" text-anchor="middle" class="arrow-label">YES</text><path d="M 576 352 L 580 352 Q 584 352 584 356 L 584 472" class="arrow" marker-end="url(#credit-lifecycle-dark-arrow)"/><rect x="572" y="410" width="24" height="16" rx="2" class="label-mask"/><text x="584" y="421" text-anchor="middle" class="arrow-label">NO</text><g><rect x="180" y="32" width="280" height="68" rx="6" class="node"/><text x="320" y="50" text-anchor="middle" class="eyebrow"><tspan>FUNDING</tspan></text><text x="320" y="74" text-anchor="middle" class="node-name"><tspan>Business or Enterprise</tspan></text><text x="320" y="90" text-anchor="middle" class="detail"><tspan>Shared included-credit pool</tspan></text></g><g><polygon points="320,144 424,196 320,248 216,196" class="decision"/><text x="320" y="189" text-anchor="middle" class="node-name"><tspan>Included credits</tspan><tspan x="320" dy="14">remain?</tspan></text></g><g><rect x="36" y="320" width="236" height="88" rx="6" class="node focus"/><text x="154" y="338" text-anchor="middle" class="eyebrow"><tspan>INCLUDED</tspan></text><text x="154" y="362" text-anchor="middle" class="node-name"><tspan>Shared pool</tspan></text><text x="154" y="378" text-anchor="middle" class="detail"><tspan>Credits are pooled,</tspan><tspan x="154" dy="12">not user wallets</tspan></text></g><g><polygon points="481,300 576,352 481,404 386,352" class="decision"/><text x="481" y="345" text-anchor="middle" class="node-name"><tspan>Paid-use policy and</tspan><tspan x="481" dy="14">enforced budgets allow?</tspan></text></g><g><rect x="36" y="472" width="236" height="64" rx="6" class="node"/><text x="154" y="490" text-anchor="middle" class="eyebrow"><tspan>CONTINUE</tspan></text><text x="154" y="514" text-anchor="middle" class="node-name"><tspan>Credit use continues</tspan></text><text x="154" y="530" text-anchor="middle" class="detail"><tspan>Within included funding</tspan></text></g><g><rect x="304" y="472" width="160" height="64" rx="6" class="node"/><text x="384" y="490" text-anchor="middle" class="eyebrow"><tspan>YES</tspan></text><text x="384" y="514" text-anchor="middle" class="node-name"><tspan>Metered use</tspan></text><text x="384" y="530" text-anchor="middle" class="detail"><tspan>Paid usage allowed</tspan></text></g><g><rect x="492" y="472" width="124" height="64" rx="6" class="node"/><text x="554" y="490" text-anchor="middle" class="eyebrow"><tspan>NO</tspan></text><text x="554" y="514" text-anchor="middle" class="node-name"><tspan>Blocked</tspan></text><text x="554" y="530" text-anchor="middle" class="detail"><tspan>Policy denies spend</tspan></text></g>
</svg>
