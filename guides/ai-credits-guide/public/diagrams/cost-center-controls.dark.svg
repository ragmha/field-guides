<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 640 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cost-center-controls-dark-title cost-center-controls-dark-desc">
  <title id="cost-center-controls-dark-title">One shared pool, two different team controls</title>
  <desc id="cost-center-controls-dark-desc">A cost-center included-usage control limits its draw on the shared pool. A cost-center metered budget limits additional charges. Neither is a private wallet or a transfer between teams.</desc>
  <defs><marker id="cost-center-controls-dark-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M 0 0 L 8 3 L 0 6 Z" fill="#9198a1"/></marker></defs>
  <style>
    svg { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #f0f6fc; }
    .paper { fill: #07090d; }
    .node, .step-card { fill: #0d1117; stroke: #3d444d; stroke-width: 1.5; }
    .node.focus, .step-card.focus { fill: #0f2d19; stroke: #3fb950; stroke-width: 2; }
    .decision { fill: #0d1117; stroke: #f0f6fc; stroke-width: 1.5; }
    .hub { fill: #0f2d19; stroke: #3fb950; stroke-width: 1.5; }
    .step-number { fill: #07090d; stroke: #3d444d; stroke-width: 1.5; }
    .step-number.focus { fill: #3fb950; stroke: #3fb950; }
    .eyebrow, .detail, .note { fill: #9198a1; }
    .node-name, .number { fill: #f0f6fc; }
    .arrow { fill: none; stroke: #9198a1; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#cost-center-controls-dark-arrow); }
    .spoke { fill: none; stroke: #9198a1; stroke-width: 1; stroke-dasharray: 4 3; }
    .eyebrow { font-size: 8px; font-weight: 600; letter-spacing: .12em; }
    .node-name { font-size: 12px; font-weight: 600; }
    .detail { font-size: 9px; }
    .arrow-label { fill: #9198a1; font-size: 8px; font-weight: 600; letter-spacing: .06em; }
    .label-mask { fill: #07090d; }
    .number { font-size: 9px; font-weight: 600; }
    .note { font-size: 10px; }
  </style>
  <rect x="0" y="0" width="640" height="520" class="paper"/>
  <path d="M 320 112 L 320 192" class="arrow" marker-end="url(#cost-center-controls-dark-arrow)"/><path d="M 264 264 L 264 312 Q 264 320 256 320 L 172 320 Q 164 320 164 328 L 164 360" class="arrow" marker-end="url(#cost-center-controls-dark-arrow)"/><path d="M 376 264 L 376 312 Q 376 320 384 320 L 468 320 Q 476 320 476 328 L 476 360" class="arrow" marker-end="url(#cost-center-controls-dark-arrow)"/><g><rect x="208" y="40" width="224" height="72" rx="6" class="node focus"/><text x="320" y="58" text-anchor="middle" class="eyebrow"><tspan>SHARED FUNDING</tspan></text><text x="320" y="82" text-anchor="middle" class="node-name"><tspan>Included pool</tspan></text><text x="320" y="98" text-anchor="middle" class="detail"><tspan>Across cost centers</tspan></text></g><g><rect x="208" y="192" width="224" height="72" rx="6" class="node"/><text x="320" y="210" text-anchor="middle" class="eyebrow"><tspan>SCOPE</tspan></text><text x="320" y="234" text-anchor="middle" class="node-name"><tspan>Cost centers A + B</tspan></text><text x="320" y="250" text-anchor="middle" class="detail"><tspan>Draw from the same pool</tspan></text></g><g><rect x="40" y="360" width="248" height="112" rx="6" class="node"/><text x="164" y="378" text-anchor="middle" class="eyebrow"><tspan>INCLUDED-USAGE CONTROL</tspan></text><text x="164" y="402" text-anchor="middle" class="node-name"><tspan>Limits pool draw</tspan></text><text x="164" y="418" text-anchor="middle" class="detail"><tspan>Cap based on member licenses</tspan><tspan x="164" dy="12">May block or allow paid use</tspan><tspan x="164" dy="12">according to policy</tspan></text></g><g><rect x="352" y="360" width="248" height="112" rx="6" class="node"/><text x="476" y="378" text-anchor="middle" class="eyebrow"><tspan>METERED BUDGET</tspan></text><text x="476" y="402" text-anchor="middle" class="node-name"><tspan>Limits added charges</tspan></text><text x="476" y="418" text-anchor="middle" class="detail"><tspan>Applies to paid overage</tspan><tspan x="476" dy="12">Not a reserved credit</tspan><tspan x="476" dy="12">allocation</tspan></text></g>
</svg>
