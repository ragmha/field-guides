  <title>Same threshold, different operational outcome</title>
  <style>

n></text></g><g><rect x="360" y="328" width="240" height="88" rx="6" class="node"/><text x="480" y="346" text-anchor="middle" class="eyebrow"><tspan>OUTCOME</tspan></text><text x="480" y="370" text-anchor="middle" class="node-name"><tspan>Owner chooses response</tspan></text><text x="480" y="386" text-anchor="middle" class="detail"><tspan>Charges continue while</tspan><tspan x="480" dy="12">the owner investigates</tspan></text></g><g><rect x="72" y="464" width="496" height="52" rx="6" class="node"/><text x="320" y="482" text-anchor="middle" class="eyebrow"><tspan>ALWAYS</tspan></text><text x="320" y="506" text-anchor="middle" class="node-name"><tspan>ULB remains a hard stop in both</tspan></text><text x="320" y="522" text-anchor="middle" class="detail"><tspan>Forecast ≠ cap ≠ purchase approval</tspan></text></g>
