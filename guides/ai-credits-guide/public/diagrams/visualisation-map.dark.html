<!doctype html>

  <title>Choose a view by the question</title>
  <style>

    .diagram-container { overflow-x: auto; border: 1px solid #3d444d; border-radius: 6px; background: #07090d; }
    .diagram-container:focus-visible { outline: 2px solid #3fb950; outline-offset: 3px; }
    svg { display: block; width: 100%; min-width: 640px; height: auto; }
    figcaption { margin-top: 12px; color: #9198a1; font-size: 12px; }
    nav { display: flex; gap: 16px; margin-top: 12px; }
    a { color: #4493f8; text-underline-offset: 3px; }
    @media print { body { padding: 0; } .diagram-container { overflow: visible; } svg { min-width: 0; } nav { display: none; } }
