<svg viewBox="0 0 686 148" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="secret-response-title secret-response-desc">
<title id="secret-response-title">A leaked secret is closed by rotation</title><desc id="secret-response-desc">Revoke or rotate the credential, update dependent systems, investigate use, then close the alert with an accurate reason. Deleting the string from code does not close the alert or the risk.</desc>
<defs><marker id="secret-response-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#59636e" class="muted"/></marker></defs>
<rect width="686" height="148" fill="#fff" class="paper"/>
<g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
<rect x="24" y="32" width="140" height="64" rx="6" class="focal" fill="#eaf6ed" stroke="#1a7f37"/>
<text x="94.0" y="60.0" text-anchor="middle" font-size="12" class="ink" font-weight="600" fill="#1f2328">Revoke</text>
<text x="94.0" y="78.0" text-anchor="middle" font-size="11" class="muted" fill="#59636e">rotate with provider</text>
<line x1="164" y1="64.0" x2="188" y2="64.0" class="arrow" stroke="#59636e" stroke-width="1.5" marker-end="url(#secret-response-arrow)"/>
<rect x="190" y="32" width="140" height="64" rx="6" class="node" fill="#fff" stroke="#1f2328"/>
<text x="260.0" y="60.0" text-anchor="middle" font-size="12" class="ink" font-weight="600" fill="#1f2328">Update</text>
<text x="260.0" y="78.0" text-anchor="middle" font-size="11" class="muted" fill="#59636e">dependent systems</text>
<line x1="330" y1="64.0" x2="354" y2="64.0" class="arrow" stroke="#59636e" stroke-width="1.5" marker-end="url(#secret-response-arrow)"/>
<rect x="356" y="32" width="140" height="64" rx="6" class="node" fill="#fff" stroke="#1f2328"/>
<text x="426.0" y="60.0" text-anchor="middle" font-size="12" class="ink" font-weight="600" fill="#1f2328">Investigate</text>
<text x="426.0" y="78.0" text-anchor="middle" font-size="11" class="muted" fill="#59636e">use of old secret</text>
<line x1="496" y1="64.0" x2="520" y2="64.0" class="arrow" stroke="#59636e" stroke-width="1.5" marker-end="url(#secret-response-arrow)"/>
<rect x="522" y="32" width="140" height="64" rx="6" class="node" fill="#fff" stroke="#1f2328"/>
<text x="592.0" y="60.0" text-anchor="middle" font-size="12" class="ink" font-weight="600" fill="#1f2328">Close alert</text>
<text x="592.0" y="78.0" text-anchor="middle" font-size="11" class="muted" fill="#59636e">accurate reason</text>
<text x="343" y="128" text-anchor="middle" font-size="11" class="muted" fill="#59636e">Deleting the string from code is clean-up, not the fix</text>
</g></svg>
