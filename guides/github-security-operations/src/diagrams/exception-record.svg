<svg viewBox="0 0 640 208" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="exception-record-title exception-record-desc">
<title id="exception-record-title">An exception is a recorded decision</title><desc id="exception-record-desc">A requester proposes, a delegated approver decides, the record captures scope, compensating controls and evidence, and an expiry forces review.</desc>
<defs><marker id="exception-record-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#59636e" class="muted"/></marker></defs>
<rect width="640" height="208" fill="#fff" class="paper"/>
<g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
<rect x="40" y="28" width="240" height="56" rx="6" class="node" fill="#fff" stroke="#1f2328"/>
<text x="160.0" y="52.0" text-anchor="middle" font-size="12" class="ink" font-weight="600" fill="#1f2328">Proposal</text>
<text x="160.0" y="70.0" text-anchor="middle" font-size="11" class="muted" fill="#59636e">requester explains why</text>
<line x1="280" y1="56" x2="356" y2="56" class="arrow" stroke="#59636e" stroke-width="1.5" marker-end="url(#exception-record-arrow)"/>
<rect x="360" y="28" width="240" height="56" rx="6" class="focal" fill="#eaf6ed" stroke="#1a7f37"/>
<text x="480.0" y="52.0" text-anchor="middle" font-size="12" class="ink" font-weight="600" fill="#1f2328">Approval</text>
<text x="480.0" y="70.0" text-anchor="middle" font-size="11" class="muted" fill="#59636e">delegated risk approver</text>
<line x1="480" y1="84" x2="480" y2="120" class="arrow" stroke="#59636e" stroke-width="1.5" marker-end="url(#exception-record-arrow)"/>
<rect x="360" y="124" width="240" height="56" rx="6" class="warn" fill="#fff8c5" stroke="#854d0e"/>
<text x="480.0" y="148.0" text-anchor="middle" font-size="12" class="ink" font-weight="600" fill="#1f2328">Expiry</text>
<text x="480.0" y="166.0" text-anchor="middle" font-size="11" class="muted" fill="#59636e">review or remediate by date</text>
<rect x="40" y="124" width="240" height="56" rx="6" class="node" fill="#fff" stroke="#1f2328"/>
<text x="160.0" y="148.0" text-anchor="middle" font-size="12" class="ink" font-weight="600" fill="#1f2328">Record</text>
<text x="160.0" y="166.0" text-anchor="middle" font-size="11" class="muted" fill="#59636e">scope · controls · evidence</text>
<line x1="360" y1="152" x2="284" y2="152" class="arrow" stroke="#59636e" stroke-width="1.5" marker-end="url(#exception-record-arrow)"/>

</g></svg>
