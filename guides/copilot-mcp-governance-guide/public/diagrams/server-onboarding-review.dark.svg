<?xml version="1.0" encoding="UTF-8"?>
<svg id="server-onboarding-review-dark-root" viewBox="0 0 704 580" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="server-onboarding-review-dark-title server-onboarding-review-dark-desc">
        <title id="server-onboarding-review-dark-title">Onboard an MCP server</title>
        <desc id="server-onboarding-review-dark-desc">Review the server, allowlist it, validate settings, provision scoped secrets, configure explicit tools, confirm in a session log, then monitor and recheck.</desc>
        <defs><marker id="server-onboarding-review-dark-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#9198a1"/></marker></defs>
        <rect x="0" y="0" width="704" height="580" fill="#07090d"/>
        <path d="M 216 80 L 264 80" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#server-onboarding-review-dark-arrow)"/>
        <path d="M 440 80 L 488 80" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#server-onboarding-review-dark-arrow)"/>
        <path d="M 576 120 L 576 184" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#server-onboarding-review-dark-arrow)"/>
        <path d="M 488 224 L 440 224" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#server-onboarding-review-dark-arrow)"/>
        <path d="M 264 224 L 216 224" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#server-onboarding-review-dark-arrow)"/>
        <path d="M 128 264 L 128 368 L 264 368" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#server-onboarding-review-dark-arrow)"/>
        <rect x="40" y="40" width="176" height="80" rx="6" fill="#102219" stroke="#3fb950" stroke-width="1.5"/>
        <text x="128" y="76" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Review server</text>
        <text x="128" y="92" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Tools, auth, data access</text>
        <rect x="264" y="40" width="176" height="80" rx="6" fill="#0d1117" stroke="#9198a1" stroke-width="1.5"/>
        <text x="352" y="76" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Allowlist</text>
        <text x="352" y="92" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">serverUrl or serverCommand</text>
        <rect x="488" y="40" width="176" height="80" rx="6" fill="#0d1117" stroke="#9198a1" stroke-width="1.5"/>
        <text x="576" y="76" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Validate settings</text>
        <text x="576" y="92" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Settings validation</text>
        <rect x="488" y="184" width="176" height="80" rx="6" fill="#0d1117" stroke="#9198a1" stroke-width="1.5"/>
        <text x="576" y="220" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Provision secrets</text>
        <text x="576" y="236" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Scoped COPILOT_MCP_</text>
        <rect x="264" y="184" width="176" height="80" rx="6" fill="#0d1117" stroke="#9198a1" stroke-width="1.5"/>
        <text x="352" y="220" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Configure tools</text>
        <text x="352" y="236" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Explicit read-only list</text>
        <rect x="40" y="184" width="176" height="80" rx="6" fill="#0d1117" stroke="#9198a1" stroke-width="1.5"/>
        <text x="128" y="220" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Confirm in log</text>
        <text x="128" y="236" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Only expected tools load</text>
        <rect x="264" y="328" width="176" height="80" rx="20" fill="#0d1117" stroke="#9198a1" stroke-width="1.5"/>
        <text x="352" y="364" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Monitor and recheck</text>
        <text x="352" y="380" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Owner on a cadence</text>
        <text x="40" y="464" text-anchor="start" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Recheck when the vendor, tool list, owner or credential changes.</text>
        <text x="40" y="480" text-anchor="start" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Order is guide advice: controls exist before access is granted.</text>
        <line x1="40" y1="520" x2="664" y2="520" stroke="#3d444d"/>
        <text x="40" y="544" text-anchor="start" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="9" font-weight="400">Boxes: lifecycle stages in order; arrow: next stage</text>
        <text x="40" y="564" text-anchor="start" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="9" font-weight="400">Green: lesson focus, not approval or a safety rating</text>
      </svg>
