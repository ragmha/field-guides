<?xml version="1.0" encoding="UTF-8"?>
<svg id="mcp-secret-scoping-dark-root" viewBox="0 0 704 652" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="mcp-secret-scoping-dark-title mcp-secret-scoping-dark-desc">
        <title id="mcp-secret-scoping-dark-title">How a secret reaches an MCP server</title>
        <desc id="mcp-secret-scoping-dark-desc">Organization and repository Agents secrets with the COPILOT_MCP_ prefix flow only to MCP servers, are referenced in env or headers, and are masked in session logs.</desc>
        <defs><marker id="mcp-secret-scoping-dark-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#9198a1"/></marker></defs>
        <rect x="0" y="0" width="704" height="652" fill="#07090d"/>
        <path d="M 352 104 L 352 136" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#mcp-secret-scoping-dark-arrow)"/>
        <path d="M 352 200 L 352 232" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#mcp-secret-scoping-dark-arrow)"/>
        <path d="M 352 296 L 352 328" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#mcp-secret-scoping-dark-arrow)"/>
        <path d="M 352 392 L 352 424" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#mcp-secret-scoping-dark-arrow)"/>
        <rect x="136" y="40" width="432" height="64" rx="6" fill="#0d1117" stroke="#9198a1" stroke-width="1.5"/>
        <text x="352" y="68" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Organization Agents secret</text>
        <text x="352" y="84" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Owner chooses all, private or selected repos</text>
        <rect x="136" y="136" width="432" height="64" rx="6" fill="#0d1117" stroke="#9198a1" stroke-width="1.5"/>
        <text x="352" y="164" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Repository Agents secret</text>
        <text x="352" y="180" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Overrides an organization secret with the same name</text>
        <rect x="136" y="232" width="432" height="64" rx="6" fill="#102219" stroke="#3fb950" stroke-width="1.5"/>
        <text x="352" y="260" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">COPILOT_MCP_ prefix</text>
        <text x="352" y="276" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Only MCP servers receive these values</text>
        <rect x="136" y="328" width="432" height="64" rx="6" fill="#0d1117" stroke="#9198a1" stroke-width="1.5"/>
        <text x="352" y="356" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">MCP server env or headers</text>
        <text x="352" y="372" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Referenced as $COPILOT_MCP_NAME</text>
        <rect x="136" y="424" width="432" height="64" rx="6" fill="#0d1117" stroke="#9198a1" stroke-width="1.5"/>
        <text x="352" y="452" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Session log</text>
        <text x="352" y="468" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Secret values are masked</text>
        <text x="40" y="536" text-anchor="start" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Cloud sandboxes receive secrets, not variables.</text>
        <text x="40" y="552" text-anchor="start" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Actions, Codespaces and Dependabot secrets are not passed to the agent.</text>
        <line x1="40" y1="592" x2="664" y2="592" stroke="#3d444d"/>
        <text x="40" y="616" text-anchor="start" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="9" font-weight="400">Layer: where the value is stored or used; arrow: direction of flow</text>
        <text x="40" y="636" text-anchor="start" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="9" font-weight="400">Green: lesson focus, not approval or a safety rating</text>
      </svg>
