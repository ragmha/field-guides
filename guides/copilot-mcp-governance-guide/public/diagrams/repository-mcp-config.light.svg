        <circle cx="128" cy="200" r="5" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <rect x="40" y="64" width="176" height="80" rx="6" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <text x="128" y="100" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Write config</text>
