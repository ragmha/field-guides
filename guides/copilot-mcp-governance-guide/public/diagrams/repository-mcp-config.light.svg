        <line x1="352" y1="195" x2="352" y2="144" stroke="#59636e" stroke-width="1.5"/>
        <rect x="331.5" y="214" width="41" height="12" rx="2" fill="#f3f5f7"/><text x="352" y="223" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="8" font-weight="400">STEP 3</text>
        <line x1="464" y1="205" x2="464" y2="256" stroke="#59636e" stroke-width="1.5"/>
        <rect x="443.5" y="174" width="41" height="12" rx="2" fill="#f3f5f7"/><text x="464" y="183" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="8" font-weight="400">STEP 4</text>
        <line x1="576" y1="195" x2="576" y2="144" stroke="#59636e" stroke-width="1.5"/>
