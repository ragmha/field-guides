        <circle cx="464" cy="200" r="5" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <rect x="376" y="256" width="176" height="80" rx="6" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <text x="464" y="292" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Assign an issue</text>
