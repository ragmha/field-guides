<?xml version="1.0" encoding="UTF-8"?>
<svg id="repository-mcp-config-light-root" viewBox="0 0 704 508" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="repository-mcp-config-light-title repository-mcp-config-light-desc">
        <title id="repository-mcp-config-light-title">Configure and validate repository MCP</title>
        <desc id="repository-mcp-config-light-desc">Write the configuration with a tools list, save it for validation, add COPILOT_MCP_ secrets, assign an issue, and check the Start MCP Servers step.</desc>
        <defs><marker id="repository-mcp-config-light-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#59636e"/></marker></defs>
        <rect x="0" y="0" width="704" height="508" fill="#f3f5f7"/>
        <path d="M 40 200 L 656 200" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#repository-mcp-config-light-arrow)"/>
        <line x1="128" y1="195" x2="128" y2="144" stroke="#59636e" stroke-width="1.5"/>
        <rect x="107.5" y="214" width="41" height="12" rx="2" fill="#f3f5f7"/><text x="128" y="223" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="8" font-weight="400">STEP 1</text>
