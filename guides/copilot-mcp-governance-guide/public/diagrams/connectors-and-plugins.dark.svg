<?xml version="1.0" encoding="UTF-8"?>
<svg id="connectors-and-plugins-dark-root" viewBox="0 0 704 852" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="connectors-and-plugins-dark-title connectors-and-plugins-dark-desc">
        <title id="connectors-and-plugins-dark-title">Is a Copilot connector allowed?</title>
        <desc id="connectors-and-plugins-dark-desc">A connector request is blocked by Registry only, by a deny match, or by an allowlist without the connector URL; otherwise it is allowed.</desc>
        <defs><marker id="connectors-and-plugins-dark-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#9198a1"/></marker></defs>
        <rect x="0" y="0" width="704" height="852" fill="#07090d"/>
        <path d="M 232 96 L 232 120" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#connectors-and-plugins-dark-arrow)"/>
        <path d="M 352 176 L 400 176" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#connectors-and-plugins-dark-arrow)"/><rect x="363.75" y="158" width="24.5" height="12" rx="2" fill="#07090d"/><text x="376" y="167" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="8" font-weight="400">YES</text>
        <path d="M 232 232 L 232 280" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#connectors-and-plugins-dark-arrow)"/><rect x="246.5" y="250" width="19" height="12" rx="2" fill="#07090d"/><text x="256" y="259" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="8" font-weight="400">NO</text>
        <path d="M 352 336 L 400 336" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#connectors-and-plugins-dark-arrow)"/><rect x="363.75" y="318" width="24.5" height="12" rx="2" fill="#07090d"/><text x="376" y="327" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="8" font-weight="400">YES</text>
        <path d="M 232 392 L 232 440" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#connectors-and-plugins-dark-arrow)"/><rect x="246.5" y="410" width="19" height="12" rx="2" fill="#07090d"/><text x="256" y="419" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="8" font-weight="400">NO</text>
        <path d="M 352 496 L 400 496" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#connectors-and-plugins-dark-arrow)"/><rect x="363.75" y="478" width="24.5" height="12" rx="2" fill="#07090d"/><text x="376" y="487" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="8" font-weight="400">YES</text>
        <path d="M 232 552 L 232 600" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#connectors-and-plugins-dark-arrow)"/><rect x="246.5" y="570" width="19" height="12" rx="2" fill="#07090d"/><text x="256" y="579" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="8" font-weight="400">NO</text>
        <rect x="72" y="32" width="320" height="64" rx="20" fill="#0d1117" stroke="#9198a1" stroke-width="1.5"/>
        <text x="232" y="60" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Connector requested</text>
        <text x="232" y="76" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">A remote server matched by URL</text>
        <polygon points="232,120 352,176 232,232 112,176" fill="#0d1117" stroke="#9198a1" stroke-width="1.5"/>
        <text x="232" y="172" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Registry</text>
        <text x="232" y="188" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="400">only?</text>
        <rect x="400" y="136" width="264" height="80" rx="20" fill="#0d1117" stroke="#9198a1" stroke-width="1.5"/>
        <text x="532" y="172" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Blocked</text>
        <text x="532" y="188" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Registry only blocks connectors</text>
        <polygon points="232,280 352,336 232,392 112,336" fill="#0d1117" stroke="#9198a1" stroke-width="1.5"/>
        <text x="232" y="332" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Deny</text>
        <text x="232" y="348" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="400">match?</text>
        <rect x="400" y="296" width="264" height="80" rx="20" fill="#0d1117" stroke="#9198a1" stroke-width="1.5"/>
        <text x="532" y="332" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Blocked</text>
        <text x="532" y="348" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Deny wins over a wildcard allow</text>
        <polygon points="232,440 352,496 232,552 112,496" fill="#102219" stroke="#3fb950" stroke-width="1.5"/>
        <text x="232" y="492" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Allowlist set</text>
        <text x="232" y="508" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="400">and no match?</text>
        <rect x="400" y="456" width="264" height="80" rx="20" fill="#0d1117" stroke="#9198a1" stroke-width="1.5"/>
        <text x="532" y="492" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Blocked</text>
        <text x="532" y="508" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Add the connector wildcard URL</text>
        <rect x="72" y="600" width="320" height="80" rx="20" fill="#0d1117" stroke="#9198a1" stroke-width="1.5"/>
        <text x="232" y="636" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Connector allowed</text>
        <text x="232" y="652" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Also needs the preview features policy</text>
        <text x="40" y="736" text-anchor="start" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Connectors are public preview and work in cloud sandbox sessions, not GitHub Actions.</text>
        <text x="40" y="752" text-anchor="start" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Plugin-only source rules complement, not replace, allow and deny lists.</text>
        <line x1="40" y1="792" x2="664" y2="792" stroke="#3d444d"/>
        <text x="40" y="816" text-anchor="start" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="9" font-weight="400">Oval: start or end; rectangle: action or result; diamond: decision; arrow: next step</text>
        <text x="40" y="836" text-anchor="start" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="9" font-weight="400">Green: lesson focus, not approval or a safety rating</text>
      </svg>
