<?xml version="1.0" encoding="UTF-8"?>
<svg id="personal-and-agent-servers-light-root" viewBox="0 0 704 564" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="personal-and-agent-servers-light-title personal-and-agent-servers-light-desc">
        <title id="personal-and-agent-servers-light-title">Which cloud session server wins?</title>
        <desc id="personal-and-agent-servers-light-desc">Defaults are processed first, then custom agent profiles, then repository settings, with later sources overriding earlier ones; a repository server also overrides a same-named personal server.</desc>
        <defs><marker id="personal-and-agent-servers-light-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#59636e"/></marker></defs>
        <rect x="0" y="0" width="704" height="564" fill="#f3f5f7"/>
        <path d="M 220 120 L 220 176" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#personal-and-agent-servers-light-arrow)"/><rect x="180.25" y="142" width="79.5" height="12" rx="2" fill="#f3f5f7"/><text x="220" y="151" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="8" font-weight="400">OVERRIDDEN BY</text>
        <path d="M 220 256 L 220 312" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#personal-and-agent-servers-light-arrow)"/><rect x="180.25" y="278" width="79.5" height="12" rx="2" fill="#f3f5f7"/><text x="220" y="287" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="8" font-weight="400">OVERRIDDEN BY</text>
        <path d="M 400 352 L 464 352" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#personal-and-agent-servers-light-arrow)"/><rect x="403.25" y="330" width="57.5" height="12" rx="2" fill="#f3f5f7"/><text x="432" y="339" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="8" font-weight="400">OVERRIDES</text>
        <rect x="40" y="40" width="360" height="80" rx="6" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <text x="220" y="76" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Built-in defaults</text>
        <text x="220" y="92" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">GitHub and Playwright servers</text>
        <rect x="40" y="176" width="360" height="80" rx="6" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <text x="220" y="212" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Custom agent profile</text>
        <text x="220" y="228" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Not covered by allow or deny lists</text>
        <rect x="40" y="312" width="360" height="80" rx="6" fill="#eaf6ed" stroke="#1a7f37" stroke-width="1.5"/>
        <text x="220" y="348" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Repository settings</text>
        <text x="220" y="364" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Processed last</text>
        <rect x="464" y="304" width="200" height="96" rx="6" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <text x="564" y="340" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Personal servers</text>
        <text x="564" y="356" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Cloud sandboxes only</text>
        <text x="564" y="372" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Same name: repo wins</text>
        <text x="40" y="448" text-anchor="start" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Up to 50 servers in total across personal and repository configuration.</text>
        <line x1="40" y1="504" x2="664" y2="504" stroke="#d1d9e0"/>
        <text x="40" y="528" text-anchor="start" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="9" font-weight="400">Stack: processing order from top to bottom; side box: personal servers</text>
        <text x="40" y="548" text-anchor="start" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="9" font-weight="400">Green: lesson focus, not approval or a safety rating</text>
      </svg>
