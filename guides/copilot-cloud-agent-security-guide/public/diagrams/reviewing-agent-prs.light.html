<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Layers of evidence in an agent pull request review</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif; background: #f3f5f7; color: #1f2328; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 704px; min-width: 0; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow { font-size: .66rem; color: #59636e; margin-bottom: .5rem; }
    h1 { font-size: 1.75rem; line-height: 1.15; margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 704px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Copilot Cloud Agent Security · Layered layout · Review evidence</p>
    <h1>Layers of evidence in an agent pull request review</h1>
    <div class="diagram-container" tabindex="0" role="region" aria-label="Layers of evidence in an agent pull request review. Scroll horizontally to explore.">
      <svg viewBox="0 0 704 636" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="reviewing-agent-prs-light-title reviewing-agent-prs-light-desc">
        <title id="reviewing-agent-prs-light-title">Layers of evidence in an agent pull request review</title>
        <desc id="reviewing-agent-prs-light-desc">Layered review model combining built-in validation results, signed commits, session log links and human code review.</desc>
        <defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#59636e"/></marker></defs>
        <rect x="0" y="0" width="704" height="636" fill="#f3f5f7"/>
        <path d="M 352 144 L 352 184" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="360" y="158" width="46.5" height="12" rx="2" fill="#f3f5f7"/><text x="383.25" y="167" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="8" font-weight="400">INFORMS</text>
        <path d="M 352 256 L 352 296" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="360" y="270" width="46.5" height="12" rx="2" fill="#f3f5f7"/><text x="383.25" y="279" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="8" font-weight="400">INFORMS</text>
        <path d="M 352 368 L 352 408" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="360" y="382" width="46.5" height="12" rx="2" fill="#f3f5f7"/><text x="383.25" y="391" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="8" font-weight="400">INFORMS</text>
        <rect x="40" y="72" width="624" height="72" rx="8" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <text x="56" y="104" text-anchor="start" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Built-in validation</text>
        <text x="56" y="120" text-anchor="start" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">CodeQL · dependency advisory check · secret scanning · Copilot code review</text>
        <rect x="40" y="184" width="624" height="72" rx="8" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <text x="56" y="216" text-anchor="start" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Provenance</text>
        <text x="56" y="232" text-anchor="start" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Copilot author · requester co-author · signed commits · session log link</text>
        <rect x="40" y="296" width="624" height="72" rx="8" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <text x="56" y="328" text-anchor="start" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Workflow evidence</text>
        <text x="56" y="344" text-anchor="start" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Inspect .github/ changes · Approve and run workflows · CI results</text>
        <rect x="40" y="408" width="624" height="72" rx="8" fill="#eaf6ed" stroke="#1a7f37" stroke-width="1.5"/>
        <text x="56" y="440" text-anchor="start" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Human review</text>
        <text x="56" y="456" text-anchor="start" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Independent reviewer reads the diff against the request, then approves</text>
        <text x="40" y="520" text-anchor="start" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">A repository admin can disable validation tools; record any that are off.</text>
        <text x="40" y="536" text-anchor="start" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Session logs explain how the agent worked; they do not replace review.</text>
        <line x1="40" y1="568" x2="664" y2="568" stroke="#d1d9e0" stroke-width="1"/>
        <text x="40" y="592" text-anchor="start" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="9" font-weight="400">Bands: evidence layers, top to bottom; arrows: inputs to the human decision</text>
        <text x="40" y="612" text-anchor="start" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="9" font-weight="400">Green box: lesson focus, not approval or a safety rating</text>
      </svg>
    </div>
  </div>
