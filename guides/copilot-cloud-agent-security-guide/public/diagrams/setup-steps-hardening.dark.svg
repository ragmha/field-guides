<?xml version="1.0" encoding="UTF-8"?>
<svg id="setup-steps-hardening-dark-root" viewBox="0 0 704 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="setup-steps-hardening-dark-title setup-steps-hardening-dark-desc">
        <title id="setup-steps-hardening-dark-title">Setup steps hardening lifecycle</title>
        <desc id="setup-steps-hardening-dark-desc">Lifecycle from authoring copilot-setup-steps.yml through review, default branch merge, runner selection and session start.</desc>
