        <rect x="0" y="0" width="704" height="600" fill="#07090d"/>
        <path d="M 216 108 L 264 108" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#setup-steps-hardening-dark-arrow)"/><rect x="230.5" y="88" width="19" height="12" rx="2" fill="#07090d"/><text x="240" y="97" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="8" font-weight="400">PR</text>
