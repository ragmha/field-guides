        <path d="M 488 252 L 440 252" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#setup-steps-hardening-dark-arrow)"/><rect x="451.75" y="232" width="24.5" height="12" rx="2" fill="#07090d"/><text x="464" y="241" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="8" font-weight="400">RUN</text>
        <path d="M 264 252 L 216 252" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#setup-steps-hardening-dark-arrow)"/><rect x="222.25" y="232" width="35.5" height="12" rx="2" fill="#07090d"/><text x="240" y="241" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="8" font-weight="400">START</text>
        <text x="40" y="52" text-anchor="start" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="600">ACTIONS SESSIONS ONLY</text>
        <rect x="40" y="72" width="176" height="72" rx="8" fill="#0d1117" stroke="#9198a1" stroke-width="1.5"/>
        <text x="128" y="104" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Author file</text>
        <text x="128" y="120" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">copilot-setup-steps.yml</text>
        <rect x="264" y="72" width="176" height="72" rx="8" fill="#102219" stroke="#3fb950" stroke-width="1.5"/>
        <text x="352" y="104" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Code owner review</text>
        <text x="352" y="120" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Minimal permissions</text>
        <rect x="488" y="72" width="176" height="72" rx="8" fill="#0d1117" stroke="#9198a1" stroke-width="1.5"/>
        <text x="576" y="104" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Merge to default</text>
        <text x="576" y="120" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Required to trigger</text>
        <rect x="40" y="216" width="176" height="72" rx="8" fill="#0d1117" stroke="#9198a1" stroke-width="1.5"/>
        <text x="128" y="248" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Agent works</text>
        <text x="128" y="264" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Own token; 59 min max</text>
        <rect x="264" y="216" width="176" height="72" rx="8" fill="#0d1117" stroke="#9198a1" stroke-width="1.5"/>
        <text x="352" y="248" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Setup steps run</text>
        <text x="352" y="264" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Outside the firewall</text>
        <rect x="488" y="216" width="176" height="72" rx="8" fill="#0d1117" stroke="#9198a1" stroke-width="1.5"/>
        <text x="576" y="248" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Runner chosen</text>
        <text x="576" y="264" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Org may enforce type</text>
        <text x="40" y="344" text-anchor="start" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="600">RUNNER OPTIONS</text>
        <rect x="40" y="364" width="304" height="72" rx="8" fill="#0d1117" stroke="#9198a1" stroke-width="1.5"/>
        <text x="192" y="396" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">GitHub-hosted (recommended)</text>
        <text x="192" y="412" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Fresh virtual machine each time</text>
        <rect x="360" y="364" width="304" height="72" rx="8" fill="#0d1117" stroke="#9198a1" stroke-width="1.5"/>
        <text x="512" y="388" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Self-hosted</text>
        <text x="512" y="404" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Ephemeral, single-use runners</text>
        <text x="512" y="420" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Disable firewall; add network controls</text>
        <text x="40" y="484" text-anchor="start" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Only steps, permissions, runs-on, services, snapshot and timeout-minutes are honored.</text>
        <text x="40" y="500" text-anchor="start" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">A failed step skips the remaining steps; the agent still continues.</text>
        <line x1="40" y1="532" x2="664" y2="532" stroke="#3d444d" stroke-width="1"/>
        <text x="40" y="556" text-anchor="start" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="9" font-weight="400">Boxes: stages in order; arrows: transitions; lower row: runner choices</text>
        <text x="40" y="576" text-anchor="start" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="9" font-weight="400">Green box: lesson focus, not approval or a safety rating</text>
