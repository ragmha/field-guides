<?xml version="1.0" encoding="UTF-8"?>
<svg id="rulesets-for-agents-light-root" viewBox="0 0 704 724" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="rulesets-for-agents-light-title rulesets-for-agents-light-desc">
        <title id="rulesets-for-agents-light-title">Ruleset checks on an agent push</title>
        <desc id="rulesets-for-agents-light-desc">Decision flow showing how rulesets, bypass entries and code owner review apply to a pull request that Copilot opens or updates.</desc>
        <defs><marker id="rulesets-for-agents-light-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#59636e"/></marker></defs>
        <rect x="0" y="0" width="704" height="724" fill="#f3f5f7"/>
        <path d="M 180 136 L 180 168" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#rulesets-for-agents-light-arrow)"/>
        <path d="M 180 232 L 180 264" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#rulesets-for-agents-light-arrow)"/><rect x="188" y="242" width="24.5" height="12" rx="2" fill="#f3f5f7"/><text x="200.25" y="251" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="8" font-weight="400">YES</text>
        <path d="M 180 328 L 180 360" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#rulesets-for-agents-light-arrow)"/><rect x="188" y="338" width="19" height="12" rx="2" fill="#f3f5f7"/><text x="197.5" y="347" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="8" font-weight="400">NO</text>
        <path d="M 320 200 L 416 200" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#rulesets-for-agents-light-arrow)"/><rect x="358.5" y="180" width="19" height="12" rx="2" fill="#f3f5f7"/><text x="368" y="189" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="8" font-weight="400">NO</text>
        <path d="M 320 296 L 416 296" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#rulesets-for-agents-light-arrow)"/><rect x="355.75" y="276" width="24.5" height="12" rx="2" fill="#f3f5f7"/><text x="368" y="285" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="8" font-weight="400">YES</text>
        <path d="M 320 528 L 416 528" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#rulesets-for-agents-light-arrow)"/><rect x="355.75" y="508" width="24.5" height="12" rx="2" fill="#f3f5f7"/><text x="368" y="517" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="8" font-weight="400">YES</text>
        <rect x="40" y="72" width="280" height="64" rx="20" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <text x="180" y="100" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Copilot pushes to its branch</text>
        <text x="180" y="116" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Opens or updates a pull request</text>
        <rect x="40" y="168" width="280" height="64" rx="4" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <text x="180" y="196" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Does a rule block the push?</text>
        <text x="180" y="212" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Check commit-metadata rules</text>
        <rect x="40" y="264" width="280" height="64" rx="4" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <text x="180" y="300" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Can the rule target be narrowed?</text>
        <rect x="40" y="360" width="280" height="64" rx="8" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <text x="180" y="388" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Grant narrow bypass</text>
        <text x="180" y="404" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">For pull requests only; record why</text>
        <rect x="416" y="168" width="248" height="64" rx="8" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <text x="540" y="196" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Rules and checks still apply</text>
        <text x="540" y="212" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Same as human contributors</text>
        <rect x="416" y="264" width="248" height="64" rx="8" fill="#eaf6ed" stroke="#1a7f37" stroke-width="1.5"/>
        <text x="540" y="292" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Retarget the rule</text>
        <text x="540" y="308" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Preferred over bypass</text>
        <text x="40" y="476" text-anchor="start" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="600">FOR EVERY AGENT PULL REQUEST</text>
        <rect x="40" y="496" width="280" height="64" rx="4" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <text x="180" y="524" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Changes agent config files?</text>
        <text x="180" y="540" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Setup steps, instructions, MCP</text>
        <rect x="416" y="496" width="248" height="64" rx="8" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <text x="540" y="524" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Code owner approval needed</text>
        <text x="540" y="540" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">CODEOWNERS plus required review</text>
        <text x="40" y="608" text-anchor="start" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Copilot signs its commits but may not satisfy other commit-metadata rules.</text>
        <text x="40" y="624" text-anchor="start" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Eligible bypass actors include GitHub Apps; use the narrowest scope that unblocks work.</text>
        <line x1="40" y1="656" x2="664" y2="656" stroke="#d1d9e0" stroke-width="1"/>
        <text x="40" y="680" text-anchor="start" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="9" font-weight="400">Square corners: decisions; rounded: start and outcomes; arrows: answers</text>
        <text x="40" y="700" text-anchor="start" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="9" font-weight="400">Green box: lesson focus, not approval or a safety rating</text>
      </svg>
