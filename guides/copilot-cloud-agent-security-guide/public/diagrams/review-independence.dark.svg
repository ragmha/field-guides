<?xml version="1.0" encoding="UTF-8"?>
<svg id="review-independence-dark-root" viewBox="0 0 704 548" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="review-independence-dark-title review-independence-dark-desc">
        <title id="review-independence-dark-title">Independent approval of agent pull requests</title>
        <desc id="review-independence-dark-desc">Swimlane showing the requester, Copilot and an independent reviewer, with the requester approval not counting toward required approvals.</desc>
        <defs><marker id="review-independence-dark-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#9198a1"/></marker></defs>
        <rect x="0" y="0" width="704" height="548" fill="#07090d"/>
        <rect x="40" y="72" width="624" height="96" rx="4" fill="#07090d" stroke="#3d444d" stroke-width="1"/>
        <text x="56" y="124" text-anchor="start" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="600">REQUESTER</text>
        <rect x="40" y="184" width="624" height="96" rx="4" fill="#07090d" stroke="#3d444d" stroke-width="1"/>
        <text x="56" y="236" text-anchor="start" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="600">COPILOT</text>
        <rect x="40" y="296" width="624" height="96" rx="4" fill="#07090d" stroke="#3d444d" stroke-width="1"/>
        <text x="56" y="348" text-anchor="start" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="600">REVIEWER</text>
        <path d="M 216 148 L 216 224 A 8 8 0 0 0 224 232 L 288 232" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#review-independence-dark-arrow)"/><rect x="231.5" y="212" width="41" height="12" rx="2" fill="#07090d"/><text x="252" y="221" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="8" font-weight="400">PROMPT</text>
        <path d="M 344 260 L 344 336 A 8 8 0 0 0 352 344 L 416 344" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#review-independence-dark-arrow)"/><rect x="359.5" y="324" width="41" height="12" rx="2" fill="#07090d"/><text x="380" y="333" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="8" font-weight="400">REVIEW</text>
        <path d="M 528 344 L 544 344" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#review-independence-dark-arrow)"/>
        <path d="M 600 148 L 600 316" fill="none" stroke="#9198a1" stroke-width="1.5" stroke-dasharray="5,4"/><rect x="565.75" y="226" width="68.5" height="12" rx="2" fill="#07090d"/><text x="600" y="235" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="8" font-weight="400">NOT COUNTED</text>
        <rect x="160" y="92" width="112" height="56" rx="8" fill="#0d1117" stroke="#9198a1" stroke-width="1.5"/>
        <text x="216" y="116" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Asks Copilot</text>
        <text x="216" y="132" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Has write access</text>
        <rect x="288" y="204" width="112" height="56" rx="8" fill="#0d1117" stroke="#9198a1" stroke-width="1.5"/>
        <text x="344" y="228" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Opens draft PR</text>
        <text x="344" y="244" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Copilot author</text>
        <rect x="416" y="316" width="112" height="56" rx="8" fill="#0d1117" stroke="#9198a1" stroke-width="1.5"/>
        <text x="472" y="340" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Reviews diff</text>
        <text x="472" y="356" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Not the requester</text>
        <rect x="544" y="316" width="112" height="56" rx="8" fill="#102219" stroke="#3fb950" stroke-width="1.5"/>
        <text x="600" y="340" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Approves</text>
        <text x="600" y="356" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Counts</text>
        <rect x="544" y="92" width="112" height="56" rx="8" fill="#0d1117" stroke="#9198a1" stroke-width="1.5" stroke-dasharray="5,4"/>
        <text x="600" y="116" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Self-approval</text>
        <text x="600" y="132" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Does not count</text>
        <text x="40" y="432" text-anchor="start" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Unattributed Copilot pull requests need one extra approval when at least one is required.</text>
        <text x="40" y="448" text-anchor="start" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">That ruleset setting is in public preview and on by default.</text>
        <line x1="40" y1="480" x2="664" y2="480" stroke="#3d444d" stroke-width="1"/>
        <text x="40" y="504" text-anchor="start" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="9" font-weight="400">Bands: roles; dashed: an approval that does not count toward required approvals</text>
        <text x="40" y="524" text-anchor="start" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="9" font-weight="400">Green box: lesson focus, not approval or a safety rating</text>
      </svg>
