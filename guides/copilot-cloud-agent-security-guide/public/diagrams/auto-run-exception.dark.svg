<?xml version="1.0" encoding="UTF-8"?>
<svg id="auto-run-exception-dark-root" viewBox="0 0 704 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="auto-run-exception-dark-title auto-run-exception-dark-desc">
        <title id="auto-run-exception-dark-title">Workflow approval setting trade-offs</title>
        <desc id="auto-run-exception-dark-desc">Matrix comparing the default approval setting with automatic workflow runs across exposure, owner and evidence.</desc>
        <defs><marker id="auto-run-exception-dark-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#9198a1"/></marker></defs>
        <rect x="0" y="0" width="704" height="500" fill="#07090d"/>
        <text x="40" y="52" text-anchor="start" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="600">REQUIRE APPROVAL FOR WORKFLOW RUNS</text>
        <rect x="40" y="72" width="160" height="40" rx="0" fill="#07090d" stroke="#3d444d" stroke-width="1"/>
        <text x="52" y="96" text-anchor="start" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="600">Factor</text>
        <rect x="200" y="72" width="232" height="40" rx="0" fill="#102219" stroke="#3fb950" stroke-width="1.5"/>
        <text x="212" y="96" text-anchor="start" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="600">On (default)</text>
        <rect x="432" y="72" width="232" height="40" rx="0" fill="#07090d" stroke="#3d444d" stroke-width="1"/>
        <text x="444" y="96" text-anchor="start" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="600">Off (automatic runs)</text>
        <rect x="40" y="112" width="160" height="48" rx="0" fill="#0d1117" stroke="#3d444d" stroke-width="1"/>
        <text x="52" y="140" text-anchor="start" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">When code runs</text>
        <rect x="200" y="112" width="232" height="48" rx="0" fill="#0d1117" stroke="#3d444d" stroke-width="1"/>
        <text x="212" y="140" text-anchor="start" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">After a human reads it</text>
        <rect x="432" y="112" width="232" height="48" rx="0" fill="#0d1117" stroke="#3d444d" stroke-width="1"/>
        <text x="444" y="140" text-anchor="start" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Before any review</text>
        <rect x="40" y="160" width="160" height="48" rx="0" fill="#0d1117" stroke="#3d444d" stroke-width="1"/>
        <text x="52" y="188" text-anchor="start" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Secrets</text>
        <rect x="200" y="160" width="232" height="48" rx="0" fill="#0d1117" stroke="#3d444d" stroke-width="1"/>
        <text x="212" y="188" text-anchor="start" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Gated by a reviewer</text>
        <rect x="432" y="160" width="232" height="48" rx="0" fill="#0d1117" stroke="#3d444d" stroke-width="1"/>
        <text x="444" y="188" text-anchor="start" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Reachable by unreviewed code</text>
        <rect x="40" y="208" width="160" height="48" rx="0" fill="#0d1117" stroke="#3d444d" stroke-width="1"/>
        <text x="52" y="236" text-anchor="start" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Write access</text>
        <rect x="200" y="208" width="232" height="48" rx="0" fill="#0d1117" stroke="#3d444d" stroke-width="1"/>
        <text x="212" y="236" text-anchor="start" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Gated by a reviewer</text>
        <rect x="432" y="208" width="232" height="48" rx="0" fill="#0d1117" stroke="#3d444d" stroke-width="1"/>
        <text x="444" y="236" text-anchor="start" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Possible through the token</text>
        <rect x="40" y="256" width="160" height="48" rx="0" fill="#0d1117" stroke="#3d444d" stroke-width="1"/>
        <text x="52" y="284" text-anchor="start" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Owner</text>
        <rect x="200" y="256" width="232" height="48" rx="0" fill="#0d1117" stroke="#3d444d" stroke-width="1"/>
        <text x="212" y="284" text-anchor="start" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Repository admin</text>
        <rect x="432" y="256" width="232" height="48" rx="0" fill="#0d1117" stroke="#3d444d" stroke-width="1"/>
        <text x="444" y="284" text-anchor="start" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Admin with an exception record</text>
        <rect x="40" y="304" width="160" height="48" rx="0" fill="#0d1117" stroke="#3d444d" stroke-width="1"/>
        <text x="52" y="332" text-anchor="start" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Fits</text>
        <rect x="200" y="304" width="232" height="48" rx="0" fill="#0d1117" stroke="#3d444d" stroke-width="1"/>
        <text x="212" y="332" text-anchor="start" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Most repositories</text>
        <rect x="432" y="304" width="232" height="48" rx="0" fill="#0d1117" stroke="#3d444d" stroke-width="1"/>
        <text x="444" y="332" text-anchor="start" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">No secrets; read-only token</text>
        <text x="40" y="384" text-anchor="start" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">The setting is in repository Settings &gt; Copilot &gt; Cloud agent &gt; Policies.</text>
        <text x="40" y="400" text-anchor="start" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Guide advice: grant exceptions with conditions and an expiry date.</text>
        <line x1="40" y1="432" x2="664" y2="432" stroke="#3d444d" stroke-width="1"/>
        <text x="40" y="456" text-anchor="start" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="9" font-weight="400">Columns: setting values; rows: what changes; cells summarize lesson guidance</text>
        <text x="40" y="476" text-anchor="start" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="9" font-weight="400">Green header: recommended default, not a safety rating</text>
      </svg>
