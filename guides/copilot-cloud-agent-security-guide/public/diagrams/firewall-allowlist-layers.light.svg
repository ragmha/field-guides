<?xml version="1.0" encoding="UTF-8"?>
<svg id="firewall-allowlist-layers-light-root" viewBox="0 0 704 700" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="firewall-allowlist-layers-light-title firewall-allowlist-layers-light-desc">
        <title id="firewall-allowlist-layers-light-title">Organization and repository firewall settings</title>
        <desc id="firewall-allowlist-layers-light-desc">Decision flow showing when repository firewall settings are locked by organization settings and how custom allowlists combine.</desc>
        <defs><marker id="firewall-allowlist-layers-light-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#59636e"/></marker></defs>
        <rect x="0" y="0" width="704" height="700" fill="#f3f5f7"/>
        <path d="M 136 136 L 136 200" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#firewall-allowlist-layers-light-arrow)"/><rect x="144" y="162" width="46.5" height="12" rx="2" fill="#f3f5f7"/><text x="167.25" y="171" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="8" font-weight="400">ENABLED</text>
        <path d="M 352 136 L 352 200" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#firewall-allowlist-layers-light-arrow)"/><rect x="360" y="162" width="52" height="12" rx="2" fill="#f3f5f7"/><text x="386" y="171" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="8" font-weight="400">DISABLED</text>
        <path d="M 568 136 L 568 200" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#firewall-allowlist-layers-light-arrow)"/><rect x="464" y="162" width="96" height="12" rx="2" fill="#f3f5f7"/><text x="512" y="171" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="8" font-weight="400">LET REPOS DECIDE</text>
        <path d="M 184 408 L 184 472" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#firewall-allowlist-layers-light-arrow)"/><rect x="192" y="434" width="52" height="12" rx="2" fill="#f3f5f7"/><text x="218" y="443" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="8" font-weight="400">DISABLED</text>
        <path d="M 520 408 L 520 472" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#firewall-allowlist-layers-light-arrow)"/><rect x="465.5" y="434" width="46.5" height="12" rx="2" fill="#f3f5f7"/><text x="488.75" y="443" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="8" font-weight="400">ENABLED</text>
        <rect x="40" y="72" width="624" height="64" rx="4" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <text x="352" y="100" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Organization: Enable firewall</text>
        <text x="352" y="116" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Recommended allowlist offers the same three options</text>
        <rect x="40" y="200" width="192" height="72" rx="8" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <text x="136" y="232" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Firewall on</text>
        <text x="136" y="248" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Repository locked</text>
        <rect x="256" y="200" width="192" height="72" rx="8" fill="#ffffff" stroke="#59636e" stroke-width="1.5" stroke-dasharray="5,4"/>
        <text x="352" y="232" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Firewall off</text>
        <text x="352" y="248" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Repository locked</text>
        <rect x="472" y="200" width="192" height="72" rx="8" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <text x="568" y="232" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Repository decides</text>
        <text x="568" y="248" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Default organization option</text>
        <text x="40" y="324" text-anchor="start" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="600">CUSTOM ALLOWLIST</text>
        <rect x="128" y="344" width="448" height="64" rx="4" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <text x="352" y="372" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Allow repository custom rules?</text>
        <text x="352" y="388" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Organization setting; enabled by default</text>
        <rect x="40" y="472" width="288" height="64" rx="8" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <text x="184" y="500" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Organization list only</text>
        <text x="184" y="516" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Repository rules do not apply</text>
        <rect x="376" y="472" width="288" height="64" rx="8" fill="#eaf6ed" stroke="#1a7f37" stroke-width="1.5"/>
        <text x="520" y="500" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Lists combine</text>
        <text x="520" y="516" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Org entries cannot be deleted</text>
        <text x="40" y="584" text-anchor="start" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Domain entries include subdomains; URL entries match scheme, host, path and below.</text>
        <text x="40" y="600" text-anchor="start" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Allowlist changes apply only to sessions started after the change.</text>
        <line x1="40" y1="632" x2="664" y2="632" stroke="#d1d9e0" stroke-width="1"/>
        <text x="40" y="656" text-anchor="start" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="9" font-weight="400">Square corners: settings; rounded: effective results; dashed: firewall off</text>
        <text x="40" y="676" text-anchor="start" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="9" font-weight="400">Green box: lesson focus, not approval or a safety rating</text>
      </svg>
