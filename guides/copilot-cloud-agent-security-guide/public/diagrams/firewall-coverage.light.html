<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agent firewall coverage map</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif; background: #f3f5f7; color: #1f2328; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 704px; min-width: 0; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow { font-size: .66rem; color: #59636e; margin-bottom: .5rem; }
    h1 { font-size: 1.75rem; line-height: 1.15; margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 704px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Copilot Cloud Agent Security · Coverage map · Firewall scope</p>
    <h1>Agent firewall coverage map</h1>
    <div class="diagram-container" tabindex="0" role="region" aria-label="Agent firewall coverage map. Scroll horizontally to explore.">
      <svg viewBox="0 0 704 652" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="firewall-coverage-light-title firewall-coverage-light-desc">
        <title id="firewall-coverage-light-title">Agent firewall coverage map</title>
        <desc id="firewall-coverage-light-desc">Coverage map showing which processes the firewall filters and which paths, such as other MCP servers and setup steps, it does not cover.</desc>
        <defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#59636e"/></marker></defs>
        <rect x="0" y="0" width="704" height="652" fill="#f3f5f7"/>
        <path d="M 188 368 L 188 424" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="196" y="390" width="46.5" height="12" rx="2" fill="#f3f5f7"/><text x="219.25" y="399" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="8" font-weight="400">BLOCKED</text>
        <rect x="40" y="72" width="296" height="296" rx="8" fill="#eaf6ed" stroke="#1a7f37" stroke-width="1.5"/>
        <text x="56" y="100" text-anchor="start" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="600">COVERED BY THE FIREWALL</text>
        <rect x="368" y="72" width="296" height="296" rx="8" fill="#ffffff" stroke="#59636e" stroke-width="1.5" stroke-dasharray="5,4"/>
        <text x="384" y="100" text-anchor="start" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="600">NOT COVERED</text>
        <rect x="56" y="120" width="264" height="48" rx="8" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <text x="188" y="140" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Bash-tool processes</text>
        <text x="188" y="156" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">npm install, curl, tests</text>
        <rect x="56" y="184" width="264" height="48" rx="8" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <text x="188" y="204" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Built-in Playwright MCP</text>
        <text x="188" y="220" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Cloud sandboxes, with browsers</text>
        <rect x="384" y="120" width="264" height="48" rx="8" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <text x="516" y="148" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Other MCP servers</text>
        <rect x="384" y="184" width="264" height="48" rx="8" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <text x="516" y="212" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Repository Playwright replacement</text>
        <rect x="384" y="248" width="264" height="48" rx="8" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <text x="516" y="276" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Setup step processes</text>
        <rect x="384" y="312" width="264" height="48" rx="8" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <text x="516" y="340" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Outside the agent environment</text>
        <rect x="40" y="424" width="624" height="72" rx="8" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <text x="352" y="456" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Warning on the pull request</text>
        <text x="352" y="472" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Pull request body or comment shows the blocked address and command</text>
        <text x="40" y="536" text-anchor="start" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">GitHub hosts are always allowed; the recommended allowlist is on by default.</text>
        <text x="40" y="552" text-anchor="start" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Bypass is possible; pair the firewall with other controls for uncovered paths.</text>
        <line x1="40" y1="584" x2="664" y2="584" stroke="#d1d9e0" stroke-width="1"/>
        <text x="40" y="608" text-anchor="start" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="9" font-weight="400">Left: filtered paths; dashed right: paths the firewall does not filter</text>
        <text x="40" y="628" text-anchor="start" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="9" font-weight="400">Green region: lesson focus, not approval or a safety rating</text>
      </svg>
    </div>
  </div>
</body>
</html>
