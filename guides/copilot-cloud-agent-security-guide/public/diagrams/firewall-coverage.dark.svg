<?xml version="1.0" encoding="UTF-8"?>
<svg id="firewall-coverage-dark-root" viewBox="0 0 704 652" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="firewall-coverage-dark-title firewall-coverage-dark-desc">
        <title id="firewall-coverage-dark-title">Agent firewall coverage map</title>
        <desc id="firewall-coverage-dark-desc">Coverage map showing which processes the firewall filters and which paths, such as other MCP servers and setup steps, it does not cover.</desc>
        <defs><marker id="firewall-coverage-dark-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#9198a1"/></marker></defs>
        <rect x="0" y="0" width="704" height="652" fill="#07090d"/>
        <path d="M 188 368 L 188 424" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#firewall-coverage-dark-arrow)"/><rect x="196" y="390" width="46.5" height="12" rx="2" fill="#07090d"/><text x="219.25" y="399" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="8" font-weight="400">BLOCKED</text>
        <rect x="40" y="72" width="296" height="296" rx="8" fill="#102219" stroke="#3fb950" stroke-width="1.5"/>
        <text x="56" y="100" text-anchor="start" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="600">COVERED BY THE FIREWALL</text>
        <rect x="368" y="72" width="296" height="296" rx="8" fill="#0d1117" stroke="#9198a1" stroke-width="1.5" stroke-dasharray="5,4"/>
        <text x="384" y="100" text-anchor="start" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="600">NOT COVERED</text>
        <rect x="56" y="120" width="264" height="48" rx="8" fill="#0d1117" stroke="#9198a1" stroke-width="1.5"/>
        <text x="188" y="140" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Bash-tool processes</text>
        <text x="188" y="156" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">npm install, curl, tests</text>
        <rect x="56" y="184" width="264" height="48" rx="8" fill="#0d1117" stroke="#9198a1" stroke-width="1.5"/>
        <text x="188" y="204" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Built-in Playwright MCP</text>
        <text x="188" y="220" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Cloud sandboxes, with browsers</text>
        <rect x="384" y="120" width="264" height="48" rx="8" fill="#0d1117" stroke="#9198a1" stroke-width="1.5"/>
        <text x="516" y="148" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Other MCP servers</text>
        <rect x="384" y="184" width="264" height="48" rx="8" fill="#0d1117" stroke="#9198a1" stroke-width="1.5"/>
        <text x="516" y="212" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Repository Playwright replacement</text>
        <rect x="384" y="248" width="264" height="48" rx="8" fill="#0d1117" stroke="#9198a1" stroke-width="1.5"/>
        <text x="516" y="276" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Setup step processes</text>
        <rect x="384" y="312" width="264" height="48" rx="8" fill="#0d1117" stroke="#9198a1" stroke-width="1.5"/>
        <text x="516" y="340" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Outside the agent environment</text>
        <rect x="40" y="424" width="624" height="72" rx="8" fill="#0d1117" stroke="#9198a1" stroke-width="1.5"/>
        <text x="352" y="456" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Warning on the pull request</text>
        <text x="352" y="472" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Pull request body or comment shows the blocked address and command</text>
        <text x="40" y="536" text-anchor="start" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">GitHub hosts are always allowed; the recommended allowlist is on by default.</text>
        <text x="40" y="552" text-anchor="start" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Bypass is possible; pair the firewall with other controls for uncovered paths.</text>
        <line x1="40" y1="584" x2="664" y2="584" stroke="#3d444d" stroke-width="1"/>
        <text x="40" y="608" text-anchor="start" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="9" font-weight="400">Left: filtered paths; dashed right: paths the firewall does not filter</text>
        <text x="40" y="628" text-anchor="start" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="9" font-weight="400">Green region: lesson focus, not approval or a safety rating</text>
      </svg>
