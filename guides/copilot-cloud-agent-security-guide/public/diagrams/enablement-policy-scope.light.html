<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Copilot in the cloud policy layers</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif; background: #f3f5f7; color: #1f2328; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 704px; min-width: 0; width: 100%; }

    svg { width: 100%; min-width: 704px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Copilot Cloud Agent Security · Layered controls · Policy scope</p>
    <h1>Copilot in the cloud policy layers</h1>
    <div class="diagram-container" tabindex="0" role="region" aria-label="Copilot in the cloud policy layers. Scroll horizontally to explore.">
      <svg viewBox="0 0 704 692" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="enablement-policy-scope-light-title enablement-policy-scope-light-desc">

        <desc id="enablement-policy-scope-light-desc">Layered view of enterprise policy, organization repository access and repository opt-out that together decide whether the cloud agent can work in a repository.</desc>
        <defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#59636e"/></marker></defs>
        <rect x="0" y="0" width="704" height="692" fill="#f3f5f7"/>
        <path d="M 416 112 L 496 112" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="430" y="92" width="52" height="12" rx="2" fill="#f3f5f7"/><text x="456" y="101" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="8" font-weight="400">DISABLED</text>
        <path d="M 228 152 L 228 200" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="236" y="170" width="41" height="12" rx="2" fill="#f3f5f7"/><text x="256.5" y="179" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="8" font-weight="400">ALLOWS</text>
        <path d="M 416 240 L 496 240" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="430" y="220" width="52" height="12" rx="2" fill="#f3f5f7"/><text x="456" y="229" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="8" font-weight="400">EXCLUDED</text>
        <path d="M 228 280 L 228 328" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="236" y="298" width="41" height="12" rx="2" fill="#f3f5f7"/><text x="256.5" y="307" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="8" font-weight="400">ALLOWS</text>
        <path d="M 416 368 L 496 368" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="427.25" y="348" width="57.5" height="12" rx="2" fill="#f3f5f7"/><text x="456" y="357" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="8" font-weight="400">OPTED OUT</text>
        <path d="M 228 408 L 228 456" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="236" y="426" width="41" height="12" rx="2" fill="#f3f5f7"/><text x="256.5" y="435" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="8" font-weight="400">ALLOWS</text>
        <text x="40" y="52" text-anchor="start" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="600">LAYERS, EVALUATED IN ORDER</text>

        <text x="228" y="100" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Enterprise policy</text>
        <text x="228" y="116" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Copilot in the cloud · on by default</text>
        <text x="228" y="132" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Also governs cloud sandboxes</text>
        <rect x="40" y="200" width="376" height="80" rx="8" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <text x="228" y="228" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Organization repository access</text>
        <text x="228" y="244" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">All or selected repositories</text>
        <text x="228" y="260" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Only where enterprise delegates</text>
        <rect x="40" y="328" width="376" height="80" rx="8" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <text x="228" y="356" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Repository setting</text>
        <text x="228" y="372" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Owner or admin can disable Copilot</text>
        <text x="228" y="388" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Opt-outs carried over</text>
        <rect x="496" y="72" width="168" height="336" rx="8" fill="#ffffff" stroke="#59636e" stroke-width="1.5" stroke-dasharray="5,4"/>
        <text x="580" y="228" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Out of scope</text>
        <text x="580" y="244" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Agent cannot work</text>
        <text x="580" y="260" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">in this repository</text>
        <rect x="40" y="456" width="376" height="72" rx="8" fill="#eaf6ed" stroke="#1a7f37" stroke-width="1.5"/>
        <text x="228" y="488" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">In scope for the agent</text>
        <text x="228" y="504" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Every layer allows it</text>
        <text x="40" y="576" text-anchor="start" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Organizations cannot override a policy the enterprise has chosen.</text>
        <text x="40" y="592" text-anchor="start" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">A recorded plan is not proof the settings are applied; check each settings page.</text>
        <line x1="40" y1="624" x2="664" y2="624" stroke="#d1d9e0" stroke-width="1"/>
        <text x="40" y="648" text-anchor="start" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="9" font-weight="400">Boxes: decision layers; dashed box: out-of-scope result; arrows: evaluation order</text>
        <text x="40" y="668" text-anchor="start" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="9" font-weight="400">Green box: lesson focus, not approval or a safety rating</text>
      </svg>
    </div>
  </div>

</html>
