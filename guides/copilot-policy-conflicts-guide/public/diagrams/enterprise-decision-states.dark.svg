<?xml version="1.0" encoding="UTF-8"?>
<svg id="enterprise-decision-states-dark-root" viewBox="0 0 704 584" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="enterprise-decision-states-dark-title enterprise-decision-states-dark-desc">
        <title id="enterprise-decision-states-dark-title">Who decides each enterprise state?</title>
        <desc id="enterprise-decision-states-dark-desc">Enabled everywhere, disabled everywhere and selected-organization states are decided by the enterprise; only let organizations decide hands the policy to organization settings.</desc>
