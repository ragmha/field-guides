        <rect x="0" y="0" width="704" height="584" fill="#07090d"/>
        <path d="M 248 116 L 272 116" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#enterprise-decision-states-dark-arrow)"/>
