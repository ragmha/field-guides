<?xml version="1.0" encoding="UTF-8"?>
<svg id="delegation-and-defaults-dark-root" viewBox="0 0 704 776" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="delegation-and-defaults-dark-title delegation-and-defaults-dark-desc">
        <title id="delegation-and-defaults-dark-title">Follow an unconfigured GA feature</title>
        <desc id="delegation-and-defaults-dark-desc">The enterprise default for new features decides an unconfigured GA feature; when it delegates, an organization setting or the organization default decides.</desc>
        <defs><marker id="delegation-and-defaults-dark-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#9198a1"/></marker></defs>
        <rect x="0" y="0" width="704" height="776" fill="#07090d"/>
        <path d="M 352 96 L 352 120" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#delegation-and-defaults-dark-arrow)"/>
        <path d="M 232 176 L 144 176 A 8 8 0 0 0 136 184 L 136 280" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#delegation-and-defaults-dark-arrow)"/><rect x="144" y="222" width="46.5" height="12" rx="2" fill="#07090d"/><text x="167.25" y="231" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="8" font-weight="400">ENABLED</text>
        <path d="M 472 176 L 560 176 A 8 8 0 0 1 568 184 L 568 280" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#delegation-and-defaults-dark-arrow)"/><rect x="576" y="222" width="52" height="12" rx="2" fill="#07090d"/><text x="602.0" y="231" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="8" font-weight="400">DISABLED</text>
        <path d="M 352 232 L 352 280" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#delegation-and-defaults-dark-arrow)"/><rect x="360" y="250" width="52" height="12" rx="2" fill="#07090d"/><text x="386.0" y="259" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="8" font-weight="400">DELEGATE</text>
        <path d="M 352 352 L 352 400" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#delegation-and-defaults-dark-arrow)"/>
        <path d="M 232 456 L 144 456 A 8 8 0 0 0 136 464 L 136 560" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#delegation-and-defaults-dark-arrow)"/><rect x="144" y="502" width="24.5" height="12" rx="2" fill="#07090d"/><text x="156.25" y="511" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="8" font-weight="400">YES</text>
        <path d="M 472 456 L 560 456 A 8 8 0 0 1 568 464 L 568 560" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#delegation-and-defaults-dark-arrow)"/><rect x="576" y="502" width="19" height="12" rx="2" fill="#07090d"/><text x="585.5" y="511" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="8" font-weight="400">NO</text>
        <rect x="208" y="40" width="288" height="56" rx="20" fill="#0d1117" stroke="#9198a1" stroke-width="1.5"/>
        <text x="352.0" y="64.0" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Unconfigured GA feature</text>
        <text x="352.0" y="80.0" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Preview features are out of scope</text>
        <polygon points="352,120 472,176 352,232 232,176" fill="#0d1117" stroke="#9198a1" stroke-width="1.5"/>
        <text x="352.0" y="180.0" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Enterprise default?</text>
        <rect x="40" y="280" width="192" height="72" rx="6" fill="#0d1117" stroke="#9198a1" stroke-width="1.5"/>
        <text x="136.0" y="312.0" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Enabled everywhere</text>
        <text x="136.0" y="328.0" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Orgs cannot disable</text>
        <rect x="472" y="280" width="192" height="72" rx="6" fill="#0d1117" stroke="#9198a1" stroke-width="1.5"/>
        <text x="568.0" y="312.0" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Disabled everywhere</text>
        <text x="568.0" y="328.0" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Orgs cannot enable</text>
        <rect x="256" y="280" width="192" height="72" rx="6" fill="#0d1117" stroke="#9198a1" stroke-width="1.5"/>
        <text x="352.0" y="312.0" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Let orgs decide</text>
        <text x="352.0" y="328.0" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">If the policy supports it</text>
        <polygon points="352,400 472,456 352,512 232,456" fill="#0d1117" stroke="#9198a1" stroke-width="1.5"/>
        <text x="352.0" y="460.0" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Org configured?</text>
        <rect x="40" y="560" width="224" height="72" rx="6" fill="#0d1117" stroke="#9198a1" stroke-width="1.5"/>
        <text x="152.0" y="592.0" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Org setting applies</text>
        <text x="152.0" y="608.0" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Explicit organization choice</text>
        <rect x="440" y="560" width="224" height="72" rx="6" fill="#102219" stroke="#3fb950" stroke-width="1.5"/>
        <text x="552.0" y="592.0" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Org default applies</text>
        <text x="552.0" y="608.0" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Inherited, not explicit</text>
        <text x="40" y="676" text-anchor="start" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Documented exclusions, such as Store local sessions in the Cloud, are read directly.</text>
        <line x1="40" y1="716" x2="664" y2="716" stroke="#3d444d"/>
        <text x="40" y="740" text-anchor="start" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="9" font-weight="400">Oval: start/end; rectangle: action; diamond: decision; arrow: next step</text>
        <text x="40" y="760" text-anchor="start" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="9" font-weight="400">Green box: lesson focus, not approval or a safety rating</text>
      </svg>
