        <path d="M 224 476 L 224 524" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#feature-visibility-triage-dark-arrow)"/><rect x="232" y="492" width="19" height="12" rx="2" fill="#07090d"/><text x="241.5" y="501" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="8" font-weight="400">NO</text>
        <path d="M 352 568 L 424 568" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#feature-visibility-triage-dark-arrow)"/><rect x="370" y="550" width="24.5" height="12" rx="2" fill="#07090d"/><text x="382.25" y="559" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="8" font-weight="400">YES</text>
        <path d="M 224 612 L 224 660" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#feature-visibility-triage-dark-arrow)"/><rect x="232" y="628" width="19" height="12" rx="2" fill="#07090d"/><text x="241.5" y="637" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="8" font-weight="400">NO</text>
