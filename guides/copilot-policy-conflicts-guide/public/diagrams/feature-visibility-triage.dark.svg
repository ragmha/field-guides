        <path d="M 224 340 L 224 388" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#feature-visibility-triage-dark-arrow)"/><rect x="232" y="356" width="24.5" height="12" rx="2" fill="#07090d"/><text x="244.25" y="365" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="8" font-weight="400">YES</text>
