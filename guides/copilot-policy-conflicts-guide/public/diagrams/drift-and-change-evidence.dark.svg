<?xml version="1.0" encoding="UTF-8"?>
<svg id="drift-and-change-evidence-dark-root" viewBox="0 0 704 516" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="drift-and-change-evidence-dark-title drift-and-change-evidence-dark-desc">
        <title id="drift-and-change-evidence-dark-title">Revalidate records when inputs change</title>
        <desc id="drift-and-change-evidence-dark-desc">Review who can change policies, query Copilot audit events, compare them with each record and update records with evidence, then repeat.</desc>
        <defs><marker id="drift-and-change-evidence-dark-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#9198a1"/></marker></defs>
        <rect x="0" y="0" width="704" height="516" fill="#07090d"/>
        <path d="M 288 120 L 416 120" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#drift-and-change-evidence-dark-arrow)"/><rect x="316" y="106" width="63" height="12" rx="2" fill="#07090d"/><text x="347.5" y="115" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="8" font-weight="400">EACH CYCLE</text>
        <path d="M 540 160 L 540 264" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#drift-and-change-evidence-dark-arrow)"/>
        <path d="M 416 304 L 288 304" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#drift-and-change-evidence-dark-arrow)"/><rect x="310" y="290" width="74" height="12" rx="2" fill="#07090d"/><text x="347.0" y="299" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="8" font-weight="400">CHANGE FOUND</text>
        <path d="M 164 264 L 164 160" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#drift-and-change-evidence-dark-arrow)"/><rect x="172" y="206" width="63" height="12" rx="2" fill="#07090d"/><text x="203.5" y="215" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="8" font-weight="400">NEXT CYCLE</text>
        <rect x="40" y="80" width="248" height="80" rx="6" fill="#0d1117" stroke="#9198a1" stroke-width="1.5"/>
        <text x="164.0" y="116.0" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Review who can change</text>
        <text x="164.0" y="132.0" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Owners and AI control role holders</text>
        <rect x="416" y="80" width="248" height="80" rx="6" fill="#0d1117" stroke="#9198a1" stroke-width="1.5"/>
        <text x="540.0" y="116.0" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Query the audit log</text>
        <text x="540.0" y="132.0" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">action:copilot and seat events</text>
        <rect x="416" y="264" width="248" height="80" rx="6" fill="#102219" stroke="#3fb950" stroke-width="1.5"/>
        <text x="540.0" y="300.0" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Compare with records</text>
        <text x="540.0" y="316.0" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Did any input change?</text>
        <rect x="40" y="264" width="248" height="80" rx="6" fill="#0d1117" stroke="#9198a1" stroke-width="1.5"/>
        <text x="164.0" y="300.0" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Update the record</text>
        <text x="164.0" y="316.0" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Evidence, new result, owner told</text>
        <text x="40" y="400" text-anchor="start" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Audit events are retained 180 days; stream to a SIEM for longer history.</text>
        <text x="40" y="416" text-anchor="start" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Inherited defaults can change without an edit to the policy.</text>
        <line x1="40" y1="456" x2="664" y2="456" stroke="#3d444d"/>
        <text x="40" y="480" text-anchor="start" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="9" font-weight="400">Box: one review step; arrow: cycle order</text>
        <text x="40" y="500" text-anchor="start" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="9" font-weight="400">Green box: lesson focus, not approval or a safety rating</text>
      </svg>
