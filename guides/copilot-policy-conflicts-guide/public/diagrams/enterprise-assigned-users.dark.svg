<?xml version="1.0" encoding="UTF-8"?>
<svg id="enterprise-assigned-users-dark-root" viewBox="0 0 704 728" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="enterprise-assigned-users-dark-title enterprise-assigned-users-dark-desc">
        <title id="enterprise-assigned-users-dark-title">Which setting decides a delegated policy?</title>
        <desc id="enterprise-assigned-users-dark-desc">Fixed enterprise states apply to everyone; for a delegated policy, organization-seated users follow the organization while enterprise-assigned users follow a separate default.</desc>
        <defs><marker id="enterprise-assigned-users-dark-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#9198a1"/></marker></defs>
        <rect x="0" y="0" width="704" height="728" fill="#07090d"/>
        <path d="M 352 96 L 352 128" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#enterprise-assigned-users-dark-arrow)"/>
        <path d="M 464 184 L 560 184 A 8 8 0 0 1 568 192 L 568 288" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#enterprise-assigned-users-dark-arrow)"/><rect x="576" y="230" width="19" height="12" rx="2" fill="#07090d"/><text x="585.5" y="239" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="8" font-weight="400">NO</text>
        <path d="M 352 240 L 352 344" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#enterprise-assigned-users-dark-arrow)"/><rect x="360" y="284" width="24.5" height="12" rx="2" fill="#07090d"/><text x="372.25" y="293" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="8" font-weight="400">YES</text>
        <path d="M 240 400 L 168 400 A 8 8 0 0 0 160 408 L 160 504" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#enterprise-assigned-users-dark-arrow)"/><rect x="168" y="446" width="74" height="12" rx="2" fill="#07090d"/><text x="205.0" y="455" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="8" font-weight="400">ORGANIZATION</text>
        <path d="M 464 400 L 536 400 A 8 8 0 0 1 544 408 L 544 504" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#enterprise-assigned-users-dark-arrow)"/><rect x="552" y="446" width="63" height="12" rx="2" fill="#07090d"/><text x="583.5" y="455" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="8" font-weight="400">ENTERPRISE</text>
        <rect x="208" y="40" width="288" height="56" rx="20" fill="#0d1117" stroke="#9198a1" stroke-width="1.5"/>
        <text x="352.0" y="72.0" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Read the enterprise state</text>
        <polygon points="352,128 464,184 352,240 240,184" fill="#0d1117" stroke="#9198a1" stroke-width="1.5"/>
        <text x="352.0" y="188.0" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Delegated?</text>
        <rect x="472" y="288" width="192" height="72" rx="6" fill="#0d1117" stroke="#9198a1" stroke-width="1.5"/>
        <text x="568.0" y="320.0" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Enterprise state applies</text>
        <text x="568.0" y="336.0" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Fixed for all licensed users</text>
        <polygon points="352,344 464,400 352,456 240,400" fill="#0d1117" stroke="#9198a1" stroke-width="1.5"/>
        <text x="352.0" y="404.0" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Seat source?</text>
        <rect x="40" y="504" width="240" height="72" rx="6" fill="#0d1117" stroke="#9198a1" stroke-width="1.5"/>
        <text x="160.0" y="536.0" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Organization setting</text>
        <text x="160.0" y="552.0" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Or its default if unconfigured</text>
        <rect x="424" y="504" width="240" height="72" rx="6" fill="#102219" stroke="#3fb950" stroke-width="1.5"/>
        <text x="544.0" y="536.0" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Enterprise-assigned default</text>
        <text x="544.0" y="552.0" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Policies for enterprise-assigned users</text>
        <text x="40" y="620" text-anchor="start" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Removed from an assigned enterprise team: access lasts to the end of the billing cycle.</text>
        <text x="40" y="636" text-anchor="start" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">A user seated both ways has two inputs; list each source.</text>
        <line x1="40" y1="668" x2="664" y2="668" stroke="#3d444d"/>
        <text x="40" y="692" text-anchor="start" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="9" font-weight="400">Oval: start/end; rectangle: action; diamond: decision; arrow: next step</text>
        <text x="40" y="712" text-anchor="start" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="9" font-weight="400">Green box: lesson focus, not approval or a safety rating</text>
      </svg>
