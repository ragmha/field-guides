<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Does the model default apply?</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif; background: #07090d; color: #f0f6fc; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 704px; min-width: 0; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow { font-size: .66rem; color: #9198a1; margin-bottom: .5rem; }
    h1 { font-size: 1.75rem; line-height: 1.15; margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 704px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Copilot Policy Conflicts · Flowchart</p>
    <h1>Does the model default apply?</h1>
    <div class="diagram-container" tabindex="0" role="region" aria-label="Does the model default apply?. Scroll horizontally to explore.">
      <svg viewBox="0 0 704 668" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="model-availability-triage-dark-title model-availability-triage-dark-desc">
        <title id="model-availability-triage-dark-title">Does the model default apply?</title>
        <desc id="model-availability-triage-dark-desc">Enterprise teams mode replaces organization model settings; otherwise the model status decides whether the default availability for released models applies.</desc>
        <defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#9198a1"/></marker></defs>
        <rect x="0" y="0" width="704" height="668" fill="#07090d"/>
        <path d="M 320 96 L 400 96" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="342" y="78" width="24.5" height="12" rx="2" fill="#07090d"/><text x="354.25" y="87" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="8" font-weight="400">YES</text>
        <path d="M 200 144 L 200 308" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="208" y="216" width="19" height="12" rx="2" fill="#07090d"/><text x="217.5" y="225" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="8" font-weight="400">NO</text>
        <path d="M 320 364 L 352 364 A 8 8 0 0 0 360 356 L 360 240 A 8 8 0 0 1 368 232 L 400 232" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#arrow)"/>
        <path d="M 320 364 L 352 364 A 8 8 0 0 0 360 356 L 360 328 A 8 8 0 0 1 368 320 L 400 320" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#arrow)"/>
        <path d="M 320 364 L 352 364 A 8 8 0 0 1 360 372 L 360 400 A 8 8 0 0 0 368 408 L 400 408" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#arrow)"/>
        <path d="M 320 364 L 352 364 A 8 8 0 0 1 360 372 L 360 488 A 8 8 0 0 0 368 496 L 400 496" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#arrow)"/>
        <polygon points="200,48 320,96 200,144 80,96" fill="#0d1117" stroke="#9198a1" stroke-width="1.5"/>
        <text x="200.0" y="100.0" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Teams mode on?</text>
        <rect x="400" y="64" width="264" height="64" rx="6" fill="#0d1117" stroke="#9198a1" stroke-width="1.5"/>
        <text x="532.0" y="92.0" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Teams mode rules</text>
        <text x="532.0" y="108.0" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Additive below the enterprise baseline</text>
        <polygon points="200,308 320,364 200,420 80,364" fill="#0d1117" stroke="#9198a1" stroke-width="1.5"/>
        <text x="200.0" y="368.0" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Model status?</text>
        <rect x="400" y="200" width="264" height="64" rx="6" fill="#0d1117" stroke="#9198a1" stroke-width="1.5"/>
        <text x="532.0" y="228.0" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Enabled or Disabled</text>
        <text x="532.0" y="244.0" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Explicit; default does not apply</text>
        <rect x="400" y="288" width="264" height="64" rx="6" fill="#102219" stroke="#3fb950" stroke-width="1.5"/>
        <text x="532.0" y="316.0" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Delegate to default policy</text>
        <text x="532.0" y="332.0" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Follows the released-model default</text>
        <rect x="400" y="376" width="264" height="64" rx="6" fill="#0d1117" stroke="#9198a1" stroke-width="1.5"/>
        <text x="532.0" y="404.0" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Unconfigured</text>
        <text x="532.0" y="420.0" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Does not follow the default</text>
        <rect x="400" y="464" width="264" height="64" rx="6" fill="#0d1117" stroke="#9198a1" stroke-width="1.5"/>
        <text x="532.0" y="492.0" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Delegate to organizations</text>
        <text x="532.0" y="508.0" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Org default where not configured</text>
        <text x="40" y="568" text-anchor="start" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Pre-GA, open-weight and some other models are out of scope and disabled by default.</text>
        <line x1="40" y1="608" x2="664" y2="608" stroke="#3d444d"/>
        <text x="40" y="632" text-anchor="start" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="9" font-weight="400">Oval: start/end; rectangle: action; diamond: decision; arrow: next step</text>
        <text x="40" y="652" text-anchor="start" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="9" font-weight="400">Green box: lesson focus, not approval or a safety rating</text>
      </svg>
    </div>
  </div>

</html>
