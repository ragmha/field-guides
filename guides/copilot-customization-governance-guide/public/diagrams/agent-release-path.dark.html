<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Release a custom agent in stages</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif; background: #07090d; color: #f0f6fc; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 704px; min-width: 0; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow { font-size: .66rem; color: #9198a1; margin-bottom: .5rem; }
    h1 { font-size: 1.75rem; line-height: 1.15; margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 704px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Copilot Customization Governance · Timeline</p>
    <h1>Release a custom agent in stages</h1>
    <div class="diagram-container" tabindex="0" role="region" aria-label="Release a custom agent in stages. Scroll horizontally to explore.">
      <svg viewBox="0 0 704 424" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="agent-release-path-dark-title agent-release-path-dark-desc">
        <title id="agent-release-path-dark-title">Release a custom agent in stages</title>
        <desc id="agent-release-path-dark-desc">Draft a profile, test it privately in .github/agents, release it by moving it to agents/, and track each version by commit SHA.</desc>
        <defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#9198a1"/></marker></defs>
        <rect x="0" y="0" width="704" height="424" fill="#07090d"/>
        <path d="M 40 96 L 664 96" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#arrow)"/>
        <text x="109" y="76" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">STEP 1</text>,<circle cx="109" cy="96" r="6" fill="#0d1117" stroke="#9198a1" stroke-width="1.5"/>,<line x1="109" y1="102" x2="109" y2="136" stroke="#9198a1" stroke-width="1.5"/>,<rect x="40" y="136" width="138" height="96" rx="6" fill="#0d1117" stroke="#9198a1" stroke-width="1.5"/>
        <text x="109" y="172" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Draft profile</text>
        <text x="109" y="188" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Name, tools, model</text>
        <text x="109" y="204" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">in a reviewed PR</text>
        <text x="271" y="76" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">STEP 2</text>,<circle cx="271" cy="96" r="6" fill="#0d1117" stroke="#9198a1" stroke-width="1.5"/>,<line x1="271" y1="102" x2="271" y2="136" stroke="#9198a1" stroke-width="1.5"/>,<rect x="202" y="136" width="138" height="96" rx="6" fill="#0d1117" stroke="#9198a1" stroke-width="1.5"/>
        <text x="271" y="164" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Test privately</text>
        <text x="271" y="180" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">.github/agents in the</text>
        <text x="271" y="196" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">.github-private repo</text>
        <text x="271" y="212" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Agents tab sessions</text>
        <text x="433" y="76" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">STEP 3</text>,<circle cx="433" cy="96" r="6" fill="#0d1117" stroke="#9198a1" stroke-width="1.5"/>,<line x1="433" y1="102" x2="433" y2="136" stroke="#9198a1" stroke-width="1.5"/>,<rect x="364" y="136" width="138" height="96" rx="6" fill="#102219" stroke="#3fb950" stroke-width="1.5"/>
        <text x="433" y="164" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Release</text>
        <text x="433" y="180" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Move profile to the</text>
        <text x="433" y="196" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">top-level agents/</text>
        <text x="433" y="212" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">directory and merge</text>
        <text x="595" y="76" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">STEP 4</text>,<circle cx="595" cy="96" r="6" fill="#0d1117" stroke="#9198a1" stroke-width="1.5"/>,<line x1="595" y1="102" x2="595" y2="136" stroke="#9198a1" stroke-width="1.5"/>,<rect x="526" y="136" width="138" height="96" rx="6" fill="#0d1117" stroke="#9198a1" stroke-width="1.5"/>
        <text x="595" y="164" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Track and roll back</text>
        <text x="595" y="180" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Commit SHA is the</text>
        <text x="595" y="196" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">version; a reviewed</text>
        <text x="595" y="212" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">revert rolls back</text>
        <text x="40" y="276" text-anchor="start" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Pull requests keep the agent version used when the task was assigned.</text>
        <text x="40" y="296" text-anchor="start" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Organization and enterprise custom agents are in public preview.</text>
        <line x1="40" y1="364" x2="664" y2="364" stroke="#3d444d"/>
        <text x="40" y="388" text-anchor="start" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="9" font-weight="400">Line: release order; circle: milestone; box: what happens at that step</text>
        <text x="40" y="408" text-anchor="start" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="9" font-weight="400">Green box: lesson focus, not approval or a safety rating</text>
      </svg>
    </div>
  </div>
</body>
</html>
