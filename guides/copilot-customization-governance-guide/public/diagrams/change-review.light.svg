<?xml version="1.0" encoding="UTF-8"?>
<svg id="change-review-light-root" viewBox="0 0 704 684" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="change-review-light-title change-review-light-desc">
        <title id="change-review-light-title">Review a customization change</title>
        <desc id="change-review-light-desc">A branch edits a customization, a human owner reviews it, and only merged changes reach the default branch before you verify each surface.</desc>
        <defs><marker id="change-review-light-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#59636e"/></marker></defs>
        <rect x="0" y="0" width="704" height="684" fill="#f3f5f7"/>
        <path d="M 352 104 L 352 128" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#change-review-light-arrow)"/>
        <path d="M 352 192 L 352 216" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#change-review-light-arrow)"/>
        <path d="M 352 328 L 352 368" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#change-review-light-arrow)"/><rect x="360" y="342" width="24.5" height="12" rx="2" fill="#f3f5f7"/><text x="372.25" y="351" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="8" font-weight="400">YES</text>
        <path d="M 464 272 L 580 272 L 580 368" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#change-review-light-arrow)"/><rect x="588" y="312" width="19" height="12" rx="2" fill="#f3f5f7"/><text x="597.5" y="321" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="8" font-weight="400">NO</text>
        <path d="M 352 432 L 352 472" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#change-review-light-arrow)"/>
        <rect x="208" y="40" width="288" height="64" rx="20" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <text x="352" y="68" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Branch edits a customization</text>
        <text x="352" y="84" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Instructions, agent profile or skill</text>
        <rect x="208" y="128" width="288" height="64" rx="6" fill="#eaf6ed" stroke="#1a7f37" stroke-width="1.5"/>
        <text x="352" y="156" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Human owner reviews the PR</text>
        <text x="352" y="172" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Copilot code review reads the head branch</text>
        <polygon points="352,216 464,272 352,328 240,272" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <text x="352" y="276" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Approved?</text>
        <rect x="232" y="368" width="240" height="64" rx="6" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <text x="352" y="396" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Merge to the default branch</text>
        <text x="352" y="412" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Agent profiles appear after merge</text>
        <rect x="496" y="368" width="168" height="64" rx="6" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <text x="580" y="396" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Revise or close</text>
        <text x="580" y="412" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Delete the branch</text>
        <rect x="208" y="472" width="288" height="64" rx="20" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <text x="352" y="500" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Verify on each surface</text>
        <text x="352" y="516" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">CLI: resume or start a new session</text>
        <text x="40" y="576" text-anchor="start" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Guide advice: treat Copilot review of the same pull request as advisory.</text>
        <line x1="40" y1="624" x2="664" y2="624" stroke="#d1d9e0"/>
        <text x="40" y="648" text-anchor="start" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="9" font-weight="400">Oval: start/end; rectangle: action; diamond: decision; arrow: next step</text>
        <text x="40" y="668" text-anchor="start" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="9" font-weight="400">Green box: lesson focus, not approval or a safety rating</text>
      </svg>
