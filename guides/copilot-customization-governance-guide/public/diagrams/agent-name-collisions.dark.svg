<?xml version="1.0" encoding="UTF-8"?>
<svg id="agent-name-collisions-dark-root" viewBox="0 0 704 664" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="agent-name-collisions-dark-title agent-name-collisions-dark-desc">
        <title id="agent-name-collisions-dark-title">Predict which agent wins</title>
        <desc id="agent-name-collisions-dark-desc">When agent profiles share a filename, the repository agent wins over the organization agent, which wins over the enterprise agent.</desc>
        <defs><marker id="agent-name-collisions-dark-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#9198a1"/></marker></defs>
        <rect x="0" y="0" width="704" height="664" fill="#07090d"/>
        <path d="M 232 96 L 232 128" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#agent-name-collisions-dark-arrow)"/>
        <path d="M 344 184 L 440 184" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#agent-name-collisions-dark-arrow)"/><rect x="360" y="168" width="24.5" height="12" rx="2" fill="#07090d"/><text x="372.25" y="177" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="8" font-weight="400">YES</text>
        <path d="M 232 240 L 232 280" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#agent-name-collisions-dark-arrow)"/><rect x="240" y="254" width="19" height="12" rx="2" fill="#07090d"/><text x="249.5" y="263" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="8" font-weight="400">NO</text>
        <path d="M 344 336 L 440 336" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#agent-name-collisions-dark-arrow)"/><rect x="360" y="320" width="24.5" height="12" rx="2" fill="#07090d"/><text x="372.25" y="329" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="8" font-weight="400">YES</text>
        <path d="M 232 392 L 232 432" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#agent-name-collisions-dark-arrow)"/><rect x="240" y="406" width="19" height="12" rx="2" fill="#07090d"/><text x="249.5" y="415" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="8" font-weight="400">NO</text>
        <rect x="88" y="40" width="288" height="56" rx="20" fill="#0d1117" stroke="#9198a1" stroke-width="1.5"/>
        <text x="232" y="72" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Same filename at several levels</text>
        <polygon points="232,128 344,184 232,240 120,184" fill="#0d1117" stroke="#9198a1" stroke-width="1.5"/>
        <text x="232" y="188" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">In repository?</text>
        <rect x="440" y="152" width="224" height="64" rx="6" fill="#102219" stroke="#3fb950" stroke-width="1.5"/>
        <text x="552" y="180" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Repository agent applies</text>
        <text x="552" y="196" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Lowest level wins</text>
        <polygon points="232,280 344,336 232,392 120,336" fill="#0d1117" stroke="#9198a1" stroke-width="1.5"/>
        <text x="232" y="340" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">In organization?</text>
        <rect x="440" y="304" width="224" height="64" rx="6" fill="#0d1117" stroke="#9198a1" stroke-width="1.5"/>
        <text x="552" y="332" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Organization agent applies</text>
        <text x="552" y="348" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Overrides the enterprise profile</text>
        <rect x="120" y="432" width="224" height="64" rx="20" fill="#0d1117" stroke="#9198a1" stroke-width="1.5"/>
        <text x="232" y="460" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Enterprise agent applies</text>
        <text x="232" y="476" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">A reserved prefix avoids shadowing</text>
        <text x="40" y="536" text-anchor="start" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Profiles are deduplicated by filename; compare tools and model fields.</text>
        <text x="40" y="556" text-anchor="start" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">An omitted tools field means all tools; an empty list means none.</text>
        <line x1="40" y1="604" x2="664" y2="604" stroke="#3d444d"/>
        <text x="40" y="628" text-anchor="start" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="9" font-weight="400">Oval: start/end; rectangle: outcome; diamond: decision; arrow: next step</text>
        <text x="40" y="648" text-anchor="start" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="9" font-weight="400">Green box: lesson focus, not approval or a safety rating</text>
      </svg>
