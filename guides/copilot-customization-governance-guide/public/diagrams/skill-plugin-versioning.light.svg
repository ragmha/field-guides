<?xml version="1.0" encoding="UTF-8"?>
<svg id="skill-plugin-versioning-light-root" viewBox="0 0 704 532" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="skill-plugin-versioning-light-title skill-plugin-versioning-light-desc">
        <title id="skill-plugin-versioning-light-title">Version skills and plugins</title>
        <desc id="skill-plugin-versioning-light-desc">Preview a skill, install it at a reviewed tag or SHA, update deliberately because pinned skills are skipped, and keep plugin and marketplace names stable.</desc>
        <defs><marker id="skill-plugin-versioning-light-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#59636e"/></marker></defs>
        <rect x="0" y="0" width="704" height="532" fill="#f3f5f7"/>
        <path d="M 304 76 L 400 76" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#skill-plugin-versioning-light-arrow)"/>
        <path d="M 532 112 L 532 208" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#skill-plugin-versioning-light-arrow)"/>
        <path d="M 400 244 L 304 244" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#skill-plugin-versioning-light-arrow)"/>
        <path d="M 172 208 L 172 112" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#skill-plugin-versioning-light-arrow)"/>
        <rect x="40" y="40" width="264" height="72" rx="6" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <text x="172" y="72" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Preview</text>
        <text x="172" y="88" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">gh skill preview; read every file</text>
        <rect x="400" y="40" width="264" height="72" rx="6" fill="#eaf6ed" stroke="#1a7f37" stroke-width="1.5"/>
        <text x="532" y="72" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Install at a tag or SHA</text>
        <text x="532" y="88" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Provenance written to frontmatter</text>
        <rect x="400" y="208" width="264" height="72" rx="6" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <text x="532" y="240" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Update deliberately</text>
        <text x="532" y="256" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">gh skill update skips pinned skills</text>
        <rect x="40" y="208" width="264" height="72" rx="6" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <text x="172" y="240" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Review the next version</text>
        <text x="172" y="256" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Reinstall after review; repeat</text>
        <rect x="40" y="320" width="624" height="64" rx="6" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <text x="352" y="348" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Plugins: versioned by their marketplace</text>
        <text x="352" y="364" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">IDs use PLUGIN-NAME@MARKETPLACE-NAME, so keep both names stable</text>
        <text x="40" y="424" text-anchor="start" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">gh skill is in public preview and requires GitHub CLI 2.90.0 or later.</text>
        <line x1="40" y1="472" x2="664" y2="472" stroke="#d1d9e0"/>
        <text x="40" y="496" text-anchor="start" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="9" font-weight="400">Box: lifecycle step; arrow: next step in the skill cycle</text>
        <text x="40" y="516" text-anchor="start" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="9" font-weight="400">Green box: lesson focus, not approval or a safety rating</text>
      </svg>
