<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 704 832" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="policy-scope-dark-title policy-scope-dark-desc" id="policy-scope-dark-root">
        <title id="policy-scope-dark-title">Find the policy source</title>
        <desc id="policy-scope-dark-desc">Trace the seat source, check delegated defaults or feature-specific organization conflicts, then confirm the setting on the actual surface.</desc>
        <defs>
      <style>#policy-scope-dark-root { font-family: -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif; color: #f0f6fc; }
      #policy-scope-dark-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#policy-scope-dark-root .diagram-container { overflow-x: visible; }
}</style><marker id="policy-scope-dark-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#9198a1"/></marker></defs>
        <rect x="0" y="0" width="704" height="832" fill="#07090d"/>
        <path d="M 240 96 L 192 96 A 8 8 0 0 0 184 104 L 184 220" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#policy-scope-dark-arrow)"/><rect x="192" y="162" width="63" height="12" rx="2" fill="#07090d"/><text x="223.5" y="171" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="8" font-weight="400">ENTERPRISE</text>
        <path d="M 464 96 L 512 96 A 8 8 0 0 1 520 104 L 520 220" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#policy-scope-dark-arrow)"/><rect x="528" y="162" width="74" height="12" rx="2" fill="#07090d"/><text x="565.0" y="171" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="8" font-weight="400">ORGANIZATION</text>
        <path d="M 184 300 L 184 548" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#policy-scope-dark-arrow)"/>
        <path d="M 520 332 L 520 412" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#policy-scope-dark-arrow)"/><rect x="528" y="364" width="24.5" height="12" rx="2" fill="#07090d"/><text x="540.25" y="373" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="8" font-weight="400">YES</text>
        <path d="M 400 276 L 360 276 A 8 8 0 0 0 352 284 L 352 564 A 8 8 0 0 1 344 572 L 328 572" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#policy-scope-dark-arrow)"/><rect x="360" y="376" width="19" height="12" rx="2" fill="#07090d"/><text x="369.5" y="385" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="8" font-weight="400">NO</text>
        <path d="M 520 508 L 520 644 A 8 8 0 0 1 512 652 L 192 652 A 8 8 0 0 1 184 644 L 184 628" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#policy-scope-dark-arrow)"/>
        <polygon points="352,40 464,96 352,152 240,96" fill="#102219" stroke="#3fb950" stroke-width="1.5"/>
        <text x="352.0" y="100.0" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Seat source?</text>
        <rect x="40" y="220" width="288" height="80" rx="6" fill="#0d1117" stroke="#9198a1" stroke-width="1.5"/>
        <text x="184.0" y="256.0" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Enterprise-assigned users</text>
        <text x="184.0" y="272.0" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Check their separate delegated-policy default</text>
        <polygon points="520,220 640,276 520,332 400,276" fill="#0d1117" stroke="#9198a1" stroke-width="1.5"/>
        <text x="520.0" y="272.0" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Licensing orgs</text>
        <text x="520.0" y="288.0" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="400">disagree?</text>
        <rect x="376" y="412" width="288" height="96" rx="6" fill="#0d1117" stroke="#9198a1" stroke-width="1.5"/>
        <text x="520.0" y="448.0" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Use the feature&#x27;s conflict rule</text>
        <text x="520.0" y="464.0" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Usually least restrictive; exceptions apply</text>
        <text x="520.0" y="480.0" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Public-code matching: most restrictive</text>
        <rect x="40" y="548" width="288" height="80" rx="20" fill="#0d1117" stroke="#9198a1" stroke-width="1.5"/>
        <text x="184.0" y="584.0" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Confirm on the actual surface</text>
        <text x="184.0" y="600.0" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Prediction is not an effective-setting test</text>
        <text x="40" y="708" text-anchor="start" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Across enterprises: most restrictive almost always applies, with exceptions.</text>
        <text x="40" y="724" text-anchor="start" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Check the specific policy; neither summary is a universal algorithm.</text>
        <line x1="40" y1="772" x2="664" y2="772" stroke="#3d444d"/>
        <text x="40" y="796" text-anchor="start" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="9" font-weight="400">Oval: start/end; rectangle: action; diamond: decision; arrow: next step</text>
        <text x="40" y="816" text-anchor="start" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="9" font-weight="400">Green box: lesson focus, not approval or a safety rating</text>
      </svg>
