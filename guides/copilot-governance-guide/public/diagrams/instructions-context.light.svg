<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 704 792" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="instructions-context-light-title instructions-context-light-desc" id="instructions-context-light-root">
        <title id="instructions-context-light-title">Improve guidance through review</title>
        <desc id="instructions-context-light-desc">Choose a supported instruction scope, write task-relevant guidance and rerun a fresh-session task, refining it when the response lacks matching execution evidence.</desc>
        <defs>
      <style>#instructions-context-light-root { font-family: -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif; color: #1f2328; }
      #instructions-context-light-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#instructions-context-light-root .diagram-container { overflow-x: visible; }
}</style><marker id="instructions-context-light-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#59636e"/></marker></defs>
        <rect x="0" y="0" width="704" height="792" fill="#f3f5f7"/>
        <path d="M 352 120 L 352 160" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#instructions-context-light-arrow)"/>
        <path d="M 352 224 L 352 272" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#instructions-context-light-arrow)"/>
        <path d="M 352 336 L 352 384" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#instructions-context-light-arrow)"/>
        <path d="M 464 440 L 560 440 A 8 8 0 0 1 568 448 L 568 556" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#instructions-context-light-arrow)"/><rect x="576" y="490" width="24.5" height="12" rx="2" fill="#f3f5f7"/><text x="588.25" y="499" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="8" font-weight="400">YES</text>
        <path d="M 240 440 L 144 440 A 8 8 0 0 0 136 448 L 136 556" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#instructions-context-light-arrow)"/><rect x="144" y="490" width="19" height="12" rx="2" fill="#f3f5f7"/><text x="153.5" y="499" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="8" font-weight="400">NO</text>
        <path d="M 40 596 L 32 596 A 8 8 0 0 1 24 588 L 24 200 A 8 8 0 0 1 32 192 L 192 192" fill="none" stroke="#59636e" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#instructions-context-light-arrow)"/><rect x="87.5" y="172" width="41" height="12" rx="2" fill="#f3f5f7"/><text x="108" y="181" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="8" font-weight="400">REFINE</text>
        <rect x="192" y="40" width="320" height="80" rx="6" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <text x="352.0" y="68.0" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Choose scope for the audience</text>
        <text x="352.0" y="84.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Personal, repository or organization</text>
        <text x="352.0" y="100.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Support varies by client and feature</text>
        <rect x="192" y="160" width="320" height="64" rx="6" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <text x="352.0" y="188.0" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Write task-relevant guidance</text>
        <text x="352.0" y="204.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Avoid conflicting instructions</text>
        <rect x="192" y="272" width="320" height="64" rx="6" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <text x="352.0" y="300.0" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Repeat the task in a fresh session</text>
        <text x="352.0" y="316.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Compare the response with actual test output</text>
        <polygon points="352,384 464,440 352,496 240,440" fill="#eaf6ed" stroke="#1a7f37" stroke-width="1.5"/>
        <text x="352.0" y="436.0" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Matches actual</text>
        <text x="352.0" y="452.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="400">test output?</text>
        <rect x="472" y="556" width="192" height="80" rx="20" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <text x="568.0" y="592.0" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Keep with human review</text>
        <text x="568.0" y="608.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">One comparison is no guarantee</text>
        <rect x="40" y="556" width="192" height="80" rx="6" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <text x="136.0" y="592.0" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Refine guidance</text>
        <text x="136.0" y="608.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">A command alone is not execution</text>
        <text x="40" y="684" text-anchor="start" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Instructions are non-deterministic: they are not permissions or review.</text>
        <line x1="40" y1="732" x2="664" y2="732" stroke="#d1d9e0"/>
        <text x="40" y="756" text-anchor="start" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="9" font-weight="400">Rectangle: action; diamond: decision; oval: outcome; dashed arrow: refinement</text>
        <text x="40" y="776" text-anchor="start" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="9" font-weight="400">Green box: lesson focus, not approval or a safety rating</text>
      </svg>
