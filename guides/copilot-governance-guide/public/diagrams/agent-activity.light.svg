<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 704 824" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="agent-activity-light-title agent-activity-light-desc" id="agent-activity-light-root">
        <title id="agent-activity-light-title">Choose evidence with care</title>
        <desc id="agent-activity-light-desc">Use sufficient existing session or audit evidence first; otherwise assess optional collection and preview eligibility, minimize capture and propose privacy controls before any change.</desc>
        <defs>
      <style>#agent-activity-light-root { font-family: -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif; color: #1f2328; }
      #agent-activity-light-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#agent-activity-light-root .diagram-container { overflow-x: visible; }
}</style><marker id="agent-activity-light-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#59636e"/></marker></defs>
        <rect x="0" y="0" width="704" height="824" fill="#f3f5f7"/>
        <path d="M 352 112 L 464 112" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#agent-activity-light-arrow)"/><rect x="395.75" y="92" width="24.5" height="12" rx="2" fill="#f3f5f7"/><text x="408" y="101" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="8" font-weight="400">YES</text>
        <path d="M 224 184 L 224 252" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#agent-activity-light-arrow)"/><rect x="232" y="210" width="19" height="12" rx="2" fill="#f3f5f7"/><text x="241.5" y="219" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="8" font-weight="400">NO</text>
        <path d="M 224 364 L 224 412" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#agent-activity-light-arrow)"/>
        <path d="M 224 508 L 224 556" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#agent-activity-light-arrow)"/>
        <polygon points="224,40 352,112 224,184 96,112" fill="#eaf6ed" stroke="#1a7f37" stroke-width="1.5"/>
        <text x="224.0" y="108.0" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Existing record</text>
        <text x="224.0" y="124.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="400">answers it?</text>
        <rect x="464" y="72" width="200" height="80" rx="20" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <text x="564.0" y="108.0" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Use it; note coverage</text>
        <text x="564.0" y="124.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Session view or audit record</text>
        <rect x="64" y="252" width="320" height="112" rx="6" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <text x="224.0" y="280.0" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Evaluate optional collection</text>
        <text x="224.0" y="296.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Telemetry; session audit streaming</text>
        <text x="224.0" y="312.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Streaming: EMU or GHE Cloud data residency</text>
        <text x="224.0" y="328.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Public preview: use with caution</text>
        <text x="224.0" y="344.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Confirm actual surface and eligibility</text>
        <rect x="64" y="412" width="320" height="96" rx="6" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <text x="224.0" y="448.0" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Choose minimum capture classes</text>
        <text x="224.0" y="464.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Defaults false; prompts and tool content</text>
        <text x="224.0" y="480.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">exceed this question&#x27;s needs</text>
        <rect x="64" y="556" width="320" height="96" rx="20" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <text x="224.0" y="592.0" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Propose access and retention controls</text>
        <text x="224.0" y="608.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Consult privacy stakeholders before changes</text>
        <text x="224.0" y="624.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">This is an evidence plan, not configuration</text>
        <text x="40" y="700" text-anchor="start" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Identity capture still identifies the Copilot account, OS user and machine.</text>
        <text x="40" y="716" text-anchor="start" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">A record alone does not establish authorization or a change&#x27;s outcome.</text>
        <line x1="40" y1="764" x2="664" y2="764" stroke="#d1d9e0"/>
        <text x="40" y="788" text-anchor="start" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="9" font-weight="400">Oval: start/end; rectangle: action; diamond: decision; arrow: next step</text>
        <text x="40" y="808" text-anchor="start" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="9" font-weight="400">Green box: lesson focus, not approval or a safety rating</text>
      </svg>
