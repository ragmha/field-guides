<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 704 740" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="adoption-measurement-dark-title adoption-measurement-dark-desc" id="adoption-measurement-dark-root">
        <title id="adoption-measurement-dark-title">Count distinct users, not summed totals</title>
        <desc id="adoption-measurement-dark-desc">In the fictional completed period, organizations with 8 and 7 active users overlap by 3, yielding 12 distinct active users out of 20 assigned licenses, or 60%.</desc>
        <defs>
      <style>#adoption-measurement-dark-root { font-family: -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif; color: #f0f6fc; }
      #adoption-measurement-dark-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#adoption-measurement-dark-root .diagram-container { overflow-x: visible; }
}</style><marker id="adoption-measurement-dark-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#9198a1"/></marker></defs>
        <rect x="0" y="0" width="704" height="740" fill="#07090d"/>
        <circle cx="264" cy="248" r="152" fill="#f0f6fc" fill-opacity="0.04" stroke="#9198a1"/>
        <circle cx="424" cy="248" r="144" fill="#9198a1" fill-opacity="0.05" stroke="#9198a1"/>
        <text x="208" y="68" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="14" font-weight="600">Organization A · 8</text>
        <text x="504" y="68" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="14" font-weight="600">Organization B · 7</text>
        <text x="212" y="252" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">5 only in A</text>
        <text x="348" y="244" text-anchor="middle" fill="#3fb950" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">3 in both</text>
        <text x="348" y="264" text-anchor="middle" fill="#3fb950" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">counted twice</text>
        <text x="488" y="252" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">4 only in B</text>
        <text x="352" y="448" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">8 + 7 = 15 is not the distinct count</text>
        <text x="352" y="480" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">15 - 3 = 12 distinct active users</text>
        <text x="352" y="512" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="14" font-weight="600">12 / 20 assigned licenses = 60%</text>
        <text x="40" y="568" text-anchor="start" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Use the license denominator for the completed period and defined population.</text>
        <text x="40" y="584" text-anchor="start" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Wait two full UTC days after a day closes; check metric/surface coverage.</text>
        <text x="40" y="632" text-anchor="start" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Higher throughput is association, not proof that Copilot caused the change.</text>
        <line x1="40" y1="680" x2="664" y2="680" stroke="#3d444d"/>
        <text x="40" y="704" text-anchor="start" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="9" font-weight="400">Circles: organization sets; overlap: shared people; green label: focus; areas approximate</text>
        <text x="40" y="724" text-anchor="start" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="9" font-weight="400">Green box: lesson focus, not approval or a safety rating</text>
      </svg>
