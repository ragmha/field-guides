<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 704 1016" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="consumption-controls-light-title consumption-controls-light-desc" id="consumption-controls-light-root">
        <title id="consumption-controls-light-title">Find the actual limit</title>
        <desc id="consumption-controls-light-desc">Resolve the first applicable user-level budget by specificity; its hard stop precedes independent included-usage and metered controls.</desc>
        <defs>
      <style>#consumption-controls-light-root { font-family: -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif; color: #1f2328; }
      #consumption-controls-light-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#consumption-controls-light-root .diagram-container { overflow-x: visible; }
}</style><marker id="consumption-controls-light-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#59636e"/></marker></defs>
        <rect x="0" y="0" width="704" height="1016" fill="#f3f5f7"/>
        <path d="M 232 88 L 232 128" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#consumption-controls-light-arrow)"/>
        <path d="M 232 224 L 232 264" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#consumption-controls-light-arrow)"/>
        <path d="M 344 320 L 472 320" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#consumption-controls-light-arrow)"/><rect x="395.75" y="300" width="24.5" height="12" rx="2" fill="#f3f5f7"/><text x="408" y="309" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="8" font-weight="400">YES</text>
        <path d="M 232 376 L 232 432" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#consumption-controls-light-arrow)"/><rect x="240" y="396" width="19" height="12" rx="2" fill="#f3f5f7"/><text x="249.5" y="405" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="8" font-weight="400">NO</text>
        <path d="M 344 488 L 472 488" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#consumption-controls-light-arrow)"/><rect x="395.75" y="468" width="24.5" height="12" rx="2" fill="#f3f5f7"/><text x="408" y="477" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="8" font-weight="400">YES</text>
        <path d="M 232 544 L 232 600" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#consumption-controls-light-arrow)"/><rect x="240" y="564" width="19" height="12" rx="2" fill="#f3f5f7"/><text x="249.5" y="573" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="8" font-weight="400">NO</text>
        <path d="M 344 656 L 472 656" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#consumption-controls-light-arrow)"/><rect x="395.75" y="636" width="24.5" height="12" rx="2" fill="#f3f5f7"/><text x="408" y="645" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="8" font-weight="400">YES</text>
        <path d="M 232 712 L 232 780" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#consumption-controls-light-arrow)"/><rect x="240" y="740" width="19" height="12" rx="2" fill="#f3f5f7"/><text x="249.5" y="749" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="8" font-weight="400">NO</text>
        <rect x="72" y="40" width="320" height="48" rx="20" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <text x="232.0" y="68.0" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Credit-consuming request</text>
        <rect x="72" y="128" width="320" height="96" rx="6" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <text x="232.0" y="164.0" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Resolve the applicable ULB</text>
        <text x="232.0" y="180.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Individual &gt; cost-center &gt; universal</text>
        <text x="232.0" y="196.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">First configured wins, not smallest amount</text>
        <polygon points="232,264 344,320 232,376 120,320" fill="#eaf6ed" stroke="#1a7f37" stroke-width="1.5"/>
        <text x="232.0" y="316.0" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">ULB</text>
        <text x="232.0" y="332.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="400">exhausted?</text>
        <rect x="472" y="280" width="192" height="80" rx="20" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <text x="568.0" y="308.0" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Hard stop</text>
        <text x="568.0" y="324.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Pool or metered headroom</text>
        <text x="568.0" y="340.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">cannot override it</text>
        <polygon points="232,432 344,488 232,544 120,488" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <text x="232.0" y="484.0" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Included</text>
        <text x="232.0" y="500.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="400">phase?</text>
        <rect x="472" y="448" width="192" height="80" rx="20" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <text x="568.0" y="476.0" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Included controls</text>
        <text x="568.0" y="492.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Shared pool and cost-center</text>
        <text x="568.0" y="508.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">included-usage control</text>
        <polygon points="232,600 344,656 232,712 120,656" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <text x="232.0" y="652.0" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Metered use</text>
        <text x="232.0" y="668.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="400">permitted?</text>
        <rect x="472" y="616" width="192" height="80" rx="20" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <text x="568.0" y="644.0" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Metered use</text>
        <text x="568.0" y="660.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Paid-usage policy permits;</text>
        <text x="568.0" y="676.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">no enforced limit blocks</text>
        <rect x="72" y="780" width="320" height="64" rx="20" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <text x="232.0" y="808.0" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Metered use blocked</text>
        <text x="232.0" y="824.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Paid policy or applicable enforced limit</text>
        <text x="40" y="892" text-anchor="start" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Metered spending limits enforce a stop only when configured to do so.</text>
        <text x="40" y="908" text-anchor="start" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">These independent controls apply after the ULB permits the request.</text>
        <line x1="40" y1="956" x2="664" y2="956" stroke="#d1d9e0"/>
        <text x="40" y="980" text-anchor="start" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="9" font-weight="400">Oval: start/end; rectangle: action; diamond: decision; arrow: next step</text>
        <text x="40" y="1000" text-anchor="start" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="9" font-weight="400">Green box: lesson focus, not approval or a safety rating</text>
      </svg>
