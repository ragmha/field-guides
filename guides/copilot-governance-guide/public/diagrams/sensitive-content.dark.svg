<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 704 812" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sensitive-content-dark-title sensitive-content-dark-desc" id="sensitive-content-dark-root">
        <title id="sensitive-content-dark-title">Use complementary protections</title>
        <desc id="sensitive-content-dark-desc">Supported content exclusions leave access gaps, so independently restrict repository and filesystem access and review external tools, while retaining explicit residual risk.</desc>
        <defs>
      <style>#sensitive-content-dark-root { font-family: -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif; color: #f0f6fc; }
      #sensitive-content-dark-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#sensitive-content-dark-root .diagram-container { overflow-x: visible; }
}</style><marker id="sensitive-content-dark-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#9198a1"/></marker></defs>
        <rect x="0" y="0" width="704" height="812" fill="#07090d"/>
        <path d="M 40 100 L 40 572" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#sensitive-content-dark-arrow)"/>
        <path d="M 368 172 L 368 196" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#sensitive-content-dark-arrow)"/>
        <path d="M 368 252 L 368 300" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#sensitive-content-dark-arrow)"/>
        <path d="M 368 372 L 368 400" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#sensitive-content-dark-arrow)"/>
        <path d="M 368 444 L 368 500" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#sensitive-content-dark-arrow)"/>
        <path d="M 368 572 L 368 600" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#sensitive-content-dark-arrow)"/>
        <text x="40" y="52" text-anchor="start" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">RISK: a sensitive file reaches Copilot or a connected tool</text>
        <text x="92" y="216" text-anchor="start" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">ESCAPES: unsupported client/mode; indirect access, third-party MCP,</text>
        <text x="92" y="232" text-anchor="start" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">symlinks and remote filesystems. Access still needs independent restriction.</text>
        <text x="92" y="424" text-anchor="start" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">RESIDUAL: an external tool can have its own access.</text>
        <text x="92" y="624" text-anchor="start" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">RESIDUAL: review and a proposed exclusion are not proof of enforcement.</text>
        <rect x="72" y="100" width="592" height="72" rx="6" fill="#0d1117" stroke="#9198a1" stroke-width="1.5"/>
        <text x="368.0" y="132.0" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">L1 · Content exclusion on supported experiences</text>
        <text x="368.0" y="148.0" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Mitigation: exclude paths; check the matrix for the actual client and mode</text>
        <rect x="72" y="300" width="592" height="72" rx="6" fill="#102219" stroke="#3fb950" stroke-width="1.5"/>
        <text x="368.0" y="332.0" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">L2 · Independent repository and OS/filesystem restrictions</text>
        <text x="368.0" y="348.0" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Mitigation: restrict who and what can read the sensitive material</text>
        <rect x="72" y="500" width="592" height="72" rx="6" fill="#0d1117" stroke="#9198a1" stroke-width="1.5"/>
        <text x="368.0" y="532.0" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">L3 · Review third-party tool access separately</text>
        <text x="368.0" y="548.0" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Mitigation: inspect the external tool&#x27;s own access</text>
        <text x="40" y="688" text-anchor="start" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Final residual: exclusion is not a filesystem security boundary.</text>
        <text x="40" y="704" text-anchor="start" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">An entry is a proposal, not proof it was saved or enforced; obtain authorized evidence.</text>
        <line x1="40" y1="752" x2="664" y2="752" stroke="#3d444d"/>
        <text x="40" y="776" text-anchor="start" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="9" font-weight="400">Bands: compensating layers; arrows: residual exposure, not proof of enforcement</text>
        <text x="40" y="796" text-anchor="start" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="9" font-weight="400">Green box: lesson focus, not approval or a safety rating</text>
      </svg>
