<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 704 968" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="budget-scenario-light-title budget-scenario-light-desc" id="budget-scenario-light-root">
        <title id="budget-scenario-light-title">Two independent budget stops</title>
        <desc id="budget-scenario-light-desc">The worked example stops at the exhausted individual $15 ULB; the variant has ULB headroom but stops at an enforced metered limit.</desc>
        <defs>
      <style>#budget-scenario-light-root { font-family: -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif; color: #1f2328; }
      #budget-scenario-light-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#budget-scenario-light-root .diagram-container { overflow-x: visible; }
}</style><marker id="budget-scenario-light-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#59636e"/></marker></defs>
        <rect x="0" y="0" width="704" height="968" fill="#f3f5f7"/>
        <path d="M 72 216 L 48 216 A 8 8 0 0 0 40 224 L 40 732 A 8 8 0 0 0 48 740 L 72 740" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#budget-scenario-light-arrow)"/>
        <path d="M 512 280 L 512 336" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#budget-scenario-light-arrow)"/>
        <path d="M 512 464 L 512 504" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#budget-scenario-light-arrow)"/>
        <path d="M 512 632 L 512 700" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#budget-scenario-light-arrow)"/>
        <text x="192" y="52" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="14" font-weight="600">A · worked example</text>
        <text x="512" y="52" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="14" font-weight="600">B · metered variant</text>
        <text x="192" y="76" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Individual ULB $15; consumed $15</text>
        <text x="512" y="76" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">ULB has headroom; metered limit enforced</text>
        <text x="352" y="120" text-anchor="middle" fill="#1a7f37" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="600">FIRST DIVERGENCE: ULB HEADROOM</text>
        <polygon points="192,152 312,216 192,280 72,216" fill="#eaf6ed" stroke="#1a7f37" stroke-width="1.5"/>
        <text x="192.0" y="212.0" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">ULB headroom</text>
        <text x="192.0" y="228.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="400">FAIL [X]</text>
        <polygon points="512,152 632,216 512,280 392,216" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <text x="512.0" y="212.0" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">ULB headroom</text>
        <text x="512.0" y="228.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="400">PASS [+]</text>
        <rect x="72" y="352" width="240" height="96" rx="6" fill="#ffffff" stroke="#59636e" stroke-width="1.5" stroke-dasharray="5,4"/>
        <text x="192.0" y="396.0" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Metered phase</text>
        <text x="192.0" y="412.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">NOT REACHED [-]</text>
        <polygon points="512,336 632,400 512,464 392,400" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <text x="512.0" y="396.0" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Metered phase</text>
        <text x="512.0" y="412.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="400">PASS [+]</text>
        <rect x="72" y="520" width="240" height="96" rx="6" fill="#ffffff" stroke="#59636e" stroke-width="1.5" stroke-dasharray="5,4"/>
        <text x="192.0" y="564.0" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Metered headroom</text>
        <text x="192.0" y="580.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">NOT REACHED [-]</text>
        <polygon points="512,504 632,568 512,632 392,568" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <text x="512.0" y="564.0" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Metered headroom</text>
        <text x="512.0" y="580.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="400">FAIL [X]</text>
        <rect x="72" y="700" width="240" height="80" rx="20" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <text x="192.0" y="736.0" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Blocked by ULB</text>
        <text x="192.0" y="752.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Pool and metered headroom do not help</text>
        <rect x="392" y="700" width="240" height="80" rx="20" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <text x="512.0" y="736.0" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Metered use blocked</text>
        <text x="512.0" y="752.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Independent enforced-limit stop</text>
        <text x="40" y="828" text-anchor="start" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">A stops at the ULB: dashed cells are context, not a continued trace.</text>
        <text x="40" y="844" text-anchor="start" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">B states no included-pool condition; none is inferred here.</text>
        <text x="40" y="860" text-anchor="start" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">PASS means the condition holds, not approval; B&#x27;s metered limit is enforced.</text>
        <line x1="40" y1="908" x2="664" y2="908" stroke="#d1d9e0"/>
        <text x="40" y="932" text-anchor="start" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="9" font-weight="400">Diamond: evaluated rule; dashed box: not reached; oval: outcome; arrow: trace</text>
        <text x="40" y="952" text-anchor="start" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="9" font-weight="400">Green box: lesson focus, not approval or a safety rating</text>
      </svg>
