<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 704 736" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="billing-ownership-dark-title billing-ownership-dark-desc" id="billing-ownership-dark-root">
        <title id="billing-ownership-dark-title">Route a budget alert</title>
        <desc id="billing-ownership-dark-desc">In the hypothetical pilot, the platform team owns seats, finance retains metered-spending approval authority and names an alert responder to investigate alerts.</desc>
        <defs>
      <style>#billing-ownership-dark-root { font-family: -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif; color: #f0f6fc; }
      #billing-ownership-dark-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#billing-ownership-dark-root .diagram-container { overflow-x: visible; }
}</style><marker id="billing-ownership-dark-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#9198a1"/></marker></defs>
        <rect x="0" y="0" width="704" height="736" fill="#07090d"/>
        <path d="M 296 104 L 296 144 A 8 8 0 0 1 288 152 L 192 152 A 8 8 0 0 0 184 160 L 184 204" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#billing-ownership-dark-arrow)"/>
        <path d="M 408 104 L 408 128 A 8 8 0 0 0 416 136 L 512 136 A 8 8 0 0 1 520 144 L 520 204" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#billing-ownership-dark-arrow)"/>
        <path d="M 520 300 L 520 400" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#billing-ownership-dark-arrow)"/>
        <rect x="192" y="40" width="320" height="64" rx="6" fill="#0d1117" stroke="#9198a1" stroke-width="1.5"/>
        <text x="352.0" y="68.0" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Hypothetical Copilot Business pilot</text>
        <text x="352.0" y="84.0" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Route the budget alert</text>
        <rect x="40" y="204" width="288" height="96" rx="6" fill="#0d1117" stroke="#9198a1" stroke-width="1.5"/>
        <text x="184.0" y="248.0" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Platform team</text>
        <text x="184.0" y="264.0" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Owns and maintains seat assignment</text>
        <rect x="376" y="204" width="288" height="96" rx="6" fill="#0d1117" stroke="#9198a1" stroke-width="1.5"/>
        <text x="520.0" y="240.0" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Finance</text>
        <text x="520.0" y="256.0" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Approves metered spending</text>
        <text x="520.0" y="272.0" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Keeps approval authority; names responder</text>
        <rect x="376" y="400" width="288" height="96" rx="6" fill="#102219" stroke="#3fb950" stroke-width="1.5"/>
        <text x="520.0" y="436.0" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Named alert responder</text>
        <text x="520.0" y="452.0" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Investigates budget alerts</text>
        <text x="520.0" y="468.0" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Name must be recorded by finance</text>
        <text x="40" y="548" text-anchor="start" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Approval gate: route proposed changes through the organization&#x27;s approval process.</text>
        <text x="40" y="564" text-anchor="start" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">A forecast is not approval; the metered budget does not cap license fees.</text>
        <text x="40" y="612" text-anchor="start" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Alert-only threshold: it can be crossed while charges continue.</text>
        <text x="40" y="628" text-anchor="start" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Naming owners does not configure a threshold or approve more spending.</text>
        <line x1="40" y1="676" x2="664" y2="676" stroke="#3d444d"/>
        <text x="40" y="700" text-anchor="start" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="9" font-weight="400">Boxes: responsibilities; arrows: ownership/routing, not spending authorization</text>
        <text x="40" y="720" text-anchor="start" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="9" font-weight="400">Green box: lesson focus, not approval or a safety rating</text>
      </svg>
