        <path d="M 352 604 L 352 728" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#model-feature-baseline-light-arrow)"/>
        <path d="M 568 604 L 568 640 A 8 8 0 0 1 560 648 L 440 648 A 8 8 0 0 0 432 656 L 432 728" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#model-feature-baseline-light-arrow)"/>
        <path d="M 664 316 L 672 316 A 8 8 0 0 1 680 324 L 680 760 A 8 8 0 0 1 672 768 L 512 768" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#model-feature-baseline-light-arrow)"/>
