<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 704 1100" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="model-feature-baseline-light-title model-feature-baseline-light-desc" id="model-feature-baseline-light-root">
        <title id="model-feature-baseline-light-title">Review availability before rollout</title>
        <desc id="model-feature-baseline-light-desc">Record separate unconfigured GA defaults for models and features, check model release status and restrictions, then make an explicit decision and verify the eligible user's experience.</desc>
        <defs>
      <style>#model-feature-baseline-light-root { font-family: -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif; color: #1f2328; }
      #model-feature-baseline-light-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#model-feature-baseline-light-root .diagram-container { overflow-x: visible; }
}</style><marker id="model-feature-baseline-light-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#59636e"/></marker></defs>
        <rect x="0" y="0" width="704" height="1100" fill="#f3f5f7"/>
