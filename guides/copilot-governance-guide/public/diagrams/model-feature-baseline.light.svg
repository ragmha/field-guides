        <path d="M 352 316 L 400 316 A 8 8 0 0 1 408 324 L 408 444 A 8 8 0 0 0 416 452 L 560 452 A 8 8 0 0 1 568 460 L 568 492" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#model-feature-baseline-light-arrow)"/><rect x="416" y="392" width="85" height="12" rx="2" fill="#f3f5f7"/><text x="458.5" y="401" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="8" font-weight="400">PREVIEW/EXCEPT</text>
