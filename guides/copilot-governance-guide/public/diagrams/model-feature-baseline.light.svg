        <path d="M 96 316 L 72 316 A 8 8 0 0 0 64 324 L 64 444 A 8 8 0 0 0 72 452 L 128 452 A 8 8 0 0 1 136 460 L 136 492" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#model-feature-baseline-light-arrow)"/><rect x="72" y="392" width="63" height="12" rx="2" fill="#f3f5f7"/><text x="103.5" y="401" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="8" font-weight="400">UNVERIFIED</text>
