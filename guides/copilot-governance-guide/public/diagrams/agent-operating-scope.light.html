<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bound an agent rollout</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif; background: #f3f5f7; color: #1f2328; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 704px; min-width: 0; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow { font-size: .66rem; color: #59636e; margin-bottom: .5rem; }
    h1 { font-size: 1.75rem; line-height: 1.15; margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 704px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Governance guide · Flowchart</p>
    <h1>Bound an agent rollout</h1>
    <div class="diagram-container" tabindex="0" role="region" aria-label="Bound an agent rollout. Scroll horizontally to explore.">
      <svg viewBox="0 0 704 788" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="agent-operating-scope-light-title agent-operating-scope-light-desc">
        <title id="agent-operating-scope-light-title">Bound an agent rollout</title>
        <desc id="agent-operating-scope-light-desc">Cloud policy and repository exclusion bound the pilot; repository write access then separates read-only sessions from proposed changes subject to checks and human review.</desc>
        <defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#59636e"/></marker></defs>
        <rect x="0" y="0" width="704" height="788" fill="#f3f5f7"/>
        <path d="M 352 112 L 472 112" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="402.5" y="92" width="19" height="12" rx="2" fill="#f3f5f7"/><text x="412" y="101" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="8" font-weight="400">NO</text>
        <path d="M 224 184 L 224 252" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="232" y="210" width="24.5" height="12" rx="2" fill="#f3f5f7"/><text x="244.25" y="219" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="8" font-weight="400">YES</text>
        <path d="M 336 308 L 472 308" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="394.5" y="288" width="19" height="12" rx="2" fill="#f3f5f7"/><text x="404" y="297" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="8" font-weight="400">NO</text>
        <path d="M 224 364 L 224 432" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="232" y="390" width="24.5" height="12" rx="2" fill="#f3f5f7"/><text x="244.25" y="399" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="8" font-weight="400">YES</text>
        <path d="M 224 496 L 224 536" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#arrow)"/>
        <polygon points="224,40 352,112 224,184 96,112" fill="#eaf6ed" stroke="#1a7f37" stroke-width="1.5"/>
        <text x="224.0" y="108.0" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Org covered; repo</text>
        <text x="224.0" y="124.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="400">not blocked?</text>
        <rect x="472" y="72" width="192" height="80" rx="20" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <text x="568.0" y="116.0" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Excluded from pilot</text>
        <polygon points="224,252 336,308 224,364 112,308" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <text x="224.0" y="312.0" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Write access?</text>
        <rect x="472" y="268" width="192" height="80" rx="20" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <text x="568.0" y="312.0" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Read-only session</text>
        <rect x="64" y="432" width="320" height="64" rx="6" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <text x="224.0" y="468.0" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Propose a non-sensitive test change</text>
        <rect x="64" y="536" width="320" height="80" rx="20" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <text x="224.0" y="572.0" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Repository checks and human review</text>
        <text x="224.0" y="588.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Policy does not grant write access</text>
        <text x="40" y="664" text-anchor="start" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Cloud sandboxes, Actions-based and remote environments differ.</text>
        <text x="40" y="680" text-anchor="start" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Check the actual environment, protections and applicable settings.</text>
        <line x1="40" y1="728" x2="664" y2="728" stroke="#d1d9e0"/>
        <text x="40" y="752" text-anchor="start" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="9" font-weight="400">Oval: start/end; rectangle: action; diamond: decision; arrow: next step</text>
        <text x="40" y="772" text-anchor="start" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="9" font-weight="400">Green box: lesson focus, not approval or a safety rating</text>
      </svg>
    </div>
  </div>
