<?xml version="1.0" encoding="UTF-8"?>
<svg id="policy-delegation-light-root" viewBox="0 0 704 556" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="policy-delegation-light-title policy-delegation-light-desc">
        <title id="policy-delegation-light-title">How a policy is delegated</title>
        <desc id="policy-delegation-light-desc">An enterprise enables, disables or delegates a policy; only delegated policies let organization owners choose, and conflicts follow the reference.</desc>
        <defs><marker id="policy-delegation-light-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#59636e"/></marker></defs>
        <rect x="0" y="0" width="704" height="556" fill="#f3f5f7"/>
        <rect x="232" y="40" width="240" height="56" rx="8" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <text x="352.0" y="64.0" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Enterprise policy</text>
        <text x="352.0" y="80.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Set by an enterprise owner or AI manager</text>
        <path d="M 280 96 L 280 120 L 128 120 L 128 152" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#policy-delegation-light-arrow)"/>
        <path d="M 352 96 L 352 152" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#policy-delegation-light-arrow)"/>
        <path d="M 424 96 L 424 120 L 576 120 L 576 152" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#policy-delegation-light-arrow)"/>
        <rect x="40" y="152" width="176" height="64" rx="8" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <text x="128.0" y="180.0" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Enabled</text>
        <text x="128.0" y="196.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">On for all organizations</text>
        <rect x="264" y="152" width="176" height="64" rx="8" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <text x="352.0" y="180.0" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Disabled</text>
        <text x="352.0" y="196.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Off for all organizations</text>
        <rect x="488" y="152" width="176" height="64" rx="8" fill="#eaf6ed" stroke="#1a7f37" stroke-width="1.5"/>
        <text x="576.0" y="180.0" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Let organizations decide</text>
        <text x="576.0" y="196.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Delegated to owners</text>
        <path d="M 128 216 L 128 272" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#policy-delegation-light-arrow)"/>
        <path d="M 352 216 L 352 272" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#policy-delegation-light-arrow)"/>
        <rect x="40" y="272" width="400" height="56" rx="8" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <text x="240.0" y="296.0" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Organizations cannot change it</text>
        <text x="240.0" y="312.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Applies to every organization in the enterprise</text>
        <path d="M 576 216 L 576 272" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#policy-delegation-light-arrow)"/>
        <rect x="488" y="272" width="176" height="56" rx="8" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <text x="576.0" y="296.0" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Org owner sets it</text>
        <text x="576.0" y="312.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Per organization</text>
        <path d="M 576 328 L 576 392" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#policy-delegation-light-arrow)"/>
        <rect x="584.25" y="355" width="79.5" height="12" rx="2" fill="#f3f5f7"/>
        <text x="624" y="364" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="8" font-weight="400">ORGS DISAGREE</text>
        <rect x="488" y="392" width="176" height="64" rx="8" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <text x="576.0" y="412.0" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Conflict reference</text>
        <text x="576.0" y="428.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Usually least restrictive</text>
        <text x="576.0" y="444.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Exceptions are listed</text>
        <text x="40" y="380" text-anchor="start" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="600">ALSO SET AT ENTERPRISE LEVEL</text>
        <rect x="40" y="392" width="400" height="64" rx="8" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <text x="240.0" y="420.0" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Default availability policies</text>
        <text x="240.0" y="436.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Decide whether unconfigured GA features and models are on</text>
        <line x1="40" y1="488" x2="664" y2="488" stroke="#d1d9e0"/>
        <text x="40" y="512" text-anchor="start" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="9" font-weight="400">Rectangle: a policy state or result; arrow: what follows</text>
        <text x="40" y="532" text-anchor="start" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="9" font-weight="400">Green box: lesson focus, not approval or a safety rating</text>
      </svg>
