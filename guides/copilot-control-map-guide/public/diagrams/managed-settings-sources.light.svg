<?xml version="1.0" encoding="UTF-8"?>
<svg id="managed-settings-sources-light-root" viewBox="0 0 704 588" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="managed-settings-sources-light-title managed-settings-sources-light-desc">
        <title id="managed-settings-sources-light-title">Managed settings precedence</title>
        <desc id="managed-settings-sources-light-desc">Device management outranks the server file, which outranks the local file and user settings, while deny rules win across every source.</desc>
        <defs><marker id="managed-settings-sources-light-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#59636e"/></marker></defs>
        <rect x="0" y="0" width="704" height="588" fill="#f3f5f7"/>
        <text x="40" y="52" text-anchor="start" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="600">HIGHEST PRECEDENCE</text>
        <rect x="40" y="64" width="300" height="60" rx="8" fill="#eaf6ed" stroke="#1a7f37" stroke-width="1.5"/>
        <text x="190.0" y="90.0" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Device management</text>
        <text x="190.0" y="106.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">MDM profile or policy</text>
        <text x="364" y="98" text-anchor="start" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Anyone on the managed device</text>
        <path d="M 120 124 L 120 148" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#managed-settings-sources-light-arrow)"/>
        <rect x="80" y="148" width="300" height="60" rx="8" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <text x="230.0" y="174.0" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Server-managed file</text>
        <text x="230.0" y="190.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">In the .github-private repository</text>
        <text x="404" y="174" text-anchor="start" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Licensed users in all clients</text>
        <text x="404" y="190" text-anchor="start" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">including Copilot in the cloud</text>
        <path d="M 160 208 L 160 232" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#managed-settings-sources-light-arrow)"/>
        <rect x="120" y="232" width="300" height="60" rx="8" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <text x="270.0" y="258.0" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Local system file</text>
        <text x="270.0" y="274.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Fixed path on the machine</text>
        <text x="444" y="266" text-anchor="start" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Anyone using that machine</text>
        <path d="M 200 292 L 200 316" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#managed-settings-sources-light-arrow)"/>
        <rect x="160" y="316" width="300" height="60" rx="8" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <text x="310.0" y="342.0" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">User settings</text>
        <text x="310.0" y="358.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Set by the developer</text>
        <text x="484" y="350" text-anchor="start" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">One user only</text>
        <text x="160" y="396" text-anchor="start" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="600">LOWEST PRECEDENCE</text>
        <rect x="40" y="424" width="624" height="64" rx="8" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <text x="352.0" y="452.0" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Permission rules combine across sources</text>
        <text x="352.0" y="468.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Deny wins over ask, and ask wins over allow, whatever the source</text>
        <line x1="40" y1="520" x2="664" y2="520" stroke="#d1d9e0"/>
        <text x="40" y="544" text-anchor="start" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="9" font-weight="400">Step: a settings source, highest first; right: who the source reaches</text>
        <text x="40" y="564" text-anchor="start" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="9" font-weight="400">Green box: lesson focus, not approval or a safety rating</text>
      </svg>
