<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Repository guardrails stack</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif; background: #07090d; color: #f0f6fc; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 704px; min-width: 0; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow { font-size: .66rem; color: #9198a1; margin-bottom: .5rem; }
    h1 { font-size: 1.75rem; line-height: 1.15; margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 704px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Copilot Control Map · Guardrail layers</p>
    <h1>Repository guardrails stack</h1>
    <div class="diagram-container" tabindex="0" role="region" aria-label="Repository guardrails stack. Scroll horizontally to explore.">
      <svg viewBox="0 0 704 604" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="repository-guardrails-dark-title repository-guardrails-dark-desc">
        <title id="repository-guardrails-dark-title">Repository guardrails stack</title>
        <desc id="repository-guardrails-dark-desc">Enterprise, organization and repository rulesets add up around Copilot pull requests, whose workflows wait for approval by default.</desc>
        <defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#9198a1"/></marker></defs>
        <rect x="0" y="0" width="704" height="604" fill="#07090d"/>
        <rect x="40" y="40" width="624" height="360" rx="8" fill="#0d1117" stroke="#9198a1" stroke-width="1.5"/>
        <text x="56" y="62" text-anchor="start" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="600">ENTERPRISE RULESET</text>
        <text x="648" y="62" text-anchor="end" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Baseline for every repository</text>
        <rect x="72" y="80" width="560" height="300" rx="8" fill="#0d1117" stroke="#9198a1" stroke-width="1.5"/>
        <text x="88" y="102" text-anchor="start" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="600">ORGANIZATION RULESETS</text>
        <text x="616" y="102" text-anchor="end" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Add rules; cannot override the baseline</text>
        <rect x="104" y="120" width="496" height="240" rx="8" fill="#0d1117" stroke="#9198a1" stroke-width="1.5"/>
        <text x="120" y="142" text-anchor="start" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="600">REPOSITORY RULESETS</text>
        <text x="584" y="142" text-anchor="end" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Plus CODEOWNERS review</text>
        <rect x="136" y="160" width="432" height="180" rx="8" fill="#102219" stroke="#3fb950" stroke-width="1.5"/>
        <text x="352.0" y="222.0" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Copilot pull request</text>
        <text x="352.0" y="238.0" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Cannot push to the default branch</text>
        <text x="352.0" y="254.0" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Cannot merge its own pull request</text>
        <text x="352.0" y="270.0" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Workflows wait for approval by default</text>
        <text x="352.0" y="286.0" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Rulesets apply as to any contributor</text>
        <text x="40" y="436" text-anchor="start" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="600">ALSO SET AT ORGANIZATION OR REPOSITORY LEVEL</text>
        <rect x="40" y="448" width="192" height="56" rx="8" fill="#0d1117" stroke="#9198a1" stroke-width="1.5"/>
        <text x="136.0" y="472.0" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Agent secrets</text>
        <text x="136.0" y="488.0" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Org or repo variables</text>
        <rect x="256" y="448" width="192" height="56" rx="8" fill="#0d1117" stroke="#9198a1" stroke-width="1.5"/>
        <text x="352.0" y="472.0" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Runners</text>
        <text x="352.0" y="488.0" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Prefer hosted or ephemeral</text>
        <rect x="472" y="448" width="192" height="56" rx="8" fill="#0d1117" stroke="#9198a1" stroke-width="1.5"/>
        <text x="568.0" y="472.0" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Agent firewall</text>
        <text x="568.0" y="488.0" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Org setting, may delegate</text>
        <line x1="40" y1="536" x2="664" y2="536" stroke="#3d444d"/>
        <text x="40" y="560" text-anchor="start" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="9" font-weight="400">Ring: a rule layer that adds to the one outside it; box: a separate repository control</text>
        <text x="40" y="580" text-anchor="start" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="9" font-weight="400">Green box: lesson focus, not approval or a safety rating</text>
      </svg>
    </div>
  </div>
</body>
</html>
