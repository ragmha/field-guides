<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Match signals to questions</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif; background: #07090d; color: #f0f6fc; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 704px; min-width: 0; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow { font-size: .66rem; color: #9198a1; margin-bottom: .5rem; }
    h1 { font-size: 1.75rem; line-height: 1.15; margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 704px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Copilot Control Map · Signal map</p>
    <h1>Match signals to questions</h1>
    <div class="diagram-container" tabindex="0" role="region" aria-label="Match signals to questions. Scroll horizontally to explore.">
      <svg viewBox="0 0 704 596" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="metrics-signals-dark-title metrics-signals-dark-desc">
        <title id="metrics-signals-dark-title">Match signals to questions</title>
        <desc id="metrics-signals-dark-desc">Usage metrics, the audit log, OpenTelemetry and budget alerts each answer different evidence questions, and organization totals overlap.</desc>
        <defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#9198a1"/></marker></defs>
        <rect x="0" y="0" width="704" height="596" fill="#07090d"/>
        <text x="40" y="52" text-anchor="start" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="600">EVIDENCE QUESTION</text>
        <text x="416" y="52" text-anchor="start" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="600">SIGNAL</text>
        <rect x="40" y="64" width="248" height="48" rx="8" fill="#0d1117" stroke="#9198a1" stroke-width="1.5"/>
        <text x="164.0" y="92.0" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Is the feature being used?</text>
        <path d="M 288 88 L 416 88" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#arrow)"/>
        <rect x="40" y="136" width="248" height="48" rx="8" fill="#0d1117" stroke="#9198a1" stroke-width="1.5"/>
        <text x="164.0" y="164.0" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Did the model restriction land?</text>
        <path d="M 288 160 L 416 160" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#arrow)"/>
        <rect x="40" y="208" width="248" height="48" rx="8" fill="#0d1117" stroke="#9198a1" stroke-width="1.5"/>
        <text x="164.0" y="236.0" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Who changed the policy?</text>
        <path d="M 288 232 L 416 232" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#arrow)"/>
        <rect x="40" y="280" width="248" height="48" rx="8" fill="#0d1117" stroke="#9198a1" stroke-width="1.5"/>
        <text x="164.0" y="308.0" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">What did a local agent run?</text>
        <path d="M 288 304 L 416 304" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#arrow)"/>
        <rect x="40" y="352" width="248" height="48" rx="8" fill="#0d1117" stroke="#9198a1" stroke-width="1.5"/>
        <text x="164.0" y="380.0" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Who is near the budget?</text>
        <path d="M 288 376 L 416 376" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#arrow)"/>
        <rect x="416" y="64" width="248" height="120" rx="8" fill="#102219" stroke="#3fb950" stroke-width="1.5"/>
        <text x="540.0" y="112.0" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Usage metrics</text>
        <text x="540.0" y="128.0" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Dashboard and API</text>
        <text x="540.0" y="144.0" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Two full UTC days of delay</text>
        <rect x="416" y="208" width="248" height="48" rx="8" fill="#0d1117" stroke="#9198a1" stroke-width="1.5"/>
        <text x="540.0" y="228.0" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Audit log</text>
        <text x="540.0" y="244.0" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">action:copilot, 180 days</text>
        <rect x="416" y="280" width="248" height="48" rx="8" fill="#0d1117" stroke="#9198a1" stroke-width="1.5"/>
        <text x="540.0" y="300.0" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">OpenTelemetry</text>
        <text x="540.0" y="316.0" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Managed settings telemetry key</text>
        <rect x="416" y="352" width="248" height="48" rx="8" fill="#0d1117" stroke="#9198a1" stroke-width="1.5"/>
        <text x="540.0" y="372.0" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Budget alerts</text>
        <text x="540.0" y="388.0" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Billing settings</text>
        <rect x="40" y="432" width="624" height="64" rx="8" fill="#0d1117" stroke="#9198a1" stroke-width="1.5"/>
        <text x="352.0" y="460.0" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Read metrics as effects, not settings</text>
        <text x="352.0" y="476.0" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Organization totals overlap, so do not add them up</text>
        <line x1="40" y1="528" x2="664" y2="528" stroke="#3d444d"/>
        <text x="40" y="552" text-anchor="start" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="9" font-weight="400">Left: a question an auditor asks; right: the signal that answers it; arrow: use</text>
        <text x="40" y="572" text-anchor="start" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="9" font-weight="400">Green box: lesson focus, not approval or a safety rating</text>
      </svg>
    </div>
  </div>
</body>
</html>
