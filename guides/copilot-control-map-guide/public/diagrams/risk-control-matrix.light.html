<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Map risks to controls</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif; background: #f3f5f7; color: #1f2328; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 704px; min-width: 0; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow { font-size: .66rem; color: #59636e; margin-bottom: .5rem; }
    h1 { font-size: 1.75rem; line-height: 1.15; margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 704px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Copilot Control Map · Matrix</p>
    <h1>Map risks to controls</h1>
    <div class="diagram-container" tabindex="0" role="region" aria-label="Map risks to controls. Scroll horizontally to explore.">
      <svg viewBox="0 0 704 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="risk-control-matrix-light-title risk-control-matrix-light-desc">
        <title id="risk-control-matrix-light-title">Map risks to controls</title>
        <desc id="risk-control-matrix-light-desc">Each risk row marks its primary and supporting layers, and an empty row shows a gap that needs a control or an accepted risk.</desc>
        <defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#59636e"/></marker></defs>
        <rect x="0" y="0" width="704" height="512" fill="#f3f5f7"/>
        <text x="48" y="60" text-anchor="start" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="600">RISK</text>
        <text x="270" y="60" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="600">Policy</text>
        <text x="330" y="60" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="600">Repo</text>
        <text x="390" y="60" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="600">Managed</text>
        <text x="450" y="60" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="600">Network</text>
        <text x="510" y="60" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="600">Exclude</text>
        <text x="570" y="60" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="600">Billing</text>
        <text x="630" y="60" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="600">Evidence</text>
        <rect x="40" y="72" width="624" height="308" rx="4" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <rect x="40" y="336" width="624" height="44" rx="4" fill="#eaf6ed" stroke="#1a7f37" stroke-width="1.5"/>
        <line x1="240" y1="72" x2="240" y2="336" stroke="#d1d9e0"/>
        <line x1="300" y1="72" x2="300" y2="336" stroke="#d1d9e0"/>
        <line x1="360" y1="72" x2="360" y2="336" stroke="#d1d9e0"/>
        <line x1="420" y1="72" x2="420" y2="336" stroke="#d1d9e0"/>
        <line x1="480" y1="72" x2="480" y2="336" stroke="#d1d9e0"/>
        <line x1="540" y1="72" x2="540" y2="336" stroke="#d1d9e0"/>
        <line x1="600" y1="72" x2="600" y2="336" stroke="#d1d9e0"/>
        <text x="56" y="98" text-anchor="start" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Unapproved MCP server</text>
        <circle cx="270" cy="94" r="6" fill="#1f2328"/>
        <circle cx="390" cy="94" r="6" fill="#1f2328"/>
        <circle cx="630" cy="94" r="6" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <line x1="40" y1="116" x2="664" y2="116" stroke="#d1d9e0"/>
        <text x="56" y="142" text-anchor="start" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Sensitive files as context</text>
        <circle cx="510" cy="138" r="6" fill="#1f2328"/>
        <circle cx="630" cy="138" r="6" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <line x1="40" y1="160" x2="664" y2="160" stroke="#d1d9e0"/>
        <text x="56" y="186" text-anchor="start" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Runaway metered spend</text>
        <circle cx="570" cy="182" r="6" fill="#1f2328"/>
        <circle cx="270" cy="182" r="6" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <circle cx="630" cy="182" r="6" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <line x1="40" y1="204" x2="664" y2="204" stroke="#d1d9e0"/>
        <text x="56" y="230" text-anchor="start" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Unreviewed agent changes</text>
        <circle cx="330" cy="226" r="6" fill="#1f2328"/>
        <circle cx="270" cy="226" r="6" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <circle cx="630" cy="226" r="6" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <line x1="40" y1="248" x2="664" y2="248" stroke="#d1d9e0"/>
        <text x="56" y="274" text-anchor="start" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Personal plan use</text>
        <circle cx="450" cy="270" r="6" fill="#1f2328"/>
        <line x1="40" y1="292" x2="664" y2="292" stroke="#d1d9e0"/>
        <text x="56" y="318" text-anchor="start" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Untracked local activity</text>
        <circle cx="390" cy="314" r="6" fill="#1f2328"/>
        <circle cx="630" cy="314" r="6" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <text x="56" y="362" text-anchor="start" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">New risk: no layer yet</text>
        <text x="40" y="412" text-anchor="start" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">An empty row needs a new control or an owner who accepts the risk.</text>
        <line x1="40" y1="444" x2="664" y2="444" stroke="#d1d9e0"/>
        <text x="40" y="468" text-anchor="start" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="9" font-weight="400">Filled dot: primary control; hollow dot: supporting control or evidence</text>
        <text x="40" y="488" text-anchor="start" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="9" font-weight="400">Green row: lesson focus, not approval or a safety rating</text>
      </svg>
    </div>
  </div>
</body>
</html>
