<?xml version="1.0" encoding="UTF-8"?>
<svg id="session-vs-audit-log-dark-root" viewBox="0 0 704 604" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="session-vs-audit-log-dark-title session-vs-audit-log-dark-desc">
        <title id="session-vs-audit-log-dark-title">Session record or audit event?</title>
        <desc id="session-vs-audit-log-dark-desc">Session records hold content and belong to the user; audit events record actions for administrators. The agent session ID connects an event to its session.</desc>
        <defs><marker id="session-vs-audit-log-dark-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#9198a1"/></marker></defs>
        <rect x="0" y="0" width="704" height="604" fill="#07090d"/>
        <path d="M 520 384 L 520 416 L 184 416 L 184 386" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#session-vs-audit-log-dark-arrow)"/><rect x="245.7" y="411" width="212.7" height="12" rx="2" fill="#07090d"/><text x="352" y="420" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="8" font-weight="400">AGENT_SESSION_ID LINKS EVENT TO SESSION</text>
        <rect x="40" y="40" width="288" height="56" rx="6" fill="#102219" stroke="#3fb950" stroke-width="1.5"/>
        <text x="184.0" y="64.0" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Session record</text>
        <text x="184.0" y="80.0" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">The user&#x27;s working history</text>
        <rect x="376" y="40" width="288" height="56" rx="6" fill="#0d1117" stroke="#9198a1" stroke-width="1.5"/>
        <text x="520.0" y="64.0" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Audit log event</text>
        <text x="520.0" y="80.0" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Enterprise accountability record</text>
        <rect x="40" y="120" width="288" height="48" rx="6" fill="#0d1117" stroke="#9198a1" stroke-width="1.5"/>
        <text x="184.0" y="140.0" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Prompts, responses, tools, changes</text>
        <text x="184.0" y="156.0" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Content</text>
        <rect x="376" y="120" width="288" height="48" rx="6" fill="#0d1117" stroke="#9198a1" stroke-width="1.5"/>
        <text x="520.0" y="140.0" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Action, actor, user, session ID</text>
        <text x="520.0" y="156.0" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Content</text>
        <rect x="40" y="192" width="288" height="48" rx="6" fill="#0d1117" stroke="#9198a1" stroke-width="1.5"/>
        <text x="184.0" y="212.0" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">User; private unless shared</text>
        <text x="184.0" y="228.0" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Default access</text>
        <rect x="376" y="192" width="288" height="48" rx="6" fill="#0d1117" stroke="#9198a1" stroke-width="1.5"/>
        <text x="520.0" y="212.0" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Enterprise administrators</text>
        <text x="520.0" y="228.0" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Default access</text>
        <rect x="40" y="264" width="288" height="48" rx="6" fill="#0d1117" stroke="#9198a1" stroke-width="1.5"/>
        <text x="184.0" y="284.0" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Deletable in most places</text>
        <text x="184.0" y="300.0" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">User control</text>
        <rect x="376" y="264" width="288" height="48" rx="6" fill="#0d1117" stroke="#9198a1" stroke-width="1.5"/>
        <text x="520.0" y="284.0" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">No user deletion documented</text>
        <text x="520.0" y="300.0" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">User control</text>
        <rect x="40" y="336" width="288" height="48" rx="6" fill="#0d1117" stroke="#9198a1" stroke-width="1.5"/>
        <text x="184.0" y="356.0" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Until deleted</text>
        <text x="184.0" y="372.0" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Retention</text>
        <rect x="376" y="336" width="288" height="48" rx="6" fill="#0d1117" stroke="#9198a1" stroke-width="1.5"/>
        <text x="520.0" y="356.0" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">180 days, longer if streamed</text>
        <text x="520.0" y="372.0" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Retention</text>
        <text x="40" y="480" text-anchor="start" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Local client prompts are not in the audit log; a custom solution such as hooks is needed.</text>
        <text x="40" y="496" text-anchor="start" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Actions cloud agent session logs are shared with people who have repository access.</text>
        <line x1="40" y1="544" x2="664" y2="544" stroke="#3d444d"/>
        <text x="40" y="568" text-anchor="start" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="9" font-weight="400">Rectangle: attribute of each record; arrow: identifier link</text>
        <text x="40" y="588" text-anchor="start" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="9" font-weight="400">Green box: lesson focus, not approval or a safety rating</text>
      </svg>
