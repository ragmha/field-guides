<?xml version="1.0" encoding="UTF-8"?>
<svg id="session-data-anatomy-light-root" viewBox="0 0 704 476" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="session-data-anatomy-light-title session-data-anatomy-light-desc">
        <title id="session-data-anatomy-light-title">Four parts, four questions</title>
        <desc id="session-data-anatomy-light-desc">A session record holds prompts, responses, tools used and file changes. Where it runs, where it is stored, whether it syncs and who can access it are separate questions.</desc>
        <defs><marker id="session-data-anatomy-light-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#59636e"/></marker></defs>
        <rect x="0" y="0" width="704" height="476" fill="#f3f5f7"/>
        <path d="M 109 96 L 109 134" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#session-data-anatomy-light-arrow)"/>
        <path d="M 109 200 L 109 238" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#session-data-anatomy-light-arrow)"/>
        <path d="M 271 96 L 271 134" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#session-data-anatomy-light-arrow)"/>
        <path d="M 271 200 L 271 238" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#session-data-anatomy-light-arrow)"/>
        <path d="M 433 96 L 433 134" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#session-data-anatomy-light-arrow)"/>
        <path d="M 433 200 L 433 238" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#session-data-anatomy-light-arrow)"/>
        <path d="M 595 96 L 595 134" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#session-data-anatomy-light-arrow)"/>
        <path d="M 595 200 L 595 238" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#session-data-anatomy-light-arrow)"/>
        <rect x="40" y="40" width="138" height="56" rx="6" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <text x="109.0" y="64.0" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Prompts</text>
        <text x="109.0" y="80.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">What you asked</text>
        <rect x="40" y="240" width="138" height="64" rx="6" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <text x="109.0" y="268.0" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Where it runs</text>
        <text x="109.0" y="284.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Local, sandbox, Actions</text>
        <rect x="202" y="40" width="138" height="56" rx="6" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <text x="271.0" y="64.0" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Responses</text>
        <text x="271.0" y="80.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">What Copilot said</text>
        <rect x="202" y="240" width="138" height="64" rx="6" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <text x="271.0" y="268.0" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Where it is stored</text>
        <text x="271.0" y="284.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Disk, GitHub or both</text>
        <rect x="364" y="40" width="138" height="56" rx="6" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <text x="433.0" y="64.0" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Tools used</text>
        <text x="433.0" y="80.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Commands and calls</text>
        <rect x="364" y="240" width="138" height="64" rx="6" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <text x="433.0" y="268.0" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Is it synced?</text>
        <text x="433.0" y="284.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Copy to your account</text>
        <rect x="526" y="40" width="138" height="56" rx="6" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <text x="595.0" y="64.0" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">File changes</text>
        <text x="595.0" y="80.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Edits made</text>
        <rect x="526" y="240" width="138" height="64" rx="6" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <text x="595.0" y="268.0" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Who can access?</text>
        <text x="595.0" y="284.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Owner unless shared</text>
        <rect x="40" y="136" width="624" height="64" rx="6" fill="#eaf6ed" stroke="#1a7f37" stroke-width="1.5"/>
        <text x="352.0" y="164.0" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Session record</text>
        <text x="352.0" y="180.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Session history = the sessions you can query, resume, review or share</text>
        <text x="40" y="352" text-anchor="start" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Syncing is not sharing; running in the cloud is not sharing either.</text>
        <text x="40" y="368" text-anchor="start" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Querying history or /chronicle may send session data to the AI model.</text>
        <line x1="40" y1="416" x2="664" y2="416" stroke="#d1d9e0"/>
        <text x="40" y="440" text-anchor="start" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="9" font-weight="400">Rectangle: record or answer; arrow: feeds into</text>
        <text x="40" y="460" text-anchor="start" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="9" font-weight="400">Green box: lesson focus, not approval or a safety rating</text>
      </svg>
