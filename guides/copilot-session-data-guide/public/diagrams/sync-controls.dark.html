<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Does a local CLI session sync?</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif; background: #07090d; color: #f0f6fc; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 704px; min-width: 0; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow { font-size: .66rem; color: #9198a1; margin-bottom: .5rem; }
    h1 { font-size: 1.75rem; line-height: 1.15; margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 704px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Copilot Session Data · Flowchart</p>
    <h1>Does a local CLI session sync?</h1>
    <div class="diagram-container" tabindex="0" role="region" aria-label="Does a local CLI session sync?. Scroll horizontally to explore.">
      <svg viewBox="0 0 704 660" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sync-controls-dark-title sync-controls-dark-desc">
        <title id="sync-controls-dark-title">Does a local CLI session sync?</title>
        <desc id="sync-controls-dark-desc">With the policy allowing sync, a run flag decides first, then the remoteExport setting; by default the session syncs to the personal account and stays private.</desc>
        <defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#9198a1"/></marker></defs>
        <rect x="0" y="0" width="704" height="660" fill="#07090d"/>
        <path d="M 352 96 L 352 130" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#arrow)"/>
        <path d="M 456 180 L 494 180" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="464.1" y="163" width="21.9" height="12" rx="2" fill="#07090d"/><text x="475" y="172" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="8" font-weight="400">YES</text>
        <path d="M 352 228 L 352 280" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="359.7" y="249" width="16.6" height="12" rx="2" fill="#07090d"/><text x="368" y="258" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="8" font-weight="400">NO</text>
        <path d="M 456 330 L 494 330" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="464.1" y="313" width="21.9" height="12" rx="2" fill="#07090d"/><text x="475" y="322" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="8" font-weight="400">YES</text>
        <path d="M 352 378 L 352 430" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="359.7" y="399" width="16.6" height="12" rx="2" fill="#07090d"/><text x="368" y="408" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="8" font-weight="400">NO</text>
        <rect x="202" y="40" width="300" height="56" rx="20" fill="#0d1117" stroke="#9198a1" stroke-width="1.5"/>
        <text x="352.0" y="64.0" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Local CLI or app session</text>
        <text x="352.0" y="80.0" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Policy allows syncing (assumed)</text>
        <polygon points="352,132 456,180 352,228 248,180" fill="#0d1117" stroke="#9198a1" stroke-width="1.5"/>
        <text x="352" y="176" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">--sync-session</text>
        <text x="352" y="192" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="400">set for this run?</text>
        <rect x="496" y="152" width="168" height="56" rx="6" fill="#0d1117" stroke="#9198a1" stroke-width="1.5"/>
        <text x="580.0" y="176.0" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Flag decides</text>
        <text x="580.0" y="192.0" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">on syncs; off stays local</text>
        <polygon points="352,282 456,330 352,378 248,330" fill="#0d1117" stroke="#9198a1" stroke-width="1.5"/>
        <text x="352" y="326" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">remoteExport</text>
        <text x="352" y="342" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="400">set to false?</text>
        <rect x="496" y="302" width="168" height="56" rx="6" fill="#0d1117" stroke="#9198a1" stroke-width="1.5"/>
        <text x="580.0" y="326.0" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Stays local</text>
        <text x="580.0" y="342.0" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Opt-out in configuration</text>
        <rect x="192" y="432" width="320" height="56" rx="6" fill="#102219" stroke="#3fb950" stroke-width="1.5"/>
        <text x="352.0" y="456.0" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Syncs to your account</text>
        <text x="352.0" y="472.0" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Default; private until you share it</text>
        <text x="40" y="536" text-anchor="start" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">If the policy is off or cannot be determined, every path stays local.</text>
        <text x="40" y="552" text-anchor="start" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">VS Code: chat.sessionSync.enabled defaults to false (experimental).</text>
        <line x1="40" y1="600" x2="664" y2="600" stroke="#3d444d"/>
        <text x="40" y="624" text-anchor="start" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="9" font-weight="400">Oval: start; rectangle: outcome; diamond: decision; arrow: next step</text>
        <text x="40" y="644" text-anchor="start" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="9" font-weight="400">Green box: lesson focus, not approval or a safety rating</text>
      </svg>
    </div>
  </div>
</body>
</html>
