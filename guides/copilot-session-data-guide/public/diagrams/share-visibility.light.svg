<?xml version="1.0" encoding="UTF-8"?>
<svg id="share-visibility-light-root" viewBox="0 0 704 488" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="share-visibility-light-title share-visibility-light-desc">
        <title id="share-visibility-light-title">What sharing grants</title>
        <desc id="share-visibility-light-desc">Actions cloud agent sessions are shared by default; sandbox and synced local sessions are shared only on request. Recipients can view but cannot steer or query them.</desc>
        <defs><marker id="share-visibility-light-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#59636e"/></marker></defs>
        <rect x="0" y="0" width="704" height="488" fill="#f3f5f7"/>
        <path d="M 232 88 L 286 88" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#share-visibility-light-arrow)"/><rect x="237.4" y="69" width="43.1" height="12" rx="2" fill="#f3f5f7"/><text x="259" y="78" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="8" font-weight="400">DEFAULT</text>
        <path d="M 416 88 L 470 88" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#share-visibility-light-arrow)"/>
        <path d="M 232 188 L 286 188" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#share-visibility-light-arrow)"/><rect x="242.8" y="169" width="32.5" height="12" rx="2" fill="#f3f5f7"/><text x="259" y="178" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="8" font-weight="400">SHARE</text>
        <path d="M 416 188 L 470 188" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#share-visibility-light-arrow)"/>
        <path d="M 232 288 L 286 288" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#share-visibility-light-arrow)"/><rect x="242.8" y="269" width="32.5" height="12" rx="2" fill="#f3f5f7"/><text x="259" y="278" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="8" font-weight="400">SHARE</text>
        <path d="M 416 288 L 470 288" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#share-visibility-light-arrow)"/>
        <rect x="40" y="60" width="192" height="56" rx="6" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <text x="136.0" y="84.0" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Actions cloud agent</text>
        <text x="136.0" y="100.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Shared by default</text>
        <rect x="472" y="60" width="192" height="56" rx="6" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <text x="568.0" y="84.0" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Can view</text>
        <text x="568.0" y="100.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Prompts, responses, changes</text>
        <rect x="40" y="160" width="192" height="56" rx="6" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <text x="136.0" y="184.0" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Cloud sandbox</text>
        <text x="136.0" y="200.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Unshared by default</text>
        <rect x="472" y="160" width="192" height="56" rx="6" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <text x="568.0" y="184.0" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Cannot steer</text>
        <text x="568.0" y="200.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">View-only access</text>
        <rect x="40" y="260" width="192" height="56" rx="6" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <text x="136.0" y="284.0" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Synced local session</text>
        <text x="136.0" y="300.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Unshared by default</text>
        <rect x="472" y="260" width="192" height="56" rx="6" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <text x="568.0" y="284.0" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Not in their queries</text>
        <text x="568.0" y="300.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Only own sessions indexed</text>
        <rect x="288" y="60" width="128" height="256" rx="6" fill="#eaf6ed" stroke="#1a7f37" stroke-width="1.5"/>
        <text x="352.0" y="176.0" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Shared session</text>
        <text x="352.0" y="192.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">View-only for</text>
        <text x="352.0" y="208.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">repository readers</text>
        <text x="40" y="364" text-anchor="start" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Stop sharing with /share off or Sharing settings on GitHub.com.</text>
        <text x="40" y="380" text-anchor="start" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Cloud agent commits link to their session logs in the commit message.</text>
        <line x1="40" y1="428" x2="664" y2="428" stroke="#d1d9e0"/>
        <text x="40" y="452" text-anchor="start" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="9" font-weight="400">Rectangle: session type or recipient right; arrow: path to access</text>
        <text x="40" y="472" text-anchor="start" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="9" font-weight="400">Green box: lesson focus, not approval or a safety rating</text>
      </svg>
