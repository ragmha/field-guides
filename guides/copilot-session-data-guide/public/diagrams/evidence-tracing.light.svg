<?xml version="1.0" encoding="UTF-8"?>
<svg id="evidence-tracing-light-root" viewBox="0 0 704 408" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="evidence-tracing-light-title evidence-tracing-light-desc">
        <title id="evidence-tracing-light-title">Trace one agent change</title>
        <desc id="evidence-tracing-light-desc">A cloud agent commit links to its session log, and the audit event carries the same agent session ID. Access rules and retention limits shape each hop.</desc>
        <defs><marker id="evidence-tracing-light-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#59636e"/></marker></defs>
        <rect x="0" y="0" width="704" height="408" fill="#f3f5f7"/>
        <path d="M 200 88 L 270 88" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#evidence-tracing-light-arrow)"/><rect x="200.2" y="67" width="69.6" height="12" rx="2" fill="#f3f5f7"/><text x="235" y="76" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="8" font-weight="400">MESSAGE LINK</text>
        <path d="M 504 88 L 434 88" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#evidence-tracing-light-arrow)"/><rect x="439.5" y="67" width="59.0" height="12" rx="2" fill="#f3f5f7"/><text x="469" y="76" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="8" font-weight="400">SESSION ID</text>
        <path d="M 352 116 L 352 178" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#evidence-tracing-light-arrow)"/><rect x="338.4" y="141" width="27.2" height="12" rx="2" fill="#f3f5f7"/><text x="352" y="150" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="8" font-weight="400">VIEW</text>
        <path d="M 584 116 L 584 178" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#evidence-tracing-light-arrow)"/><rect x="565.1" y="141" width="37.8" height="12" rx="2" fill="#f3f5f7"/><text x="584" y="150" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="8" font-weight="400">STREAM</text>
        <rect x="40" y="60" width="160" height="56" rx="6" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <text x="120.0" y="84.0" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Signed commit</text>
        <text x="120.0" y="100.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Copilot author, co-author</text>
        <rect x="272" y="60" width="160" height="56" rx="6" fill="#eaf6ed" stroke="#1a7f37" stroke-width="1.5"/>
        <text x="352.0" y="84.0" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Agent session</text>
        <text x="352.0" y="100.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Log on the Agents tab</text>
        <rect x="504" y="60" width="160" height="56" rx="6" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <text x="584.0" y="84.0" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Audit event</text>
        <text x="584.0" y="100.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">actor:Copilot search</text>
        <rect x="272" y="180" width="160" height="56" rx="6" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <text x="352.0" y="204.0" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Access check</text>
        <text x="352.0" y="220.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Owner or repo readers</text>
        <rect x="504" y="180" width="160" height="56" rx="6" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <text x="584.0" y="204.0" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">SIEM copy</text>
        <text x="584.0" y="220.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">If streamed (preview)</text>
        <text x="40" y="284" text-anchor="start" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Audit log keeps 180 days; agent session streaming is public preview, EMU and data residency only.</text>
        <text x="40" y="300" text-anchor="start" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Record any hop you cannot complete, and why.</text>
        <line x1="40" y1="348" x2="664" y2="348" stroke="#d1d9e0"/>
        <text x="40" y="372" text-anchor="start" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="9" font-weight="400">Rectangle: record; arrow: identifier or access path</text>
        <text x="40" y="392" text-anchor="start" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="9" font-weight="400">Green box: lesson focus, not approval or a safety rating</text>
      </svg>
