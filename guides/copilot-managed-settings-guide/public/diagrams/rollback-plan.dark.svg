<?xml version="1.0" encoding="UTF-8"?>
<svg id="rollback-plan-dark-root" viewBox="0 0 704 612" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="rollback-plan-dark-title rollback-plan-dark-desc">
        <title id="rollback-plan-dark-title">Roll back by delivery method</title>
        <desc id="rollback-plan-dark-desc">Rollback lanes for server-managed, native MDM and file-based delivery, each with an action, a propagation time and a re-test, followed by a check that restrictive values from other sources still apply.</desc>
        <defs><marker id="rollback-plan-dark-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#9198a1"/></marker></defs>
        <rect x="0" y="0" width="704" height="612" fill="#07090d"/>
        <rect x="40" y="72" width="624" height="96" rx="6" fill="#07090d" stroke="#3d444d" stroke-width="1.5"/>
        <path d="M 296 120 L 344 120" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#rollback-plan-dark-arrow)"/>
        <path d="M 472 120 L 520 120" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#rollback-plan-dark-arrow)"/>
        <rect x="40" y="176" width="624" height="96" rx="6" fill="#07090d" stroke="#3d444d" stroke-width="1.5"/>
        <path d="M 296 224 L 344 224" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#rollback-plan-dark-arrow)"/>
        <path d="M 472 224 L 520 224" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#rollback-plan-dark-arrow)"/>
        <rect x="40" y="280" width="624" height="96" rx="6" fill="#07090d" stroke="#3d444d" stroke-width="1.5"/>
        <path d="M 296 328 L 344 328" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#rollback-plan-dark-arrow)"/>
        <path d="M 472 328 L 520 328" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#rollback-plan-dark-arrow)"/>
        <text x="232" y="56" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="8" font-weight="400">ACTION</text>
        <text x="408" y="56" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="8" font-weight="400">PROPAGATION</text>
        <text x="584" y="56" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="8" font-weight="400">VERIFY</text>
        <text x="56" y="124" text-anchor="start" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Server-managed</text>
        <rect x="168" y="90" width="128" height="60" rx="6" fill="#0d1117" stroke="#9198a1" stroke-width="1.5"/>
        <text x="232.0" y="116.0" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Revert commit</text>
        <text x="232.0" y="132.0" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Default branch</text>
        <rect x="344" y="90" width="128" height="60" rx="6" fill="#0d1117" stroke="#9198a1" stroke-width="1.5"/>
        <text x="408.0" y="116.0" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">About 1 hour</text>
        <text x="408.0" y="132.0" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Restart is immediate</text>
        <rect x="520" y="90" width="128" height="60" rx="6" fill="#0d1117" stroke="#9198a1" stroke-width="1.5"/>
        <text x="584.0" y="116.0" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Re-test</text>
        <text x="584.0" y="132.0" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Blocked and permitted</text>
        <text x="56" y="228" text-anchor="start" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Native MDM</text>
        <rect x="168" y="194" width="128" height="60" rx="6" fill="#0d1117" stroke="#9198a1" stroke-width="1.5"/>
        <text x="232.0" y="220.0" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Remove values</text>
        <text x="232.0" y="236.0" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">For the device group</text>
        <rect x="344" y="194" width="128" height="60" rx="6" fill="#0d1117" stroke="#9198a1" stroke-width="1.5"/>
        <text x="408.0" y="220.0" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Hourly check</text>
        <text x="408.0" y="236.0" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">No restart needed</text>
        <rect x="520" y="194" width="128" height="60" rx="6" fill="#0d1117" stroke="#9198a1" stroke-width="1.5"/>
        <text x="584.0" y="220.0" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Re-test</text>
        <text x="584.0" y="236.0" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Blocked and permitted</text>
        <text x="56" y="332" text-anchor="start" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">File-based</text>
        <rect x="168" y="298" width="128" height="60" rx="6" fill="#0d1117" stroke="#9198a1" stroke-width="1.5"/>
        <text x="232.0" y="324.0" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Replace file</text>
        <text x="232.0" y="340.0" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Or remove it</text>
        <rect x="344" y="298" width="128" height="60" rx="6" fill="#0d1117" stroke="#9198a1" stroke-width="1.5"/>
        <text x="408.0" y="324.0" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Restart clients</text>
        <text x="408.0" y="340.0" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Loads at startup</text>
        <rect x="520" y="298" width="128" height="60" rx="6" fill="#0d1117" stroke="#9198a1" stroke-width="1.5"/>
        <text x="584.0" y="324.0" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Re-test</text>
        <text x="584.0" y="340.0" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Blocked and permitted</text>
        <rect x="40" y="392" width="624" height="56" rx="6" fill="#102219" stroke="#3fb950" stroke-width="1.5"/>
        <text x="352.0" y="416.0" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Check every other source</text>
        <text x="352.0" y="432.0" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Deny unions, allowlist intersections and a disabled bypass mode still apply</text>
        <text x="40" y="488" text-anchor="start" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Removing a key restores lower-precedence behavior for that key.</text>
        <text x="40" y="504" text-anchor="start" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">For MCP lists, a failed fetch keeps the earlier policy, so a relaxing rollback needs a successful fetch.</text>
        <line x1="40" y1="552" x2="664" y2="552" stroke="#3d444d"/>
        <text x="40" y="576" text-anchor="start" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="9" font-weight="400">Lanes: delivery methods; columns: action, propagation, verification</text>
        <text x="40" y="596" text-anchor="start" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="9" font-weight="400">Green: lesson focus, not approval or a safety rating</text>
      </svg>
