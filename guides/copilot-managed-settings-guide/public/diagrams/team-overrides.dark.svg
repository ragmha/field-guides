<?xml version="1.0" encoding="UTF-8"?>
<svg id="team-overrides-dark-root" viewBox="0 0 704 532" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="team-overrides-dark-title team-overrides-dark-desc">
        <title id="team-overrides-dark-title">How team overrides resolve</title>
        <desc id="team-overrides-dark-desc">An overridable enterprise default, a team mapping and a team file combine: mapped team members get the team value, which replaces the whole default, and everyone else keeps the enterprise default.</desc>
        <defs><marker id="team-overrides-dark-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#9198a1"/></marker></defs>
        <rect x="0" y="0" width="704" height="532" fill="#07090d"/>
        <path d="M 232 76 L 256 76" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#team-overrides-dark-arrow)"/>
        <path d="M 448 76 L 472 76" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#team-overrides-dark-arrow)"/>
        <path d="M 352 112 L 352 160" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#team-overrides-dark-arrow)"/>
        <path d="M 224 208 L 192 208 A 8 8 0 0 0 184 216 L 184 296" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#team-overrides-dark-arrow)"/><rect x="192" y="240" width="24.5" height="12" rx="2" fill="#07090d"/><text x="204.25" y="249" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="8" font-weight="400">YES</text>
        <path d="M 480 208 L 512 208 A 8 8 0 0 1 520 216 L 520 296" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#team-overrides-dark-arrow)"/><rect x="528" y="240" width="19.0" height="12" rx="2" fill="#07090d"/><text x="537.5" y="249" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="8" font-weight="400">NO</text>
        <rect x="40" y="40" width="192" height="72" rx="6" fill="#0d1117" stroke="#9198a1" stroke-width="1.5"/>
        <text x="136.0" y="64.0" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Enterprise default</text>
        <text x="136.0" y="80.0" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">managed-settings.json</text>
        <text x="136.0" y="96.0" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">{ &quot;overridable&quot;: VALUE }</text>
        <rect x="256" y="40" width="192" height="72" rx="6" fill="#0d1117" stroke="#9198a1" stroke-width="1.5"/>
        <text x="352.0" y="64.0" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Team mapping</text>
        <text x="352.0" y="80.0" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">team-mappings.json</text>
        <text x="352.0" y="96.0" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">team slug to file</text>
        <rect x="472" y="40" width="192" height="72" rx="6" fill="#0d1117" stroke="#9198a1" stroke-width="1.5"/>
        <text x="568.0" y="64.0" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Team file</text>
        <text x="568.0" y="80.0" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">copilot/teams/*.json</text>
        <text x="568.0" y="96.0" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">replacement value</text>
        <polygon points="352,160 480,208 352,256 224,208" fill="#0d1117" stroke="#9198a1" stroke-width="1.5"/>
        <text x="352" y="212" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">User in a mapped team?</text>
        <rect x="40" y="296" width="288" height="72" rx="6" fill="#102219" stroke="#3fb950" stroke-width="1.5"/>
        <text x="184.0" y="320.0" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Team value applies</text>
        <text x="184.0" y="336.0" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Replaces the whole overridable default</text>
        <text x="184.0" y="352.0" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Include every rule you want to keep</text>
        <rect x="376" y="296" width="288" height="72" rx="6" fill="#0d1117" stroke="#9198a1" stroke-width="1.5"/>
        <text x="520.0" y="328.0" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Enterprise default applies</text>
        <text x="520.0" y="344.0" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">No applicable replacement</text>
        <text x="40" y="408" text-anchor="start" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Only keys wrapped in overridable can be replaced; unwrapped restrictions cannot be relaxed.</text>
        <text x="40" y="424" text-anchor="start" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Team files may also set more restrictive autoTier values and the additive enabledPlugins key.</text>
        <line x1="40" y1="472" x2="664" y2="472" stroke="#3d444d"/>
        <text x="40" y="496" text-anchor="start" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="9" font-weight="400">Rectangle: file or outcome; diamond: decision</text>
        <text x="40" y="516" text-anchor="start" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="9" font-weight="400">Green: lesson focus, not approval or a safety rating</text>
      </svg>
