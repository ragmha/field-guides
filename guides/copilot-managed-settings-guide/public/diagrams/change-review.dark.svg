<?xml version="1.0" encoding="UTF-8"?>
<svg id="change-review-dark-root" viewBox="0 0 704 452" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="change-review-dark-title change-review-dark-desc">
        <title id="change-review-dark-title">Stage a settings change</title>
        <desc id="change-review-dark-desc">A change lifecycle: propose by pull request, pass code owner review, validate, pilot with a mapped team, verify with a member and a non-member, change the default, then begin the next change.</desc>
        <defs><marker id="change-review-dark-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#9198a1"/></marker></defs>
        <rect x="0" y="0" width="704" height="452" fill="#07090d"/>
        <path d="M 216 88 L 264 88" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#change-review-dark-arrow)"/>
        <path d="M 440 88 L 488 88" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#change-review-dark-arrow)"/>
        <path d="M 576 120 L 576 224" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#change-review-dark-arrow)"/>
        <path d="M 488 256 L 440 256" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#change-review-dark-arrow)"/>
        <path d="M 264 256 L 216 256" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#change-review-dark-arrow)"/>
        <path d="M 128 224 L 128 120" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#change-review-dark-arrow)"/><rect x="136" y="164" width="68.5" height="12" rx="2" fill="#07090d"/><text x="170.25" y="173" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="8" font-weight="400">NEXT CHANGE</text>
        <rect x="40" y="56" width="176" height="64" rx="6" fill="#0d1117" stroke="#9198a1" stroke-width="1.5"/>
        <text x="128.0" y="84.0" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Propose by PR</text>
        <text x="128.0" y="100.0" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Key, clients, verification</text>
        <rect x="264" y="56" width="176" height="64" rx="6" fill="#0d1117" stroke="#9198a1" stroke-width="1.5"/>
        <text x="352.0" y="84.0" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Code owner review</text>
        <text x="352.0" y="100.0" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Ruleset-protected</text>
        <rect x="488" y="56" width="176" height="64" rx="6" fill="#0d1117" stroke="#9198a1" stroke-width="1.5"/>
        <text x="576.0" y="84.0" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Validate</text>
        <text x="576.0" y="100.0" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Settings and team files</text>
        <rect x="40" y="224" width="176" height="64" rx="6" fill="#0d1117" stroke="#9198a1" stroke-width="1.5"/>
        <text x="128.0" y="252.0" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Change default</text>
        <text x="128.0" y="268.0" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Widen after evidence</text>
        <rect x="264" y="224" width="176" height="64" rx="6" fill="#0d1117" stroke="#9198a1" stroke-width="1.5"/>
        <text x="352.0" y="252.0" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Verify</text>
        <text x="352.0" y="268.0" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Member and non-member</text>
        <rect x="488" y="224" width="176" height="64" rx="6" fill="#102219" stroke="#3fb950" stroke-width="1.5"/>
        <text x="576.0" y="252.0" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Pilot team</text>
        <text x="576.0" y="268.0" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Overridable plus team file</text>
        <text x="40" y="328" text-anchor="start" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">For device delivery, the pilot is an MDM assignment to a test device group.</text>
        <text x="40" y="344" text-anchor="start" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Keep the previous file version and MDM payload export for rollback.</text>
        <line x1="40" y1="392" x2="664" y2="392" stroke="#3d444d"/>
        <text x="40" y="416" text-anchor="start" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="9" font-weight="400">Boxes: stages; arrows: order; loop: the next change</text>
        <text x="40" y="436" text-anchor="start" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="9" font-weight="400">Green: lesson focus, not approval or a safety rating</text>
      </svg>
