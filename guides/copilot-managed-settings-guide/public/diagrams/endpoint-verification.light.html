<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verify on an endpoint</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif; background: #f3f5f7; color: #1f2328; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 704px; min-width: 0; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow { font-size: .66rem; color: #59636e; margin-bottom: .5rem; }
    h1 { font-size: 1.75rem; line-height: 1.15; margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 704px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Copilot Managed Settings · Flowchart</p>
    <h1>Verify on an endpoint</h1>
    <div class="diagram-container" tabindex="0" role="region" aria-label="Verify on an endpoint. Scroll horizontally to explore.">
      <svg viewBox="0 0 704 756" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="endpoint-verification-light-title endpoint-verification-light-desc">
        <title id="endpoint-verification-light-title">Verify on an endpoint</title>
        <desc id="endpoint-verification-light-desc">Pick a test user and device, confirm a supported client version, refresh the policy, check that a test action is blocked, run a permitted action, and record the evidence; if not blocked, investigate the source, mapping and version.</desc>
        <defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#59636e"/></marker></defs>
        <rect x="0" y="0" width="704" height="756" fill="#f3f5f7"/>
        <path d="M 216.0 96 L 216.0 128" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#arrow)"/>
        <path d="M 216.0 184 L 216.0 216" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#arrow)"/>
        <path d="M 216.0 272 L 216.0 308" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#arrow)"/>
        <path d="M 216.0 504 L 216.0 536" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#arrow)"/>
        <path d="M 216.0 404 L 216.0 448" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="224.0" y="418" width="24.5" height="12" rx="2" fill="#f3f5f7"/><text x="236.25" y="427" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="8" font-weight="400">YES</text>
        <path d="M 328.0 356 L 448 356" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="384" y="340" width="19.0" height="12" rx="2" fill="#f3f5f7"/><text x="393.5" y="349" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="8" font-weight="400">NO</text>
        <path d="M 556 328 L 556 252 A 8 8 0 0 0 548 244 L 376 244" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#arrow)"/>
        <rect x="56" y="40" width="320" height="56" rx="20" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <text x="216.0" y="64.0" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Pick a test user and device</text>
        <text x="216.0" y="80.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Authorized sandbox only</text>
        <rect x="56" y="128" width="320" height="56" rx="6" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <text x="216.0" y="152.0" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Confirm a supported client version</text>
        <text x="216.0" y="168.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Check minimum versions per key</text>
        <rect x="56" y="216" width="320" height="56" rx="6" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <text x="216.0" y="240.0" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Refresh the policy</text>
        <text x="216.0" y="256.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Restart, sign in, or sync</text>
        <polygon points="216.0,308 328.0,356 216.0,404 104.0,356" fill="#eaf6ed" stroke="#1a7f37" stroke-width="1.5"/>
        <text x="216.0" y="360" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Test action blocked?</text>
        <rect x="56" y="448" width="320" height="56" rx="6" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <text x="216.0" y="472.0" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Run a permitted action</text>
        <text x="216.0" y="488.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Rule is not broader than intended</text>
        <rect x="56" y="536" width="320" height="56" rx="20" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <text x="216.0" y="560.0" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Record the evidence</text>
        <text x="216.0" y="576.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Client, version, time, result</text>
        <rect x="448" y="328" width="216" height="56" rx="6" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <text x="556.0" y="352.0" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Investigate</text>
        <text x="556.0" y="368.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Source, mapping, version</text>
        <text x="40" y="632" text-anchor="start" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">A merged pull request or clean validation is not proof of effective behavior.</text>
        <text x="40" y="648" text-anchor="start" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Repeat with one member and one non-member when team overrides are involved.</text>
        <line x1="40" y1="696" x2="664" y2="696" stroke="#d1d9e0"/>
        <text x="40" y="720" text-anchor="start" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="9" font-weight="400">Oval: start/end; rectangle: action; diamond: decision</text>
        <text x="40" y="740" text-anchor="start" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="9" font-weight="400">Green: lesson focus, not approval or a safety rating</text>
      </svg>
    </div>
  </div>
</body>
</html>
