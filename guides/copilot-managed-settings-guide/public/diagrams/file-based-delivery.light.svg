<?xml version="1.0" encoding="UTF-8"?>
<svg id="file-based-delivery-light-root" viewBox="0 0 704 604" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="file-based-delivery-light-title file-based-delivery-light-desc">
        <title id="file-based-delivery-light-title">Deliver settings as a file</title>
        <desc id="file-based-delivery-light-desc">Write the settings file, place it with device management, and have users restart supported clients so the file loads at startup; until they restart, the previous policy stays loaded.</desc>
        <defs><marker id="file-based-delivery-light-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#59636e"/></marker></defs>
        <rect x="0" y="0" width="704" height="604" fill="#f3f5f7"/>
        <path d="M 208.0 96 L 208.0 136" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#file-based-delivery-light-arrow)"/>
        <path d="M 208.0 192 L 208.0 232" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#file-based-delivery-light-arrow)"/>
        <path d="M 208.0 336 L 208.0 384" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#file-based-delivery-light-arrow)"/><rect x="216.0" y="352" width="24.5" height="12" rx="2" fill="#f3f5f7"/><text x="228.25" y="361" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="8" font-weight="400">YES</text>
        <path d="M 328.0 284 L 424 284" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#file-based-delivery-light-arrow)"/><rect x="336" y="268" width="19.0" height="12" rx="2" fill="#f3f5f7"/><text x="345.5" y="277" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="8" font-weight="400">NO</text>
        <path d="M 544 312 L 544 404 A 8 8 0 0 1 536 412 L 360 412" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#file-based-delivery-light-arrow)"/>
        <rect x="56" y="40" width="304" height="56" rx="20" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <text x="208.0" y="64.0" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Write the settings file</text>
        <text x="208.0" y="80.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Same keys as managed-settings.json</text>
        <rect x="56" y="136" width="304" height="56" rx="6" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <text x="208.0" y="160.0" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Place it with device management</text>
        <text x="208.0" y="176.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Documented per-OS path</text>
        <polygon points="208.0,232 328.0,284 208.0,336 88.0,284" fill="#eaf6ed" stroke="#1a7f37" stroke-width="1.5"/>
        <text x="208.0" y="288" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Client restarted?</text>
        <rect x="56" y="384" width="304" height="56" rx="20" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <text x="208.0" y="408.0" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">File loads at startup</text>
        <text x="208.0" y="424.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Supported clients only</text>
        <rect x="424" y="256" width="240" height="56" rx="6" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <text x="544.0" y="280.0" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Previous policy stays loaded</text>
        <text x="544.0" y="296.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Ask users to restart</text>
        <text x="40" y="480" text-anchor="start" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Machines without the file receive no file-delivered settings.</text>
        <text x="40" y="496" text-anchor="start" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">File-based settings rank below MDM and server-managed settings.</text>
        <line x1="40" y1="544" x2="664" y2="544" stroke="#d1d9e0"/>
        <text x="40" y="568" text-anchor="start" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="9" font-weight="400">Oval: start/end; rectangle: action; diamond: decision</text>
        <text x="40" y="588" text-anchor="start" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="9" font-weight="400">Green: lesson focus, not approval or a safety rating</text>
      </svg>
