<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>One person across report scopes</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif; background: #f3f5f7; color: #1f2328; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 704px; min-width: 0; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow { font-size: .66rem; color: #59636e; margin-bottom: .5rem; }
    h1 { font-size: 1.75rem; line-height: 1.15; margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 704px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Copilot Metrics &amp; Adoption · Swimlane</p>
    <h1>One person across report scopes</h1>
    <div class="diagram-container" tabindex="0" role="region" aria-label="One person across report scopes. Scroll horizontally to explore.">
      <svg viewBox="0 0 704 672" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="org-attribution-dedup-light-title org-attribution-dedup-light-desc">
        <title id="org-attribution-dedup-light-title">One person across report scopes</title>
        <desc id="org-attribution-dedup-light-desc">A hypothetical developer with one seat who belongs to two organizations appears in both organization reports but only once in the enterprise report.</desc>
        <defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#59636e"/></marker></defs>
        <rect x="0" y="0" width="704" height="672" fill="#f3f5f7"/>
        <rect x="40" y="40" width="248" height="64" rx="6" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <text x="164.0" y="68.0" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Developer with one seat</text>
        <text x="164.0" y="84.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Seat from Org A; member of A and B</text>
        <rect x="40" y="136" width="624" height="80" rx="6" fill="#f3f5f7" stroke="#d1d9e0" stroke-width="1.5"/>
        <text x="56" y="180" text-anchor="start" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Org A report</text>
        <rect x="416" y="148" width="232" height="56" rx="6" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <text x="532.0" y="172.0" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Counted</text>
        <text x="532.0" y="188.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Attribution follows membership</text>
        <path d="M 288 72 L 336 72 L 336 176 L 416 176" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="349.5" y="158" width="41" height="12" rx="2" fill="#f3f5f7"/><text x="370.0" y="167.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="8" font-weight="400">MEMBER</text>
        <rect x="40" y="240" width="624" height="80" rx="6" fill="#f3f5f7" stroke="#d1d9e0" stroke-width="1.5"/>
        <text x="56" y="284" text-anchor="start" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Org B report</text>
        <rect x="416" y="252" width="232" height="56" rx="6" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <text x="532.0" y="276.0" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Counted again</text>
        <text x="532.0" y="292.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Org reports do not deduplicate</text>
        <path d="M 288 72 L 336 72 L 336 280 L 416 280" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="349.5" y="262" width="41" height="12" rx="2" fill="#f3f5f7"/><text x="370.0" y="271.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="8" font-weight="400">MEMBER</text>
        <rect x="40" y="344" width="624" height="80" rx="6" fill="#f3f5f7" stroke="#d1d9e0" stroke-width="1.5"/>
        <text x="56" y="388" text-anchor="start" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Org C report</text>
        <rect x="416" y="356" width="232" height="56" rx="6" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <text x="532.0" y="380.0" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Not included</text>
        <text x="532.0" y="396.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Not a member of Org C</text>
        <rect x="40" y="448" width="624" height="80" rx="6" fill="#f3f5f7" stroke="#d1d9e0" stroke-width="1.5"/>
        <text x="56" y="492" text-anchor="start" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Enterprise report</text>
        <rect x="416" y="460" width="232" height="56" rx="6" fill="#eaf6ed" stroke="#1a7f37" stroke-width="1.5"/>
        <text x="532.0" y="484.0" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Counted once</text>
        <text x="532.0" y="500.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Enterprise reports deduplicate</text>
        <path d="M 288 72 L 336 72 L 336 488 L 416 488" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="349.5" y="470" width="41" height="12" rx="2" fill="#f3f5f7"/><text x="370.0" y="479.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="8" font-weight="400">SEATED</text>
        <text x="40" y="588" text-anchor="start" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Sum of organization reports: 2. Enterprise report: 1. Do not add organization totals.</text>
        <line x1="40" y1="612" x2="664" y2="612" stroke="#d1d9e0"/>
        <text x="40" y="636" text-anchor="start" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="9" font-weight="400">Band: report scope; arrow: attribution of one hypothetical user</text>
        <text x="40" y="656" text-anchor="start" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="9" font-weight="400">Green box: lesson focus, not approval or a safety rating</text>
      </svg>
    </div>
  </div>
</body>
</html>
