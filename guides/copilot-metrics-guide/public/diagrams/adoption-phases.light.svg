<?xml version="1.0" encoding="UTF-8"?>
<svg id="adoption-phases-light-root" viewBox="0 0 704 776" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="adoption-phases-light-title adoption-phases-light-desc">
        <title id="adoption-phases-light-title">Assign an adoption phase</title>
        <desc id="adoption-phases-light-desc">Find features engaged on at least two distinct days in a trailing 28-day window, then assign the highest qualifying phase: multi-agent, agent first, code first or No Cohort.</desc>
        <defs><marker id="adoption-phases-light-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#59636e"/></marker></defs>
        <rect x="0" y="0" width="704" height="776" fill="#f3f5f7"/>
        <rect x="72" y="40" width="288" height="64" rx="20" fill="#eaf6ed" stroke="#1a7f37" stroke-width="1.5"/>
        <text x="216.0" y="68.0" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Find engaged features</text>
        <text x="216.0" y="84.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Used on 2+ distinct days in 28 days</text>
        <path d="M 216 104 L 216 152" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#adoption-phases-light-arrow)"/>
        <polygon points="216,152 352,196 216,240 80,196" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <text x="216.0" y="192.0" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Copilot app or 2+</text>
        <text x="216.0" y="208.0" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">agent surfaces?</text>
        <path d="M 352 196 L 424 196" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#adoption-phases-light-arrow)"/><rect x="375.75" y="178" width="24.5" height="12" rx="2" fill="#f3f5f7"/><text x="388.0" y="187.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="8" font-weight="400">YES</text>
        <rect x="424" y="164" width="240" height="64" rx="6" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <text x="544.0" y="192.0" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Phase 3: Multi-agent</text>
        <text x="544.0" y="208.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Highest qualifying phase wins</text>
        <path d="M 216 240 L 216 288" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#adoption-phases-light-arrow)"/><rect x="224" y="258" width="19" height="12" rx="2" fill="#f3f5f7"/><text x="233.5" y="267.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="8" font-weight="400">NO</text>
        <polygon points="216,288 352,332 216,376 80,332" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <text x="216.0" y="328.0" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Exactly one agent</text>
        <text x="216.0" y="344.0" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">surface engaged?</text>
        <path d="M 352 332 L 424 332" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#adoption-phases-light-arrow)"/><rect x="375.75" y="314" width="24.5" height="12" rx="2" fill="#f3f5f7"/><text x="388.0" y="323.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="8" font-weight="400">YES</text>
        <rect x="424" y="300" width="240" height="64" rx="6" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <text x="544.0" y="328.0" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Phase 2: Agent first</text>
        <text x="544.0" y="344.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">CLI, cloud agent or code review</text>
        <path d="M 216 376 L 216 424" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#adoption-phases-light-arrow)"/><rect x="224" y="394" width="19" height="12" rx="2" fill="#f3f5f7"/><text x="233.5" y="403.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="8" font-weight="400">NO</text>
        <polygon points="216,424 352,468 216,512 80,468" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <text x="216.0" y="464.0" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Code completion</text>
        <text x="216.0" y="480.0" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">or agent edit?</text>
        <path d="M 352 468 L 424 468" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#adoption-phases-light-arrow)"/><rect x="375.75" y="450" width="24.5" height="12" rx="2" fill="#f3f5f7"/><text x="388.0" y="459.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="8" font-weight="400">YES</text>
        <rect x="424" y="436" width="240" height="64" rx="6" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <text x="544.0" y="464.0" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Phase 1: Code first</text>
        <text x="544.0" y="480.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Completions or agent edits</text>
        <path d="M 216 512 L 216 560" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#adoption-phases-light-arrow)"/><rect x="224" y="530" width="19" height="12" rx="2" fill="#f3f5f7"/><text x="233.5" y="539.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="8" font-weight="400">NO</text>
        <rect x="72" y="560" width="288" height="64" rx="20" fill="#ffffff" stroke="#59636e" stroke-width="1.5"/>
        <text x="216.0" y="588.0" text-anchor="middle" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">No Cohort (Chat-first)</text>
        <text x="216.0" y="604.0" text-anchor="middle" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Conversational chat only</text>
        <text x="40" y="672" text-anchor="start" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Recalculated daily. Phases describe breadth of feature use, not volume, skill or productivity.</text>
        <line x1="40" y1="716" x2="664" y2="716" stroke="#d1d9e0"/>
        <text x="40" y="740" text-anchor="start" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="9" font-weight="400">Oval: start/end; rectangle: phase; diamond: decision; arrow: next check</text>
        <text x="40" y="760" text-anchor="start" fill="#59636e" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="9" font-weight="400">Green box: lesson focus, not approval or a safety rating</text>
      </svg>
