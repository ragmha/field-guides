<?xml version="1.0" encoding="UTF-8"?>
<svg id="active-user-definitions-dark-root" viewBox="0 0 704 528" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="active-user-definitions-dark-title active-user-definitions-dark-desc">
        <title id="active-user-definitions-dark-title">Active user counting windows</title>
        <desc id="active-user-definitions-dark-desc">Daily, weekly and monthly active users count distinct users over the report day, the trailing 7 days and the trailing 28 days, while the dashboard total covers the calendar month to date.</desc>
        <defs><marker id="active-user-definitions-dark-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#9198a1"/></marker></defs>
        <rect x="0" y="0" width="704" height="528" fill="#07090d"/>
        <text x="40" y="66" text-anchor="start" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">daily_active_users</text>
        <text x="40" y="82" text-anchor="start" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Report day only</text>
        <rect x="649.1428571428571" y="48" width="14.85714285714289" height="48" rx="6" fill="#0d1117" stroke="#9198a1" stroke-width="1.5"/>
        <text x="40" y="138" text-anchor="start" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">weekly_active_users</text>
        <text x="40" y="154" text-anchor="start" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Trailing 7 days</text>
        <rect x="560" y="120" width="104" height="48" rx="6" fill="#0d1117" stroke="#9198a1" stroke-width="1.5"/>
        <text x="40" y="210" text-anchor="start" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">monthly_active_users</text>
        <text x="40" y="226" text-anchor="start" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Trailing 28 days</text>
        <rect x="248" y="192" width="416" height="48" rx="6" fill="#102219" stroke="#3fb950" stroke-width="1.5"/>
        <text x="456.0" y="220.0" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Distinct users, 28 days</text>
        <text x="40" y="282" text-anchor="start" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Dashboard total active</text>
        <text x="40" y="298" text-anchor="start" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Calendar month to date</text>
        <rect x="381.7142857142857" y="264" width="282.2857142857143" height="48" rx="6" fill="#0d1117" stroke="#9198a1" stroke-width="1.5"/>
        <text x="522.8571428571429" y="292.0" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Licensed users, this month</text>
        <path d="M 248 360 L 664 360" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#active-user-definitions-dark-arrow)"/>
        <text x="248" y="384" text-anchor="start" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">27 days earlier</text>
        <text x="664" y="384" text-anchor="end" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Report day</text>
        <text x="40" y="424" text-anchor="start" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Active means user_initiated_interaction_count is above zero. CLI counts are reported separately.</text>
        <text x="40" y="440" text-anchor="start" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Distinct counts: never sum daily values to estimate a longer window.</text>
        <line x1="40" y1="468" x2="664" y2="468" stroke="#3d444d"/>
        <text x="40" y="492" text-anchor="start" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="9" font-weight="400">Bar: counting window ending on the report day; arrow: time</text>
        <text x="40" y="512" text-anchor="start" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="9" font-weight="400">Green bar: lesson focus, not approval or a safety rating</text>
      </svg>
