<?xml version="1.0" encoding="UTF-8"?>
<svg id="metrics-access-dark-root" viewBox="0 0 704 792" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="metrics-access-dark-title metrics-access-dark-desc">
        <title id="metrics-access-dark-title">Who can read Copilot metrics</title>
        <desc id="metrics-access-dark-desc">Check the usage metrics policy, then the enterprise or organization role or permission, and run automated downloads under a dedicated identity with the right token scope.</desc>
        <defs><marker id="metrics-access-dark-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#9198a1"/></marker></defs>
        <rect x="0" y="0" width="704" height="792" fill="#07090d"/>
        <rect x="152" y="40" width="288" height="64" rx="20" fill="#0d1117" stroke="#9198a1" stroke-width="1.5"/>
        <text x="296.0" y="68.0" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Reader or job requests metrics</text>
        <text x="296.0" y="84.0" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Dashboard, report endpoint or export</text>
        <path d="M 296 104 L 296 152" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#metrics-access-dark-arrow)"/>
        <polygon points="296,152 424,200 296,248 168,200" fill="#0d1117" stroke="#9198a1" stroke-width="1.5"/>
        <text x="296.0" y="196.0" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Usage metrics</text>
        <text x="296.0" y="212.0" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">policy enabled?</text>
        <path d="M 424 200 L 488 200" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#metrics-access-dark-arrow)"/><rect x="446.5" y="182" width="19" height="12" rx="2" fill="#07090d"/><text x="456.0" y="191.0" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="8" font-weight="400">NO</text>
        <rect x="488" y="168" width="176" height="64" rx="6" fill="#0d1117" stroke="#9198a1" stroke-width="1.5"/>
        <text x="576.0" y="196.0" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">No data returned</text>
        <text x="576.0" y="212.0" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Set under AI controls</text>
        <path d="M 296 248 L 296 300" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#metrics-access-dark-arrow)"/><rect x="304" y="268" width="24.5" height="12" rx="2" fill="#07090d"/><text x="316.25" y="277.0" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="8" font-weight="400">YES</text>
        <polygon points="296,300 396,344 296,388 196,344" fill="#0d1117" stroke="#9198a1" stroke-width="1.5"/>
        <text x="296.0" y="348.0" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Which scope?</text>
        <path d="M 196 344 L 152 344 L 152 436" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#metrics-access-dark-arrow)"/><rect x="160" y="384" width="63" height="12" rx="2" fill="#07090d"/><text x="191.5" y="393.0" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="8" font-weight="400">ENTERPRISE</text>
        <path d="M 396 344 L 496 344 L 496 436" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#metrics-access-dark-arrow)"/><rect x="504" y="384" width="74" height="12" rx="2" fill="#07090d"/><text x="541.0" y="393.0" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="8" font-weight="400">ORGANIZATION</text>
        <rect x="40" y="436" width="224" height="96" rx="6" fill="#0d1117" stroke="#9198a1" stroke-width="1.5"/>
        <text x="152.0" y="472.0" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Enterprise reports</text>
        <text x="152.0" y="488.0" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Owners, billing managers, or</text>
        <text x="152.0" y="504.0" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">View Enterprise Copilot Metrics</text>
        <rect x="376" y="436" width="240" height="96" rx="6" fill="#0d1117" stroke="#9198a1" stroke-width="1.5"/>
        <text x="496.0" y="472.0" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Organization reports</text>
        <text x="496.0" y="488.0" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Owners, or View organization</text>
        <text x="496.0" y="504.0" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Copilot metrics (custom role)</text>
        <path d="M 152 532 L 152 580" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#metrics-access-dark-arrow)"/>
        <path d="M 496 532 L 496 580" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#metrics-access-dark-arrow)"/>
        <rect x="40" y="580" width="624" height="80" rx="6" fill="#102219" stroke="#3fb950" stroke-width="1.5"/>
        <text x="352.0" y="608.0" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Automated jobs: a dedicated identity</text>
        <text x="352.0" y="624.0" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Classic tokens: manage_billing:copilot or read:enterprise; read:org for organizations</text>
        <text x="352.0" y="640.0" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Header X-GitHub-Api-Version: 2026-03-10</text>
        <text x="40" y="700" text-anchor="start" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Signed download links expire. Download and store the files, not the links.</text>
        <line x1="40" y1="732" x2="664" y2="732" stroke="#3d444d"/>
        <text x="40" y="756" text-anchor="start" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="9" font-weight="400">Oval: start; rectangle: outcome; diamond: decision; arrow: next step</text>
        <text x="40" y="776" text-anchor="start" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="9" font-weight="400">Green box: lesson focus, not approval or a safety rating</text>
      </svg>
