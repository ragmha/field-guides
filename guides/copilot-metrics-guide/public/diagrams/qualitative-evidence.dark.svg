<?xml version="1.0" encoding="UTF-8"?>
<svg id="qualitative-evidence-dark-root" viewBox="0 0 704 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="qualitative-evidence-dark-title qualitative-evidence-dark-desc">
        <title id="qualitative-evidence-dark-title">Metrics raise questions, people answer</title>
        <desc id="qualitative-evidence-dark-desc">Spot a metric change, ask developers through surveys, retrospectives or support trends, record respondent counts and dates, then explain and act before the next cycle.</desc>
        <defs><marker id="qualitative-evidence-dark-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#9198a1"/></marker></defs>
        <rect x="0" y="0" width="704" height="512" fill="#07090d"/>
        <rect x="40" y="56" width="240" height="72" rx="6" fill="#0d1117" stroke="#9198a1" stroke-width="1.5"/>
        <text x="160.0" y="88.0" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Spot a metric change</text>
        <text x="160.0" y="104.0" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">For example, acceptance rate falls</text>
        <path d="M 280 92 L 424 92" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#qualitative-evidence-dark-arrow)"/><rect x="337" y="74" width="30" height="12" rx="2" fill="#07090d"/><text x="352.0" y="83.0" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="8" font-weight="400">WHY?</text>
        <rect x="424" y="56" width="240" height="72" rx="6" fill="#102219" stroke="#3fb950" stroke-width="1.5"/>
        <text x="544.0" y="88.0" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Ask developers</text>
        <text x="544.0" y="104.0" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Anonymous, voluntary, 5+ per group</text>
        <path d="M 544 128 L 544 224" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#qualitative-evidence-dark-arrow)"/><rect x="552" y="170" width="46.5" height="12" rx="2" fill="#07090d"/><text x="575.25" y="179.0" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="8" font-weight="400">COLLECT</text>
        <rect x="424" y="224" width="240" height="72" rx="6" fill="#0d1117" stroke="#9198a1" stroke-width="1.5"/>
        <text x="544.0" y="256.0" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Record the evidence</text>
        <text x="544.0" y="272.0" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Respondents, population, dates</text>
        <path d="M 424 260 L 280 260" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#qualitative-evidence-dark-arrow)"/><rect x="328.75" y="242" width="46.5" height="12" rx="2" fill="#07090d"/><text x="352.0" y="251.0" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="8" font-weight="400">COMBINE</text>
        <rect x="40" y="224" width="240" height="72" rx="6" fill="#0d1117" stroke="#9198a1" stroke-width="1.5"/>
        <text x="160.0" y="256.0" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Explain and act</text>
        <text x="160.0" y="272.0" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Report with the metric it explains</text>
        <path d="M 160 224 L 160 128" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#qualitative-evidence-dark-arrow)"/><rect x="168" y="170" width="63" height="12" rx="2" fill="#07090d"/><text x="199.5" y="179.0" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="8" font-weight="400">NEXT CYCLE</text>
        <text x="40" y="344" text-anchor="start" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="600">QUALITATIVE SOURCES</text>
        <rect x="40" y="360" width="192" height="64" rx="6" fill="#0d1117" stroke="#9198a1" stroke-width="1.5"/>
        <text x="136.0" y="388.0" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Pulse surveys</text>
        <text x="136.0" y="404.0" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Usefulness, trust, obstacles</text>
        <rect x="256" y="360" width="192" height="64" rx="6" fill="#0d1117" stroke="#9198a1" stroke-width="1.5"/>
        <text x="352.0" y="388.0" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Retrospectives</text>
        <text x="352.0" y="404.0" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Tasks and workflow changes</text>
        <rect x="472" y="360" width="192" height="64" rx="6" fill="#0d1117" stroke="#9198a1" stroke-width="1.5"/>
        <text x="568.0" y="388.0" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Support trends</text>
        <text x="568.0" y="404.0" text-anchor="middle" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Fewer how-do-I questions</text>
        <line x1="40" y1="452" x2="664" y2="452" stroke="#3d444d"/>
        <text x="40" y="476" text-anchor="start" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="9" font-weight="400">Rectangle: step or source; arrow: next step in the loop</text>
        <text x="40" y="496" text-anchor="start" fill="#9198a1" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif" font-size="9" font-weight="400">Green box: lesson focus, not approval or a safety rating</text>
      </svg>
